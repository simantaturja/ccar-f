f the existing test passes, to keep the main session clean.", "correct": false, "explanation": "Forking is for exploring divergent approaches from a shared baseline. A single obvious fix has no alternatives to compare, and the test can be run in the main session directly; the fork adds ceremony without reducing risk."}, {"letter": "D", "text": "Use direct execution: have Claude add the null check in <code>formatInvoiceDate</code> and run the existing test to confirm the fix.", "correct": true, "explanation": "Direct execution is the right mode for a well-scoped change with a clear stack trace and a single file to modify. The work is understood, the verification already exists, and there are no design decisions to make. Reserving plan mode for tasks with architectural implications keeps it valuable when it matters."}], "overall": "", "domain": "Code Generation with Claude Code — Claude Code Config"}, {"prompt": "You are migrating from one date library to another across 45 files. The libraries differ in mutability semantics and timezone handling, so some call sites need more than a mechanical rename, and you are not yet sure which. Once the approach is settled, the per-file edits are repetitive. How should you use plan mode and direct execution for this task?", "options": [{"letter": "A", "text": "Stay in plan mode for the entire migration, producing a plan for each file and approving them one at a time before any edits are made.", "correct": false, "explanation": "Per-file planning turns 45 repetitive edits into 45 approval cycles. Once the semantic differences are mapped and the strategy chosen, the remaining work is well understood and does not benefit from further planning overhead."}, {"letter": "B", "text": "Use plan mode to inspect call sites, classify which need semantic changes, and agree the approach; then switch to direct execution.", "correct": true, "explanation": "The task has two phases with different characteristics: an investigation with genuine unknowns about timezone and mutability handling, and a repetitive implementation once the approach is fixed. Plan mode fits the first, direct execution fits the second, and combining them avoids both blind edits and needless ceremony."}, {"letter": "C", "text": "Use direct execution from the start, migrating files one by one and fixing timezone or mutability issues as they appear in tests.", "correct": false, "explanation": "Discovering the semantic differences file by file risks inconsistent handling across the 45 sites and rework when a late discovery invalidates earlier edits. The uncertainty is known up front, which is the signal to investigate before committing changes."}, {"letter": "D", "text": "Skip both modes and write a codemod script with <code>Bash</code> that performs the rename mechanically, then hand-fix any test failures.", "correct": false, "explanation": "A mechanical codemod handles the renames but the scenario states some call sites need non-mechanical changes, which the script will silently get wrong. It also bypasses the exploration that would identify those sites before they break."}], "overall": "", "domain": "Code Generation with Claude Code — Claude Code Config"}, {"prompt": "You ask Claude Code to add a caching layer to a service in a domain you know poorly. The first implementation is clean but has to be scrapped when a colleague points out that cache entries must be invalidated on a user-permission change you never mentioned. You expect further hidden requirements of this kind. Which technique best prevents a repeat on the next attempt?", "options": [{"letter": "A", "text": "Write a detailed specification listing every requirement you can think of, including invalidation, then have Claude implement it in one pass.", "correct": false, "explanation": "The failure was a requirement you did not know to write down; a longer specification from the same author has the same blind spots. Effort spent enumerating what you already know does not surface what you do not."}, {"letter": "B", "text": "Enter plan mode so Claude explores the codebase and proposes a caching design for your approval before implementing anything.", "correct": false, "explanation": "Plan mode helps Claude understand the code, but the missing knowledge here is domain and operational, such as when permissions change, which the codebase may not encode. Exploration alone will not reliably raise questions about requirements that live in your head or your colleagues' heads."}, {"letter": "C", "text": "Ask Claude to interview you first about invalidation, consistency, and failure modes, and implement only after you have answered.", "correct": true, "explanation": "The interview pattern uses the model's breadth to surface considerations you did not anticipate, such as invalidation triggers and failure behaviour, before code is written. It is the technique aimed precisely at unfamiliar domains where the developer cannot enumerate requirements up front, and it costs a few minutes rather than a rewrite."}, {"letter": "D", "text": "Write a test suite for the caching behaviour first and let Claude iterate against failing tests until they pass.", "correct": false, "explanation": "Test-driven iteration is powerful when you know the expected behaviour and want consistent implementation. You cannot write a test for an invalidation rule you have not discovered yet, so the tests would encode the same gaps as the first attempt."}], "overall": "", "domain": "Code Generation with Claude Code — Claude Code Config"}, {"prompt": "A generated report-query function has three defects: pagination uses the wrong offset, results are sorted before filtering, and duplicates are removed before the sort. You fixed the offset in one message and the sort order in a second, but the second fix reintroduced duplicates because the three behaviours interact. How should you drive the next iteration?", "options": [{"letter": "A", "text": "Describe all three issues, their interactions, and the required final ordering of operations in one detailed message.", "correct": true, "explanation": "When defects interact, fixing them one at a time lets each fix disturb the others, which is what happened. A single message that states every issue and the intended operation order lets Claude reason about them together and produce one consistent implementation. Sequential iteration is for independent problems."}, {"letter": "B", "text": "Continue fixing one issue per message, but ask Claude to run the full test suite after each change so regressions are caught immediately.", "correct": false, "explanation": "Tests catch the regressions but do not prevent them; the sequence still causes each fix to interfere with the others, so you keep cycling. Detection after the fact is slower than giving Claude the complete picture once."}, {"letter": "C", "text": "Start a fresh session and ask Claude to rewrite the function from scratch without referencing the previous attempts.", "correct": false, "explanation": "A fresh rewrite discards the correct parts and the understanding built so far, and without a statement of the three interacting requirements the new version can land on a different wrong combination. The missing ingredient is a complete description, not a clean slate."}, {"letter": "D", "text": "Ask Claude to review the function itself and list the defects it can find, then fix whichever it identifies.", "correct": false, "explanation": "Self-review may or may not surface the interaction, and it shifts requirements discovery to the model when you already know all three issues. Providing the known defects directly is faster and more reliable than hoping they are rediscovered."}], "overall": "", "domain": "Code Generation with Claude Code — Claude Code Config"}, {"prompt": "You are trialling an experimental Postgres MCP server that points at a local database only you have. You added it to the repository's <code>.mcp.json</code> so it would load automatically. After you pushed, three teammates reported connection errors at Claude Code start-up and a cluttered tool list. You still want the server for your own work. Where should the configuration live?", "options": [{"letter": "A", "text": "Keep it in <code>.mcp.json</code> but read the connection string from an environment variable so teammates without the variable get a disabled server.", "correct": false, "explanation": "Environment variable expansion is for keeping credentials out of a server the whole team should have. A server that only one person uses still appears in everyone's configuration, and a missing variable causes a failed connection rather than a clean absence."}, {"letter": "B", "text": "Add <code>.mcp.json</code> to <code>.gitignore</code> so each developer maintains their own copy and your Postgres entry is not pushed.", "correct": false, "explanation": "Project-scoped <code>.mcp.json</code> exists to share team tooling through version control; ignoring it removes that benefit for every shared server the team relies on. It solves your problem by breaking the mechanism for everyone else."}, {"letter": "C", "text": "Move the server to your user-scoped <code>~/.claude.json</code>, which applies only to you and coexists with the project's shared servers.", "correct": true, "explanation": "MCP servers are scoped deliberately: project-level <code>.mcp.json</code> is for tooling the whole team should share, and user-level <code>~/.claude.json</code> is for personal or experimental servers. Moving the Postgres server to user scope removes it from teammates' sessions while tools from both scopes remain available to you simultaneously."}, {"letter": "D", "text": "Leave it in <code>.mcp.json</code> and document in the README that teammates can remove the entry locally if they do not need it.", "correct": false, "explanation": "Asking teammates to hand-edit a shared file creates local diffs that conflict with every future change to <code>.mcp.json</code>, and new joiners hit the errors again. The configuration system already provides a personal scope for this case."}], "overall": "", "domain": "Developer Productivity with Claude — Claude Code Config"}, {"prompt": "You ask Claude Code to implement a token-bucket rate limiter with a clear specification: burst size, refill rate, and behaviour at exact boundaries. Three attempts described in prose each pass the happy path but mishandle a different edge case: refill during a burst, zero-capacity buckets, and clock rollover. You know precisely what correct behaviour looks like. What approach yields a correct implementation fastest?", "options": [{"letter": "A", "text": "Ask Claude to interview you about the rate limiter's requirements before writing a fourth version.", "correct": false, "explanation": "The interview pattern helps when the developer does not know what to specify. Here the specification is clear and the edge cases are known; the gap is between your understanding and the implementation, which executable checks close more directly than more conversation."}, {"letter": "B", "text": "Enter plan mode so Claude designs the algorithm and data structures before implementing, reducing the chance of edge-case mistakes.", "correct": false, "explanation": "The algorithm is well known and the failures are not design failures but boundary-handling slips. A plan describes intent; it does not verify behaviour at the boundaries where the previous attempts went wrong."}, {"letter": "C", "text": "Provide a longer prose description that spells out each of the three edge cases explicitly alongside the original specification.", "correct": false, "explanation": "Prose has already produced three inconsistent interpretations, and a fourth attempt may fix the named cases while breaking another. Text descriptions of boundary behaviour are exactly where interpretation drifts; tests remove the interpretation."}, {"letter": "D", "text": "Write a test suite covering the expected behaviour and the three edge cases, then have Claude iterate against the failing tests.", "correct": true, "explanation": "When correct behaviour is precisely known, test-driven iteration is the most efficient loop: the tests define the edge cases unambiguously, and each iteration is guided by concrete failures rather than reinterpreted prose. The suite also prevents a fix for one boundary from silently breaking another."}], "overall": "", "domain": "Developer Productivity with Claude — Claude Code Config"}, {"prompt": "Your root CLAUDE.md includes roughly 300 lines of Terraform conventions: module layout, naming, state handling, and provider pinning. Most engineers work only in the application code under <code>src/</code> and never touch <code>terraform/</code>, yet those 300 lines load into every session and consume context that long debugging sessions need. The conventions must still apply reliably when someone edits infrastructure. What should you do?", "options": [{"letter": "A", "text": "Shorten the Terraform section to a 40-line summary and link to the full conventions in a wiki page engineers can open when they need the detail.", "correct": false, "explanation": "A summary still loads for everyone and loses the detail that makes the conventions reliable, while a wiki link is outside Claude's context unless someone pastes it in. This trades reliability for a smaller but still unconditional cost."}, {"letter": "B", "text": "Move the conventions to <code>.claude/rules/terraform.md</code> with frontmatter <code>paths: [\"terraform/**/*\"]</code> so they load only for infrastructure edits.", "correct": true, "explanation": "Path-scoped rules load conditionally: the Terraform conventions appear in context only when matching files are being worked on, so application sessions reclaim the 300 lines while infrastructure edits still get the full guidance automatically. This is the mechanism designed for conventions that apply to a subset of the codebase."}, {"letter": "C", "text": "Turn the conventions into a <code>/terraform</code> skill that engineers invoke before doing infrastructure work.", "correct": false, "explanation": "A skill depends on the engineer remembering to invoke it; the requirement is that conventions apply reliably whenever infrastructure is edited. Conventions tied to files should load from the files being touched, not from a manual command."}, {"letter": "D", "text": "Leave CLAUDE.md as is and advise engineers to run <code>/compact</code> earlier in long sessions to offset the extra context usage.", "correct": false, "explanation": "Compaction summarises the conversation, not the always-loaded instructions, so the 300 lines remain on every turn. It also degrades session history to compensate for context that most engineers never needed in the first place."}], "overall": "", "domain": "Developer Productivity with Claude — Claude Code Config"}, {"prompt": "Your CI job runs <code>claude -p</code> to generate tests for changed modules. Developers reject most of the output: tests for trivial getters, duplicated setup code instead of the shared fixtures in <code>tests/fixtures/</code>, and no coverage of the failure paths your team considers essential. The prompt itself is a single line asking for \"thorough tests\". What is the most effective and durable fix?", "options": [{"letter": "A", "text": "Raise the job's turn limit so Claude has time to discover the fixtures directory and infer the team's testing philosophy from existing tests.", "correct": false, "explanation": "More turns lets Claude explore, but inference from examples is inconsistent and costly on every run, and it may still conclude that getters deserve tests. Standards the team already holds should be stated, not rediscovered each time the job runs."}, {"letter": "B", "text": "Pass the contents of the fixtures directory and a list of testing rules as arguments to the prompt on each CI invocation.", "correct": false, "explanation": "Injecting the same material into every run works but lives in the pipeline script, invisible to developers using Claude Code interactively and easy to let drift from the real conventions. Project context that applies everywhere belongs in project configuration."}, {"letter": "C", "text": "Document the testing standards, what makes a test valuable, and the available fixtures in the project's CLAUDE.md.", "correct": true, "explanation": "CLAUDE.md is the mechanism for giving Claude Code project context, and CI invocations load it just as interactive sessions do. Stating which tests are valuable, which are not, and where fixtures live addresses all three complaints at the source, and the guidance stays in version control alongside the code it describes."}, {"letter": "D", "text": "Switch the job to the Message Batches API so the extra cost of generating and later discarding low-value tests is halved.", "correct": false, "explanation": "Cheaper generation of unwanted tests does not make them wanted. The problem is missing project context, not cost, and batch processing changes neither the prompt nor what Claude knows about your fixtures and standards."}], "overall": "", "domain": "Claude Code for Continuous Integration — Claude Code Config"}, {"prompt": "To keep the CI image small, your review job checks out only the changed files into a temporary directory and runs <code>claude -p \"Review these changes\"</code> there. Reviews are generic: they ignore the team's error-handling rules and flag patterns the repository deliberately uses. The same prompt run by a developer from the repository root produces reviews that follow the conventions. What is the cause?", "options": [{"letter": "A", "text": "The <code>-p</code> flag disables loading of project instructions, so CI runs need the conventions passed explicitly in the prompt.", "correct": false, "explanation": "Non-interactive mode changes how input and output are handled, not which project files are loaded. Claude Code in <code>-p</code> mode still reads the project's CLAUDE.md when run inside the project; the developer's interactive run is not what makes the difference."}, {"letter": "B", "text": "The temporary directory has no CLAUDE.md, so the run lacks the project context the developer's session loads from the repository root.", "correct": true, "explanation": "CLAUDE.md is discovered from the working directory hierarchy. A scratch directory holding only the diffed files has no project configuration, so the CI run reviews with no knowledge of the team's conventions. Running inside the repository checkout, or otherwise making the project CLAUDE.md available, restores the behaviour the developer sees."}, {"letter": "C", "text": "CI runs use a different model tier by default, which follows conventions less reliably than the interactive default.", "correct": false, "explanation": "Model selection does not change between interactive and non-interactive use unless configured. Attributing the gap to model quality ignores the concrete difference in the two setups, which is where the command is run and what configuration is present there."}, {"letter": "D", "text": "The diff-only checkout lacks the surrounding code, and Claude needs the full files to recognise the repository's deliberate patterns.", "correct": false, "explanation": "Missing surrounding code can weaken a review, but the specific complaint is that team rules are ignored and sanctioned patterns are flagged, which is a conventions problem. Those conventions are written down in CLAUDE.md, and that file is what the temporary directory lacks."}], "overall": "", "domain": "Claude Code for Continuous Integration — Claude Code Config"}, {"prompt": "Your CI pipeline has a step where Claude Code writes a fix for a failing test, followed by a step that reviews the fix. To \"reuse context and save tokens\", the review step resumes the generation session and asks \"Review the change you just made for bugs.\" The review approves nearly every fix, including several later found to break adjacent behaviour. How should the review step be configured?", "options": [{"letter": "A", "text": "Keep the resumed session but enable extended thinking for the review turn so the model reasons more carefully about its own change.", "correct": false, "explanation": "More reasoning within the same session still starts from the generation rationale already in context, so the reviewer inherits the same conclusions it is meant to question. Extended thinking does not remove the bias of self-review; it thinks harder along the same lines."}, {"letter": "B", "text": "Keep the resumed session but add a strict review checklist to the prompt so the model checks specific failure categories rather than approving in general.", "correct": false, "explanation": "A checklist improves structure, but the model has already judged its change correct during generation and will tend to confirm that judgment when it sees the same reasoning in its history. Prompt rigour cannot substitute for independence when the reviewer is the author."}, {"letter": "C", "text": "Run the review as a fresh, independent <code>claude -p</code> invocation that receives the diff and the project context but not the generation session's reasoning.", "correct": true, "explanation": "A model reviewing its own session retains the reasoning that led to the change and is unlikely to question it, which matches the near-universal approvals. An independent instance sees only the diff and the project's conventions, so it evaluates the change on its merits. The token saving from resuming is small next to the cost of missed defects."}, {"letter": "D", "text": "Replace the review step with a second generation attempt in a new session and merge whichever version passes the most tests.", "correct": false, "explanation": "Producing two fixes and picking by test count is not a review: neither version has been examined for the adjacent breakage that the tests evidently did not cover. The step should scrutinise the proposed change, and a fresh reviewer does that directly."}], "overall": "", "domain": "Claude Code for Continuous Integration — Claude Code Config"}, {"prompt": "Your system prompt tells the agent to \"use good judgement when deciding whether a refund can be approved directly\". Audits show inconsistent outcomes: a $40 damaged-item refund with photo evidence was escalated on Monday and approved on Tuesday by the same agent build, and a $600 refund with no evidence was approved outright. Finance wants predictable behaviour without adding infrastructure. What change is most effective?", "options": [{"letter": "A", "text": "Change the instruction to \"be conservative and escalate whenever you are not highly confident the refund qualifies under policy\".", "correct": false, "explanation": "Confidence-based wording is another form of vague instruction; the model's confidence is poorly calibrated and the same case will still fall on different sides of the line from run to run. It also biases toward escalation, hurting first-contact resolution without making the boundary explicit."}, {"letter": "B", "text": "Have the agent output a 1 to 10 confidence score with each decision and escalate automatically when the score is below 7.", "correct": false, "explanation": "Self-reported confidence is an unreliable proxy for whether a case actually meets policy, and the agent already approved a $600 unsupported refund, so it would likely have scored that highly. Thresholding a noisy number does not create a consistent rule."}, {"letter": "C", "text": "Lower the sampling temperature for the decision turn so the agent's judgement becomes deterministic across similar refund cases.", "correct": false, "explanation": "Lower temperature reduces variance in wording, but the decision boundary remains undefined, so which side a case falls on is still arbitrary. Consistency in outcome comes from an explicit rule, not from making an unspecified judgement more repeatable."}, {"letter": "D", "text": "Replace it with explicit criteria: auto-approve under $100 with photo evidence within 30 days; escalate above $500 or without evidence.", "correct": true, "explanation": "Vague instructions like \"use good judgement\" leave the boundary to the model, which is why identical cases diverge. Specific categorical criteria define exactly which situations resolve and which escalate, giving Finance the predictability they need through the prompt alone. Guidance phrased as confidence or conservatism does not have the same effect."}], "overall": "", "domain": "Customer Support Resolution Agent — Prompt & Structured Output"}, {"prompt": "You want Claude Code to flag N+1 query patterns during refactoring. With a rule-based prompt listing known shapes, it flags every loop containing a database call, including loops that operate on an already-batched query result, and misses N+1 patterns expressed through lazy-loading accessors it has not seen listed. Developers are ignoring the warnings. Which prompting approach best addresses both the false positives and the missed variants?", "options": [{"letter": "A", "text": "Add 2 to 4 few-shot examples contrasting a genuine N+1 with an acceptable batched loop, each explaining what distinguishes them.", "correct": true, "explanation": "Few-shot examples that pair a real issue with a superficially similar acceptable pattern, and explain why they differ, teach the model the judgement rather than the surface shape. That judgement generalises to lazy-loading variants no list anticipated, and it stops flagging loops over already-batched data. Rules match shapes; examples convey reasoning."}, {"letter": "B", "text": "Extend the rule list to include every known N+1 shape, including lazy-loading accessors, and add explicit exceptions for batched results.", "correct": false, "explanation": "A longer list catches the variants you have already seen and no others, and the exception clauses grow with each false positive. The model is being asked to pattern-match rather than reason, which is the source of both problems."}, {"letter": "C", "text": "Instruct the model to report N+1 findings only when it is highly confident, to suppress the batched-loop false positives.", "correct": false, "explanation": "Confidence wording rarely improves precision because the model is not well calibrated about which loops are genuinely problematic. It may also suppress the true positives on unfamiliar variants, worsening recall while leaving the underlying confusion in place."}, {"letter": "D", "text": "Remove the N+1 check from the prompt and rely on the ORM's query logging in tests to catch the pattern at runtime.", "correct": false, "explanation": "Runtime detection is a useful safety net but only fires for code paths the tests exercise, and it moves feedback from refactoring time to test time. Dropping the check abandons the goal instead of improving the prompt that implements it."}], "overall": "", "domain": "Code Generation with Claude Code — Prompt & Structured Output"}, {"prompt": "Developers complain that 40% of your automated review findings are noise. You added \"only report issues you are highly confident about\" to the prompt; two weeks later the false positive rate is unchanged and a few real bugs were dropped. The prompt still describes the review goal as \"identify problems with the code\". What change is most likely to improve precision?", "options": [{"letter": "A", "text": "Strengthen the wording to \"report only issues you are certain are bugs\" and cap the review at five findings per pull request.", "correct": false, "explanation": "Escalating the confidence language repeats the change that just failed, and a finding cap drops real issues on large PRs while doing nothing for precision on small ones. Neither tells the model what to report."}, {"letter": "B", "text": "Ask the model to attach a numeric confidence to each finding and have the pipeline discard anything below 0.8 before posting comments.", "correct": false, "explanation": "Numeric self-reported confidence is poorly calibrated, so a threshold removes a roughly random slice of findings, including real bugs, while retaining confidently wrong ones. Filtering on a noisy score does not fix a review that lacks defined criteria."}, {"letter": "C", "text": "Replace \"identify problems\" with specific criteria: report bugs, security flaws, and data-loss risks; skip style, naming, and existing repository patterns.", "correct": true, "explanation": "General instructions such as \"be conservative\" or \"only high confidence\" do not improve precision because they leave the category boundaries undefined. Explicit criteria for what to report and what to skip give the model a decision rule it can apply consistently, which is what removes the noise without dropping real bugs."}, {"letter": "D", "text": "Run the review twice with different sampling seeds and post only the findings that appear in both runs, treating agreement as a precision filter.", "correct": false, "explanation": "Agreement between two runs of the same underspecified prompt confirms consistent misjudgements as readily as real bugs, and doubles cost. Consensus reduces variance, not the systematic false positives that come from unclear criteria."}], "overall": "", "domain": "Claude Code for Continuous Integration — Prompt & Structured Output"}, {"prompt": "Your review bot emits structured findings with file, line, severity, and message. Developers dismiss roughly 35% of findings, but you cannot tell which kinds of code trigger the dismissed ones, because dismissal only records the finding ID. You want to systematically improve the prompt based on real dismissal data. What should you add?", "options": [{"letter": "A", "text": "A required free-text dismissal reason that developers must enter before a finding can be closed, so patterns can be read from the reasons.", "correct": false, "explanation": "Mandatory reasons produce terse, inconsistent text under time pressure and add friction that developers resent. The aggregation you need is by code construct, which the model can record at detection time far more consistently than humans can after the fact."}, {"letter": "B", "text": "A <code>detected_pattern</code> field in each finding naming the code construct that triggered it, so dismissals can be grouped by pattern.", "correct": true, "explanation": "Recording which construct produced each finding turns dismissal logs into a dataset: group by <code>detected_pattern</code>, and the high-dismissal patterns show exactly where the prompt over-flags. That enables targeted few-shot examples or criteria changes for those patterns rather than guesswork. It costs one field and no developer effort."}, {"letter": "C", "text": "A weekly A/B test that runs two prompt variants on the same pull requests and keeps the one with the lower dismissal rate.", "correct": false, "explanation": "A/B testing measures whether a change helped but gives no insight into what to change; without knowing which patterns are being dismissed, the variants are guesses. Diagnostic data has to come first."}, {"letter": "D", "text": "Fewer finding categories, merging the noisiest ones into a single \"maintainability\" bucket to simplify the analysis.", "correct": false, "explanation": "Coarser categories hide the very distinctions you need to see, and you do not yet know which categories are noisiest, which is the question you are trying to answer. Reducing resolution before measuring is the wrong order."}], "overall": "", "domain": "Claude Code for Continuous Integration — Prompt & Structured Output"}, {"prompt": "You are launching a weekly whole-codebase audit over 2,000 files using the Message Batches API. On the first run 30% of results were unusable because the prompt produced inconsistent formats, so you fixed the prompt and resubmitted all 2,000 files, twice, each cycle taking up to a day. Leadership is questioning the cost and the delay. What process change prevents this next time?", "options": [{"letter": "A", "text": "Refine the prompt synchronously on a representative sample of files until output is consistent, then submit the full batch.", "correct": true, "explanation": "Batch processing has a long turnaround and no latency guarantee, so each iteration on the prompt is expensive in time and money. Refining on a small sample with synchronous calls gives fast feedback and maximises first-pass success, so the 2,000-file batch is submitted once with a prompt already known to work."}, {"letter": "B", "text": "Split the audit into four batches of 500 files so a formatting problem is discovered after the first batch rather than the whole run.", "correct": false, "explanation": "Smaller batches limit the blast radius but still discover problems only after a full batch turnaround, and the fix is applied to later batches while the first still needs resubmission. Fast iteration needs the synchronous API on a sample, not smaller slow batches."}, {"letter": "C", "text": "Switch the audit to synchronous API calls so malformed results can be retried immediately as they occur.", "correct": false, "explanation": "The audit is latency-tolerant weekly work, which is exactly where the batch discount belongs. Abandoning it doubles the recurring cost to solve a problem that only exists because the prompt was not validated before the first submission."}, {"letter": "D", "text": "Enforce the output format with a JSON schema via tool use so that inconsistent formatting can no longer occur in batch results.", "correct": false, "explanation": "Schema enforcement is a good addition and removes syntax-level variation, but it does not protect against semantic or content problems in an untested prompt, which would again surface only after a day-long batch. Validating on a sample first is the process fix regardless of output mechanism."}], "overall": "", "domain": "Claude Code for Continuous Integration — Prompt & Structured Output"}, {"prompt": "Your CI review bot calls the Messages API directly and asks in the prompt for \"a JSON array of findings with file, line, severity, and message\". About 6% of responses fail to parse: trailing commentary before the array, a code fence around it, or a missing closing bracket on long reviews. You have added retries, which doubles cost on those runs. What is the most reliable fix?", "options": [{"letter": "A", "text": "Post-process the response with a lenient parser that strips fences and commentary and repairs unbalanced brackets before parsing.", "correct": false, "explanation": "Repair heuristics handle the failure modes seen so far and break on the next one, and a bracket repair can silently produce a valid array with a truncated finding. Cleaning up free text is a workaround for not having asked for structured output in the first place."}, {"letter": "B", "text": "Add explicit instructions: \"Output only the JSON array, no prose, no code fences\", and provide one example of a valid response.", "correct": false, "explanation": "Formatting instructions and an example reduce the failure rate but leave it non-zero, because the model is still generating free text that happens to look like JSON. For a pipeline component, a mechanism that guarantees the structure is available and preferable."}, {"letter": "C", "text": "Increase <code>max_tokens</code> so long reviews are not truncated before the closing bracket, and keep the existing retry logic for the remaining cases.", "correct": false, "explanation": "Raising the token limit addresses only the truncation case and leaves commentary and fences unresolved, so retries continue. It treats one symptom of unstructured output rather than moving to structured output."}, {"letter": "D", "text": "Define a <code>report_findings</code> tool whose input schema is the findings array, force it with <code>tool_choice</code>, and read findings from the call.", "correct": true, "explanation": "Tool use with a JSON schema is the reliable way to obtain schema-compliant structured output: the findings arrive as a validated tool input, so fences, commentary, and unbalanced brackets cannot occur. Forcing the tool guarantees every response is a call rather than prose, which removes the retry cost entirely."}], "overall": "", "domain": "Claude Code for Continuous Integration — Prompt & Structured Output"}, {"prompt": "After moving your review bot to tool use with a strict JSON schema, parse failures dropped to zero. But developers now report findings whose <code>line</code> points to a blank line or a different function than the message describes, and a few marked <code>critical</code> whose text describes a naming nit. The schema validates every one of these responses. What does this tell you, and what should you do?", "options": [{"letter": "A", "text": "The schema is too permissive; tighten it with stricter types and enum constraints so mislocated or mis-rated findings are rejected at validation time.", "correct": false, "explanation": "The values are already the right types and valid enum members; a wrong line number is still an integer and \"critical\" is a legal severity. No schema constraint can know whether a line matches the message. Tightening syntax cannot catch semantic errors."}, {"letter": "B", "text": "Tool use is unsuitable for review output; revert to free-text findings so the model can explain locations and severities in context.", "correct": false, "explanation": "Reverting reintroduces the parse failures you just eliminated and does nothing to make line numbers or severities more accurate. Structured output remains the right transport; what is missing is validation of meaning on top of it."}, {"letter": "C", "text": "The bot needs more <code>max_tokens</code>; truncated reasoning is causing it to guess line numbers and severities near the end of long reviews.", "correct": false, "explanation": "Token limits would produce cut-off tool calls, which strict schema validation would reject, not well-formed findings with wrong values. The errors described are content mistakes, not truncation artefacts."}, {"letter": "D", "text": "Strict schemas remove syntax errors, not semantic ones; add checks that the line exists and matches the described code, and retry with the specific error.", "correct": true, "explanation": "Schema-enforced tool use guarantees shape, not truth. Semantic validation, for example confirming the referenced line contains the construct the message names and that severity matches defined criteria, catches these cases, and feeding the specific validation error back on retry lets the model correct them. This is the standard layering: schema for syntax, checks for meaning."}], "overall": "", "domain": "Claude Code for Continuous Integration — Prompt & Structured Output"}, {"prompt": "Your invoice extraction tool marks <code>po_number</code> as required. About 30% of supplier invoices have no purchase order, and for those the model returns values like <code>PO-0000</code>, <code>N/A</code>, or a number copied from the invoice ID field. Downstream matching then fails or, worse, matches the wrong order. The prompt already says \"do not invent values\". What schema change addresses the root cause?", "options": [{"letter": "A", "text": "Make <code>po_number</code> optional and nullable so the model can return <code>null</code> when the document contains no purchase order reference.", "correct": true, "explanation": "A required field forces the model to supply something even when the source has nothing, and instructions not to invent cannot override a schema that demands a value. Allowing <code>null</code> gives the model a truthful option, which removes the fabricated placeholders and lets downstream code treat absence explicitly."}, {"letter": "B", "text": "Keep the field required and add a regex pattern for valid purchase order formats so fabricated values fail validation and trigger a retry.", "correct": false, "explanation": "A pattern rejects <code>N/A</code> but not a plausibly formatted invented number, and the retry asks the model to satisfy the same impossible requirement again. The information is absent from the document, so retries cannot produce it."}, {"letter": "C", "text": "Keep the field required and strengthen the prompt with few-shot examples of invoices without purchase orders and the expected placeholder text.", "correct": false, "explanation": "Teaching a consistent placeholder still encodes absence as a string that downstream systems must special-case, and the schema continues to force a value. The cleaner contract is a nullable field, not an agreed sentinel."}, {"letter": "D", "text": "Add a boolean <code>has_po_number</code> field alongside the required <code>po_number</code> so downstream systems can tell real values from placeholders.", "correct": false, "explanation": "A flag paired with a still-required field means the model must invent a value and then admit it is invented, which is convoluted and error-prone. Making the field nullable expresses the same information in one place without any fabricated content."}], "overall": "", "domain": "Structured Data Extraction — Prompt & Structured Output"}, {"prompt": "Your document classification schema has an enum <code>document_type</code> with five values: invoice, receipt, purchase_order, credit_note, statement. New suppliers now send delivery notes and remittance advices, which the model forces into <code>receipt</code> or <code>statement</code> with high confidence. Adding an enum value requires a schema release, and new types keep appearing. How should the schema evolve?", "options": [{"letter": "A", "text": "Replace the enum with a free-text <code>document_type</code> string so the model can name any document type it encounters.", "correct": false, "explanation": "Free text loses the consistency an enum provides for the common types: the same document may be labelled \"invoice\", \"Invoice\", or \"tax invoice\" across runs, breaking downstream routing. The known categories should stay constrained."}, {"letter": "B", "text": "Add each newly observed type to the enum as it appears, keeping the field strictly categorical and releasing schema updates as needed.", "correct": false, "explanation": "Chasing new types with schema releases means every unseen document is misclassified until the next release, which is the current problem. An extensible pattern removes the release dependency for the long tail while keeping the head categorical."}, {"letter": "C", "text": "Remove <code>document_type</code> from the schema and infer the type downstream from which fields were populated.", "correct": false, "explanation": "Inferring type from populated fields is brittle, since delivery notes and receipts share many fields, and it discards a judgement the model makes reliably for known types. The field is valuable; it just needs an escape hatch."}, {"letter": "D", "text": "Add an <code>other</code> enum value plus a <code>document_type_detail</code> string the model fills in when it selects <code>other</code>.", "correct": true, "explanation": "The \"other\" plus detail pattern keeps the known categories strictly enumerated while giving the model a truthful option for anything new, with the detail string recording what it actually saw. Delivery notes stop being forced into wrong buckets, and the detail values show which types deserve promotion to the enum later."}], "overall": "", "domain": "Structured Data Extraction — Prompt & Structured Output"}, {"prompt": "Your validation-retry loop resends the document, the failed extraction, and the validation error up to three times. Metrics show retries fix 80% of format errors such as dates in the wrong format, but for <code>contract_end_date</code> the retry success rate is 2%. Inspection shows those contracts say \"term as defined in Addendum B\", and the addendum is a separate file not supplied. How should the loop handle this field?", "options": [{"letter": "A", "text": "Increase the retry limit to five for date fields, since dates are the category with the most formatting variety across supplier contracts and templates.", "correct": false, "explanation": "The 2% success rate is not a formatting problem; the value is not in the document. More retries repeat an impossible request at increasing cost and delay, and any success is likely a fabricated date rather than a recovered one."}, {"letter": "B", "text": "Add few-shot examples showing how to locate end dates in contracts with unusual term clauses, renewal language, or non-standard layouts.", "correct": false, "explanation": "Examples help when the information is present but presented unusually. Here the clause explicitly points to another document, so no example of in-document extraction applies. The fix must recognise absence, not improve search."}, {"letter": "C", "text": "Detect when the source refers to an external document, skip retries, mark the field unavailable, and flag the case to fetch the addendum.", "correct": true, "explanation": "Retries work for format and structural errors and fail when the information is simply absent from the source. Recognising the referral to Addendum B, stopping the loop, and surfacing a specific reason lets the pipeline route the case to the step that can actually resolve it, obtaining the missing file, instead of burning retries."}, {"letter": "D", "text": "Make <code>contract_end_date</code> a required field with a strict date pattern so the model is compelled to locate and return a value.", "correct": false, "explanation": "Compelling a value the document does not contain produces fabrication, which is worse than an honest null for a contractual date. Required fields are appropriate only when the information is reliably present in the source."}], "overall": "", "domain": "Structured Data Extraction — Prompt & Structured Output"}, {"prompt": "In 4% of invoice extractions, the sum of extracted line item amounts does not equal the extracted total. You cannot tell whether the model misread a line item, the supplier's document itself contains an arithmetic error, or a discount line was omitted. Rejecting these outright would block legitimate invoices with genuine supplier mistakes. How should you design the extraction to make these cases diagnosable?", "options": [{"letter": "A", "text": "Trust the stated total, drop the line items from the schema, and let downstream systems recompute detail only when a reconciliation needs it.", "correct": false, "explanation": "Removing line items hides the discrepancy rather than explaining it, and you lose the detail needed for matching and audit. The 4% would pass silently, including cases where the model misread the total itself."}, {"letter": "B", "text": "Reject any extraction where the items do not sum to the total and retry with the validation error attached until the figures agree.", "correct": false, "explanation": "When the supplier's document genuinely does not add up, retrying pressures the model to alter a correctly extracted value until the numbers agree, converting a source error into a silent extraction error. Retries are for the model's mistakes, not the document's."}, {"letter": "C", "text": "Have the model output <code>stated_total</code> as written, a computed <code>calculated_total</code>, and a <code>conflict_detected</code> flag explaining any mismatch.", "correct": true, "explanation": "Extracting both the total as printed and the model's own sum of the items, plus an explicit conflict indicator, makes the discrepancy visible and attributable: a note such as \"discount line not itemised\" or \"document arithmetic error\" tells reviewers what happened. Legitimate invoices with supplier mistakes flow through flagged rather than blocked."}, {"letter": "D", "text": "Recompute the total from line items downstream and overwrite the extracted total whenever the two disagree.", "correct": false, "explanation": "Silently replacing the stated total assumes the line items are the correct side of the disagreement, which fails whenever a line was misread or omitted. It also erases evidence of supplier errors that accounts payable needs to see."}], "overall": "", "domain": "Structured Data Extraction — Prompt & Structured Output"}, {"prompt": "Your research-paper extraction returns <code>null</code> for the <code>authors</code> and <code>cited_works</code> fields on about a quarter of documents. Those papers use inline author-year citations and list references in a different layout from the numbered bibliographies your prompt describes. The information is present in every affected document. Which change most directly fixes the empty fields?", "options": [{"letter": "A", "text": "Add few-shot examples showing correct extraction from both numbered-bibliography and inline-citation papers with their reference layouts.", "correct": true, "explanation": "The information exists but is presented in a structure the prompt's description does not cover, and few-shot examples are the most effective way to demonstrate handling of varied document structures. Showing extraction from both layouts teaches the model to recognise references however they appear, which directly addresses the empty required fields."}, {"letter": "B", "text": "Make <code>authors</code> and <code>cited_works</code> required in the schema so the model cannot return <code>null</code> and must locate them.", "correct": false, "explanation": "Forcing a value when the model has not recognised the reference layout invites fabricated author lists, which is worse than a null. Required fields should reflect that the model can reliably find the data, and the prompt has not yet shown it how."}, {"letter": "C", "text": "Run a classifier first to detect the citation style and route each paper to a separate style-specific extraction prompt.", "correct": false, "explanation": "Two prompts and a classifier work but add a routing step, a second prompt to maintain, and a new failure mode when the classifier is wrong. A single prompt with examples of both layouts handles the variety without the extra machinery."}, {"letter": "D", "text": "Raise the sampling temperature so the model explores alternative interpretations of the reference sections instead of returning nothing.", "correct": false, "explanation": "Temperature affects randomness, not recognition of document structure, and higher randomness in an extraction task increases errors on the papers that currently work. The model needs to be shown the layout, not encouraged to guess."}], "overall": "", "domain": "Structured Data Extraction — Prompt & Structured Output"}, {"prompt": "A customer opens with \"I want to speak to a human about my refund.\" The agent replies that it can help, calls <code>get_customer</code> and <code>lookup_order</code>, and offers a resolution. The customer repeats the request twice more before the agent finally calls <code>escalate_to_human</code>. Complaints about this pattern are rising, even though the agent's proposed resolutions were often correct. How should the agent behave?", "options": [{"letter": "A", "text": "Continue attempting resolution first, since correct autonomous resolutions protect the 80% first-contact target, and escalate only if the customer asks a third time.", "correct": false, "explanation": "Overriding an explicit request for a human damages trust and generates exactly the complaints being observed; resolution rate gained this way is not the kind the target is meant to measure. Explicit requests are a defined escalation trigger, not an obstacle to work around."}, {"letter": "B", "text": "Detect negative sentiment in the opening message and escalate whenever frustration is detected, regardless of what the customer asks for.", "correct": false, "explanation": "Sentiment is an unreliable proxy: many frustrated customers want a fast fix rather than a human, and a calm customer may still explicitly ask for one. Routing on emotion rather than on the stated request would over-escalate some cases and still miss the explicit ask here."}, {"letter": "C", "text": "Escalate after gathering customer and order details, so the human receives a complete handoff summary and the customer does not have to repeat themselves.", "correct": false, "explanation": "A good handoff summary is valuable, but it does not require offering a resolution or delaying the escalation across several turns. Identity and order lookups can be run in the same turn as <code>escalate_to_human</code>; the agent should not attempt to resolve first."}, {"letter": "D", "text": "Honour an explicit request for a human immediately, without attempting resolution; use offer-then-escalate only for frustration without such a request.", "correct": true, "explanation": "An explicit demand for a human is one of the clear escalation triggers and should be honoured at once. The offer-to-resolve-first approach is appropriate when a customer is frustrated but has not asked for a person, escalating only if they reiterate. Distinguishing the two cases removes the complaints without sacrificing resolution on cases the agent should handle."}], "overall": "", "domain": "Customer Support Resolution Agent — Context & Reliability"}, {"prompt": "Each <code>lookup_order</code> result returns 40+ fields, including warehouse routing codes, internal SKUs, and carrier telemetry, when the agent typically needs order date, items, amount, status, and return eligibility. Customers with several orders exhaust the context after about six lookups, and quality degrades before the case is resolved. The MCP server belongs to another team. What is the most effective fix?", "options": [{"letter": "A", "text": "Trim each <code>lookup_order</code> result to the return-relevant fields before it enters the conversation, for example in a <code>PostToolUse</code> hook.", "correct": true, "explanation": "Tool results consume context out of proportion to their relevance, and six 40-field payloads crowd out the conversation the agent needs. Filtering results down to the fields the workflow actually uses, at the point they enter context, cuts the footprint by an order of magnitude without depending on the owning team to change the tool."}, {"letter": "B", "text": "Summarise the conversation more aggressively when context reaches 60% so more lookups fit before the limit.", "correct": false, "explanation": "Compacting the dialogue to make room for verbose tool payloads sacrifices customer-stated details, such as amounts and expectations, to preserve warehouse routing codes nobody uses. The waste should be removed at its source rather than accommodated."}, {"letter": "C", "text": "Instruct the agent to call <code>lookup_order</code> at most three times per conversation and ask the customer to prioritise which orders matter.", "correct": false, "explanation": "Capping lookups pushes work onto the customer and prevents the agent from resolving legitimate multi-order cases, lowering first-contact resolution. The limit exists only because each result is bloated, which is the fixable problem."}, {"letter": "D", "text": "Ask the owning team to add a <code>fields</code> parameter to <code>lookup_order</code> so the agent can request only the columns it needs.", "correct": false, "explanation": "A projection parameter is a reasonable long-term request, but it depends on another team's roadmap and still relies on the agent choosing the fields correctly each call. Trimming on your side of the boundary works today and is independent of the server's interface."}], "overall": "", "domain": "Customer Support Resolution Agent — Context & Reliability"}, {"prompt": "Two hours into a session exploring a 900-file legacy application, Claude begins describing \"typical repository patterns\" and \"the usual service layer\" instead of the concrete <code>OrderRepository</code> and <code>PricingService</code> classes it read and discussed earlier. When asked where discounts are applied, it gives a different answer than it did an hour ago. What is the most effective way to counteract this?", "options": [{"letter": "A", "text": "Have Claude keep a scratchpad file of key findings, class names, and file locations as it explores, and consult it for later questions.", "correct": true, "explanation": "The symptoms describe context degradation: specific discoveries have been pushed out or diluted, so the model falls back to generic patterns. A scratchpad file persists the concrete findings outside the conversation window, so later questions are answered from recorded facts rather than from fading memory, and the record survives compaction."}, {"letter": "B", "text": "Restart the session and re-explore the codebase from the beginning so the concrete details are fresh in context again.", "correct": false, "explanation": "Re-exploration recovers the details temporarily and then degrades in exactly the same way two hours later, at the cost of repeating all the work. It treats the symptom on a schedule instead of preserving what was learned."}, {"letter": "C", "text": "Ask Claude to recall the specific classes it read earlier and correct its answer, reminding it not to generalise.", "correct": false, "explanation": "If the specifics have fallen out of usable context, asking the model to recall them invites confident reconstruction rather than retrieval, which is how the contradictory answers arose. The facts need to be somewhere the model can read, not somewhere it must remember."}, {"letter": "D", "text": "Increase verbosity so Claude quotes more of each file it reads, keeping the concrete code visible in the conversation for longer.", "correct": false, "explanation": "Quoting more per file accelerates context consumption and brings the degradation on sooner. The goal is to retain distilled findings, not raw file contents; more raw text is the opposite of what is needed."}], "overall": "", "domain": "Code Generation with Claude Code — Context & Reliability"}, {"prompt": "A multi-agent refactoring run, with a coordinator and three subagents each owning a service, crashed three hours in when a subagent hit a rate limit. On restart, the coordinator had no record of which files had been analysed or changed, so the team re-ran from scratch. Such long runs are now routine. How should you design for recovery?", "options": [{"letter": "A", "text": "Add automatic retry with backoff in each subagent so rate limits no longer crash the run, and accept restarts from scratch for other failure types.", "correct": false, "explanation": "Retrying rate limits is worth doing but addresses only one cause; process crashes, timeouts, and infrastructure restarts will still discard three hours of progress. The requirement is to make progress durable, not to prevent a single failure type."}, {"letter": "B", "text": "Resume the coordinator's session with <code>--resume</code> after a crash so its conversation history restores the run's state.", "correct": false, "explanation": "Resuming restores the coordinator's dialogue, but the subagents' findings and partial edits live in their own isolated contexts and the file system, not in the coordinator's history. A resumed coordinator would still have no reliable view of what each subagent completed."}, {"letter": "C", "text": "Commit to git after every file change so a restart can inspect the diff to infer what has already been done.", "correct": false, "explanation": "Commits capture code changes but not the analysis, decisions, and remaining plan behind them; on restart the agents would have to rediscover why each change was made and what was still pending. The file system state is necessary but not sufficient for recovery."}, {"letter": "D", "text": "Have each agent export structured state to a known location; on resume the coordinator loads a manifest and injects it into each subagent's prompt.", "correct": true, "explanation": "Structured state persistence is the crash recovery pattern for long multi-agent runs: each agent writes what it has analysed, changed, and still has to do, and the coordinator reads a manifest on restart and passes each subagent its own saved state. Work resumes from the last checkpoint instead of from zero, regardless of what caused the crash."}], "overall": "", "domain": "Code Generation with Claude Code — Context & Reliability"}, {"prompt": "Final reports contain statements such as \"industry sources estimate 30% adoption\" with no identifiable source, even though the web search subagent's logs show the figure came from a specific named survey. Tracing the pipeline, each agent summarised the previous agent's output in prose, and the source names disappeared somewhere between search and synthesis. What is the most effective remedy?", "options": [{"letter": "A", "text": "Have the report generation agent re-search each unattributed claim at the end and attach whatever source it finds.", "correct": false, "explanation": "Re-searching after the fact is expensive, may find a different source than the one actually used, and risks attaching a citation that does not support the exact figure. Provenance should be preserved through the pipeline, not reconstructed at the end."}, {"letter": "B", "text": "Pass the raw search results and full documents to the synthesis agent alongside the summaries so it can look up sources itself.", "correct": false, "explanation": "Raw content would overflow the synthesis agent's context budget and still leaves it to re-derive which source supports which claim. The problem is that the mapping was dropped; the fix is to carry the mapping, not to carry everything."}, {"letter": "C", "text": "Instruct the synthesis agent to write \"source unavailable\" wherever attribution is missing so readers know which claims are unverified.", "correct": false, "explanation": "Labelling the gap is more honest than a vague attribution but leaves the report weaker than the evidence actually gathered. The source was known upstream; discarding it and then flagging its absence is a process failure made visible, not fixed."}, {"letter": "D", "text": "Require each subagent to output structured claim-source mappings (URL, document name, excerpt) that downstream agents preserve and merge.", "correct": true, "explanation": "Attribution is lost when findings are compressed into prose without their sources. Structured claim-source mappings separate content from metadata so each summarisation step carries the source forward, and the synthesis agent merges rather than discards them. The named survey then appears in the final report next to the figure it supports."}], "overall": "", "domain": "Multi-Agent Research System — Context & Reliability"}, {"prompt": "A report on a regional market flags a \"major contradiction between sources\": one estimates the market at $4 billion, another at $9 billion. A reviewer notes the first figure is from a 2019 report and the second from a 2025 report describing growth in between. The subagents' outputs contain the figures and source names but no dates, so the synthesis agent treated them as conflicting. What change prevents this?", "options": [{"letter": "A", "text": "Require subagents to include the publication or data collection date with each finding in their structured output.", "correct": true, "explanation": "Temporal differences are misread as contradictions when dates are missing. With publication or collection dates attached to each finding, the synthesis agent can present the two figures as a time series showing growth rather than as a conflict, and readers can judge recency themselves."}, {"letter": "B", "text": "Instruct the synthesis agent to prefer the most recent source whenever figures disagree and omit the older value.", "correct": false, "explanation": "The synthesis agent cannot know which source is more recent without the dates, and even with them, dropping the older value hides a growth trend that is itself a finding. Recency preference is a policy that still needs the temporal metadata this fix supplies."}, {"letter": "C", "text": "Have the web search subagent exclude any source older than three years so outdated figures do not reach synthesis.", "correct": false, "explanation": "A hard age cutoff discards historical data that many research questions depend on, including trend analysis, and it does nothing for two sources of different dates inside the window. Dating the findings is more useful than deleting them."}, {"letter": "D", "text": "Route every detected contradiction to a human reviewer before the report is finalised so misreadings are caught manually.", "correct": false, "explanation": "Human review of every conflict would catch this one but at the cost of a manual step on a large share of reports, for a problem the pipeline can resolve itself by carrying dates. Reserve human review for genuine conflicts that dates and attribution cannot explain."}], "overall": "", "domain": "Multi-Agent Research System — Context & Reliability"}, {"prompt": "Your extraction pipeline reports 97% field-level accuracy on a labelled validation set of 3,000 documents. Leadership wants to remove human review for all extractions with model confidence above 0.9 to cut costs by 60%. The validation set is dominated by standard invoices; medical claim forms and handwritten receipts together make up 8% of it. What should you do before agreeing?", "options": [{"letter": "A", "text": "Approve the plan, since 97% overall accuracy exceeds the team's 95% target and the confidence threshold adds a further safety margin.", "correct": false, "explanation": "An aggregate figure can hide poor performance on minority document types; 97% overall is consistent with 99% on invoices and 75% on claim forms. Approving on the aggregate would automate exactly the segments where the model is most likely wrong."}, {"letter": "B", "text": "Raise the automation threshold to 0.95 confidence so that only the most certain extractions bypass review.", "correct": false, "explanation": "A higher threshold assumes confidence is well calibrated across all document types, which has not been checked, and calibration often differs most on rare types. The threshold is a tuning knob; the segmentation analysis is the missing prerequisite."}, {"letter": "C", "text": "Analyse accuracy separately by document type and by field, and validate calibration on each segment before automating any of them.", "correct": true, "explanation": "Automating on the basis of an aggregate is unsafe when the validation set is dominated by one document type. Breaking accuracy down by type and field reveals whether claim forms or handwritten receipts, or particular fields such as totals, perform far worse than the headline number, and confirms whether high confidence actually means high accuracy in each segment before review is removed there."}, {"letter": "D", "text": "Automate invoices only, since they dominate the validation set, and continue full review for the other document types indefinitely.", "correct": false, "explanation": "Restricting automation to invoices is a plausible interim outcome, but choosing it without analysis skips the evidence that would justify it and forgoes automation on other types that may perform well. Segment analysis should drive the decision rather than an assumption about which type is safe."}], "overall": "", "domain": "Structured Data Extraction — Context & Reliability"}, {"prompt": "Your human reviewers can check about 500 extractions per day out of 4,000 processed. Today every tenth document is sampled regardless of content, so reviewers spend most of their time confirming easy invoices while errors on ambiguous or contradictory documents reach downstream systems unreviewed. You have a labelled set of 2,000 documents with known ground truth. How should you route review capacity?", "options": [{"letter": "A", "text": "Route documents to review based on length and density, since longer and denser documents are where extraction errors are most likely to occur.", "correct": false, "explanation": "Length is a weak and indirect proxy for difficulty; a short receipt with a smudged total is riskier than a long, well-structured invoice. Routing needs a signal tied to the model's actual uncertainty about each field, not a document property."}, {"letter": "B", "text": "Review only documents of the types with the highest historical error rates, and skip review entirely for the types that have performed best.", "correct": false, "explanation": "Type-level routing is coarser than needed: within any type, most documents are easy and a few are hard, and skipping a type entirely means novel failures there go undetected. Field-level confidence discriminates within types as well as across them."}, {"letter": "C", "text": "Keep uniform sampling but double the sample to every fifth document so more of the problematic cases are caught by chance.", "correct": false, "explanation": "Doubling uniform sampling exceeds the reviewers' capacity and still spends most of it confirming easy documents. Random selection does not concentrate attention where errors are, which is the inefficiency being described."}, {"letter": "D", "text": "Have the model emit field-level confidence, calibrate thresholds on the labelled set, and route low-confidence or contradictory cases to review.", "correct": true, "explanation": "Field-level confidence calibrated against labelled ground truth turns limited reviewer capacity into targeted attention: documents where the model is uncertain or where the source is contradictory get reviewed, and easy invoices flow through. The labelled set is what makes the thresholds trustworthy rather than arbitrary."}], "overall": "", "domain": "Structured Data Extraction — Context & Reliability"}, {"prompt": "Six months ago you automated all extractions with confidence above 0.9, after validating that segment at 99% accuracy. Since then two new supplier formats have appeared, and a downstream team recently found that one of them causes the model to confidently swap the tax and total fields. Nobody noticed because high-confidence extractions are never reviewed. What ongoing control should you add?", "options": [{"letter": "A", "text": "Review a weekly stratified random sample of high-confidence extractions to measure error rate and surface novel failure patterns.", "correct": true, "explanation": "Confidence was calibrated on the documents that existed at the time; new formats can be confidently wrong, and without review of the automated segment nothing detects that. A stratified random sample across document types and suppliers gives an ongoing error-rate measurement and catches novel patterns such as the field swap before they propagate for months."}, {"letter": "B", "text": "Lower the automation threshold to 0.8 so that a larger share of extractions is reviewed and the swap is more likely to be caught.", "correct": false, "explanation": "The swapped fields are extracted with high confidence, so moving the threshold changes which uncertain documents are reviewed but does nothing to inspect the confident ones where the new failure lives. Reviewing more low-confidence work does not monitor the automated segment."}, {"letter": "C", "text": "Rely on downstream reconciliation failures to flag extraction errors, since they eventually surfaced this problem.", "correct": false, "explanation": "Downstream detection is what allowed the error to run unnoticed for an extended period; it is slow, incomplete, and depends on the error being financially visible. A monitoring control should detect problems before they reach downstream systems, not after."}, {"letter": "D", "text": "Run every high-confidence document through a second extraction pass and review only the cases where the two passes disagree.", "correct": false, "explanation": "A confident systematic misreading of a new format will be reproduced by a second pass of the same model, so the two will agree and the swap goes undetected. Self-agreement is not independent verification; sampled human review is."}], "overall": "", "domain": "Structured Data Extraction — Context & Reliability"}];

let current = 0;
const userAnswers = new Array(QUESTIONS.length).fill(null); // stores selected letter or null

const qNav = document.getElementById('qNav');
const quizCard = document.getElementById('quizCard');
const scoreBadge = document.getElementById('scoreBadge');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const answeredLabel = document.getElementById('answeredLabel');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const restartBtn = document.getElementById('restartBtn');

function buildNav() {
  qNav.innerHTML = '';
  QUESTIONS.forEach((_, i) => {
    const b = document.createElement('button');
    b.textContent = i + 1;
    b.addEventListener('click', () => { current = i; render(); });
    qNav.appendChild(b);
  });
}

function score() {
  let correct = 0, answered = 0;
  userAnswers.forEach((letter, i) => {
    if (letter !== null) {
      answered++;
      const opt = QUESTIONS[i].options.find(o => o.letter === letter);
      if (opt && opt.correct) correct++;
    }
  });
  return { correct, answered };
}

function updateHeader() {
  const { correct, answered } = score();
  scoreBadge.textContent = `Score: ${correct} / ${QUESTIONS.length}`;
  progressLabel.textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
  answeredLabel.textContent = `${answered} answered`;
  progressFill.style.width = `${(answered / QUESTIONS.length) * 100}%`;

  Array.from(qNav.children).forEach((btn, i) => {
    btn.classList.toggle('current', i === current);
    btn.classList.remove('answered-correct', 'answered-wrong');
    if (userAnswers[i] !== null) {
      const opt = QUESTIONS[i].options.find(o => o.letter === userAnswers[i]);
      btn.classList.add(opt && opt.correct ? 'answered-correct' : 'answered-wrong');
    }
  });

  prevBtn.disabled = current === 0;
  nextBtn.textContent = current === QUESTIONS.length - 1 ? 'Finish' : 'Next';
}

function selectAnswer(qIndex, letter) {
  if (userAnswers[qIndex] !== null) return;
  userAnswers[qIndex] = letter;
  render();
}

function renderQuestion(q, qIndex) {
  const selected = userAnswers[qIndex];
  const locked = selected !== null;

  const optionsHtml = q.options.map(opt => {
    let cls = 'option';
    if (locked) {
      cls += ' locked';
      if (opt.letter === selected && opt.correct) cls += ' selected-correct';
      else if (opt.letter === selected && !opt.correct) cls += ' selected-wrong';
      if (opt.correct) cls += ' reveal-correct';
    }
    return `
      <div>
        <button class="${cls}" data-letter="${opt.letter}" ${locked ? 'disabled' : ''}>
          <span class="letter">${opt.letter}</span>
          <span>${escapeHtml(opt.text)}</span>
        </button>
        <div class="option-explanation ${locked ? 'show' : ''}">${escapeHtml(opt.explanation)}</div>
      </div>`;
  }).join('');

  let bannerHtml = '';
  if (locked) {
    const opt = q.options.find(o => o.letter === selected);
    const isCorrect = opt && opt.correct;
    bannerHtml = `<div class="feedback-banner show ${isCorrect ? 'correct' : 'wrong'}">
      ${isCorrect ? '✓ Correct!' : '✗ Not quite — check the highlighted answer.'}
    </div>`;
  }

  const overallHtml = locked && q.overall
    ? `<div class="overall-explanation show"><h4>Description</h4>${escapeHtml(q.overall).replace(/\n/g, '<br>')}</div>`
    : '';

  quizCard.innerHTML = `
    ${q.domain ? `<div class="domain-tag">${escapeHtml(q.domain)}</div>` : ''}
    <div class="q-title">Question ${qIndex + 1} of ${QUESTIONS.length}</div>
    <div class="prompt">${escapeHtml(q.prompt)}</div>
    <div class="options">${optionsHtml}</div>
    ${bannerHtml}
    ${overallHtml}
  `;

  quizCard.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(qIndex, btn.dataset.letter));
  });
}

function renderSummary() {
  const { correct } = score();
  const pct = Math.round((correct / QUESTIONS.length) * 100);
  quizCard.innerHTML = `
    <div class="summary-card">
      <div class="q-title">Quiz complete</div>
      <div class="big-score">${correct} / ${QUESTIONS.length}</div>
      <div>${pct}% correct</div>
    </div>`;
}

function render() {
  if (current >= QUESTIONS.length) {
    current = QUESTIONS.length - 1;
  }
  renderQuestion(QUESTIONS[current], current);
  updateHeader();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

prevBtn.addEventListener('click', () => {
  if (current > 0) { current--; render(); }
});

nextBtn.addEventListener('click', () => {
  if (current < QUESTIONS.length - 1) {
    current++;
    render();
  } else {
    renderSummary();
  }
});

restartBtn.addEventListener('click', () => {
  userAnswers.fill(null);
  current = 0;
  render();
});

buildNav();
render();
</script>
