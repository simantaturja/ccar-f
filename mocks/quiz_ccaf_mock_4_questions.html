<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCAF Mock #4 — 60 Questions by Topic</title>
<style>
  :root {
    --bg: #f7f9fa;
    --panel: #ffffff;
    --border: #e3e5e6;
    --text: #1c1d1f;
    --muted: #6a6f73;
    --primary: #5624d0;
    --primary-dark: #3d1b8f;
    --correct: #1e7e34;
    --correct-bg: #e8f5e9;
    --wrong: #c0392b;
    --wrong-bg: #fdecea;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  header.top h1 {
    font-size: 1.3rem;
    margin: 0;
  }
  .score-badge {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 16px;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .progress-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 20px;
  }
  .progress-bar-track {
    background: #eceef0;
    border-radius: 999px;
    height: 8px;
    overflow: hidden;
    margin-top: 8px;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 999px;
    transition: width 0.25s ease;
    width: 0%;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .q-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 20px;
  }
  .q-nav button {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    font-size: 0.78rem;
    cursor: pointer;
    color: var(--text);
  }
  .q-nav button.current { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(86,36,208,0.15); }
  .q-nav button.answered-correct { background: var(--correct-bg); color: var(--correct); border-color: var(--correct); }
  .q-nav button.answered-wrong { background: var(--wrong-bg); color: var(--wrong); border-color: var(--wrong); }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }
  .domain-tag {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--primary);
    background: #f1ecfc;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .q-title {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .prompt {
    white-space: pre-wrap;
    font-size: 1.05rem;
    line-height: 1.55;
    margin-bottom: 20px;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
    background: var(--panel);
    text-align: left;
    font-size: 0.98rem;
    line-height: 1.5;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option:hover:not(.locked) {
    border-color: var(--primary);
    background: #faf8ff;
  }
  .option .letter {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--muted);
  }
  .option.selected-correct {
    border-color: var(--correct);
    background: var(--correct-bg);
  }
  .option.selected-correct .letter {
    background: var(--correct);
    border-color: var(--correct);
    color: #fff;
  }
  .option.selected-wrong {
    border-color: var(--wrong);
    background: var(--wrong-bg);
  }
  .option.selected-wrong .letter {
    background: var(--wrong);
    border-color: var(--wrong);
    color: #fff;
  }
  .option.reveal-correct:not(.selected-correct) {
    border-color: var(--correct);
  }
  .option.reveal-correct:not(.selected-correct) .letter {
    border-color: var(--correct);
    color: var(--correct);
  }
  .option.locked { cursor: default; }
  .option-explanation {
    margin-top: 8px;
    font-size: 0.88rem;
    color: var(--muted);
    padding-left: 38px;
    display: none;
  }
  .option-explanation.show { display: block; }
  .feedback-banner {
    display: none;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-weight: 600;
    font-size: 0.95rem;
  }
  .feedback-banner.show { display: flex; }
  .feedback-banner.correct { background: var(--correct-bg); color: var(--correct); }
  .feedback-banner.wrong { background: var(--wrong-bg); color: var(--wrong); }
  .overall-explanation {
    display: none;
    margin-top: 16px;
    padding: 16px;
    border-radius: var(--radius);
    background: #f7f6fb;
    border: 1px solid var(--border);
    font-size: 0.92rem;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .overall-explanation.show { display: block; }
  .overall-explanation h4 {
    margin: 0 0 8px;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
  }
  .footer-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    gap: 10px;
  }
  .footer-nav button {
    border: none;
    border-radius: 8px;
    padding: 12px 22px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border) !important;
  }
  .btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; background: var(--primary); }
  .restart-row { text-align: center; margin-top: 14px; }
  .restart-row button {
    background: transparent;
    border: none;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .summary-card { text-align: center; }
  .summary-card .big-score {
    font-size: 2.6rem;
    font-weight: 700;
    color: var(--primary);
    margin: 6px 0;
  }
  @media (max-width: 560px) {
    .card { padding: 16px; }
    .option-explanation { padding-left: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>CCAF Mock #4 — 60 Questions by Topic</h1>
    <div class="score-badge" id="scoreBadge">Score: 0 / 0</div>
  </header>

  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progressLabel">Question 1 of 60</span>
      <span id="answeredLabel">0 answered</span>
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
  </div>

  <div class="q-nav" id="qNav"></div>

  <div class="card" id="quizCard"></div>

  <div class="footer-nav">
    <button class="btn-secondary" id="prevBtn">Previous</button>
    <button class="btn-primary" id="nextBtn">Next</button>
  </div>

  <div class="restart-row"><button id="restartBtn">Restart quiz</button></div>
</div>

<script>
const QUESTIONS = [{"prompt": "Your agentic loop occasionally ends a conversation with the agent's message \"Let me look up that order for you\" and no further action. Inspecting the failing responses, each contains a text block followed by a <code>tool_use</code> block for <code>lookup_order</code>, and <code>stop_reason</code> is <code>tool_use</code>. Your loop code exits whenever the response contains any text content, treating text as the final answer. What is the correct fix?", "options": [{"letter": "A", "text": "Continue the loop whenever <code>stop_reason</code> is <code>tool_use</code>, execute every tool block, and stop only when <code>stop_reason</code> is <code>end_turn</code>.", "correct": true, "explanation": "The loop's job is to act on what the model requested, and <code>stop_reason</code> is the authoritative signal. A response can carry explanatory text alongside tool calls; treating the presence of text as completion discards the requested tool call. Keying termination on <code>end_turn</code> resolves the bug without adding prompt rules or heuristics that will fail in other combinations."}, {"letter": "B", "text": "Instruct the model in the system prompt to emit tool calls without any accompanying text so the text-presence check remains a reliable completion signal.", "correct": false, "explanation": "This patches the loop's incorrect assumption with a probabilistic prompt rule. The model may still add brief text, and the loop would again exit prematurely. It also removes useful narration for the customer. The bug is in the control flow, not the model's behaviour."}, {"letter": "C", "text": "Add a maximum of eight iterations and treat any response containing text as final once that cap is reached, to bound runaway tool calling.", "correct": false, "explanation": "An iteration cap does not address why the loop stops early; it adds a second unrelated stopping rule. Caps are acceptable as a safety fallback, but the primary termination decision must come from <code>stop_reason</code>, otherwise both short and long conversations misbehave."}, {"letter": "D", "text": "Parse the text block for phrases such as \"let me\" or \"I will\" and continue the loop when they appear, since they indicate the model intends further action.", "correct": false, "explanation": "Parsing natural language to infer whether the model wants to continue is the anti-pattern the structured API avoids. Phrasing varies and localisation breaks the heuristic. The response already carries an explicit machine-readable signal in <code>stop_reason</code> and the <code>tool_use</code> block itself."}], "overall": "", "domain": "Customer Support Resolution Agent — Agentic Architecture"}, {"prompt": "Company policy requires manager approval for any refund above $500. Your system prompt states this rule clearly and includes two examples, yet last month the agent called <code>process_refund</code> for three refunds of $700 or more without escalating. Finance has told you a single further violation will pause the agent programme. Which change gives the guarantee you need?", "options": [{"letter": "A", "text": "Add the $500 limit to the <code>process_refund</code> tool description so the model sees the constraint at the moment it selects the tool.", "correct": false, "explanation": "Tool descriptions influence selection, but they are still read and applied probabilistically. The rule already exists in the system prompt and was violated; moving or duplicating it changes the odds, not the outcome class. Finance has asked for zero violations, which text cannot promise."}, {"letter": "B", "text": "Intercept outgoing <code>process_refund</code> calls with a hook that blocks amounts above $500 and redirects to <code>escalate_to_human</code>.", "correct": true, "explanation": "A tool-call interception hook is deterministic: the refund cannot execute regardless of how the model reasoned. Returning a message that redirects to escalation keeps the agent productive on the case. This is the pattern for business rules that need guaranteed compliance rather than high-probability compliance."}, {"letter": "C", "text": "Expand the few-shot examples to six cases spanning $400 to $2,000 so the model learns where the threshold sits and how to hand off each one.", "correct": false, "explanation": "More examples may reduce the error rate, and are worth having for tone and handoff quality, but they cannot eliminate it. The scenario explicitly demands a guarantee. Prompt-based guidance is the right tool for judgement calls, not for a hard numeric policy boundary."}, {"letter": "D", "text": "Run a nightly audit job that reviews refunds above $500 and automatically reverses any that lack a recorded manager approval.", "correct": false, "explanation": "Reversal after the fact still means the violation occurred, and the customer has already been told the refund was issued. An audit is useful for observability but does not prevent the action. Prevention at the tool-call boundary is where deterministic control exists."}], "overall": "", "domain": "Customer Support Resolution Agent — Agentic Architecture"}, {"prompt": "When the agent calls <code>escalate_to_human</code>, the human team receives only the customer's email and the ticket subject. Support leads report that escalated cases take 11 minutes longer than cases opened directly with humans, because agents must re-ask the customer for order numbers and re-diagnose the problem. Human agents do not have access to the agent's conversation transcript. What should the escalation include?", "options": [{"letter": "A", "text": "The full raw conversation transcript plus every tool result, so the human can reconstruct the situation exactly as the agent saw it during the case.", "correct": false, "explanation": "A raw transcript with 40-field tool payloads shifts the reading burden to the human and rarely saves time; the lead's complaint is about re-diagnosis, which a transcript does not perform. Structured conclusions are faster to act on than raw evidence, and the transcript can be linked separately if needed."}, {"letter": "B", "text": "A structured handoff summary: verified customer ID, order numbers, root cause, amount at stake, and a recommended action.", "correct": true, "explanation": "The human lacks the transcript, so the escalation payload must carry the investigation's conclusions in a form that can be acted on immediately. Customer ID, order references, root cause, amounts, and a recommended next step remove the re-asking and re-diagnosis that account for the delay. This is the standard mid-process handoff protocol."}, {"letter": "C", "text": "Keep the agent in the loop after escalation so the human can ask it questions about the case rather than the customer.", "correct": false, "explanation": "This adds a second conversation and latency for the human, and the agent's context may have been compacted by the time questions arrive. It also keeps the agent engaged on a case it has already handed off. A handoff should transfer knowledge once, up front, not on demand."}, {"letter": "D", "text": "Escalate earlier in the conversation, before investigation, so the human gathers the details themselves in one pass with the customer.", "correct": false, "explanation": "Escalating before investigation throws away the agent's ability to resolve cases and would drive first-contact resolution down, the opposite of the programme goal. The problem is not when the handoff happens but that the handoff carries no useful information."}], "overall": "", "domain": "Customer Support Resolution Agent — Agentic Architecture"}, {"prompt": "A colleague proposes replacing the agent's tool selection with a fixed decision tree: a regex classifies the message as refund, address change, or billing, and each class runs a hardcoded tool sequence such as <code>get_customer</code> then <code>lookup_order</code> then <code>process_refund</code>. They argue this removes unpredictability. Your logs show 30% of messages combine concerns or describe situations no class anticipates. How should you respond?", "options": [{"letter": "A", "text": "Adopt the decision tree for the three common classes and route anything the regex cannot classify to <code>escalate_to_human</code>.", "correct": false, "explanation": "This sends 30% of traffic to humans by construction and removes the model's ability to handle the mixed and novel cases that are the point of using an agent. It trades resolution rate for a predictability the fixed sequences cannot deliver on messy real inputs anyway."}, {"letter": "B", "text": "Adopt the decision tree but let the model fill in tool arguments at each step, so sequencing stays fixed while parameter extraction remains flexible to phrasing.", "correct": false, "explanation": "Fixing the sequence is the part that breaks on multi-concern and unanticipated requests; letting the model only fill arguments does not restore its ability to choose a different investigation path. This keeps the rigidity while adding the complexity of two decision systems."}, {"letter": "C", "text": "Keep model-driven tool selection, and enforce only genuinely mandatory ordering, such as verification before refunds, programmatically.", "correct": true, "explanation": "The agentic loop exists so the model can decide the next tool from context, which is what handles combined and novel requests. Predictability where it truly matters comes from programmatic prerequisites on specific transitions, not from scripting every path. This keeps adaptability and adds determinism only where the business requires it."}, {"letter": "D", "text": "Keep model-driven selection but add a system prompt instruction listing the expected tool order for each request type as guidance.", "correct": false, "explanation": "Describing expected sequences in the prompt is reasonable guidance, but it does not answer the colleague's concern about guarantees, and it nudges the model toward the same rigid paths for mixed requests. Where ordering must be guaranteed, prompt text is the wrong mechanism; where it need not be, the list adds little."}], "overall": "", "domain": "Customer Support Resolution Agent — Agentic Architecture"}, {"prompt": "Yesterday you spent 90 minutes in a named session, <code>auth-refactor</code>, having Claude Code analyse the authentication module and agree a refactoring plan. This morning a teammate merged changes to <code>session.ts</code>, <code>token.ts</code>, and <code>middleware.ts</code>. You run <code>claude --resume auth-refactor</code> and Claude proposes edits based on yesterday's file contents. What is the most efficient way to continue?", "options": [{"letter": "A", "text": "Continue the resumed session and tell Claude which three files changed, asking it to re-read those before revising the plan.", "correct": true, "explanation": "Most of yesterday's analysis is still valid; only three files are stale. Informing the resumed session about the specific changes lets Claude re-read those files and adjust the plan, preserving the 90 minutes of shared understanding. Full re-exploration or a fresh session pays for context that has not changed."}, {"letter": "B", "text": "Start a fresh session and have Claude re-analyse the module from scratch so it does not work from stale tool results at any point.", "correct": false, "explanation": "A fresh start is the right call when most prior tool results are stale, which is not the case here: the merge touched three files in a module Claude has already mapped. Redoing 90 minutes of analysis to refresh three files is disproportionate."}, {"letter": "C", "text": "Fork the session so the original analysis stays intact, then explore the impact of the merge in the forked branch.", "correct": false, "explanation": "Forking is for exploring divergent approaches from a shared baseline. The teammate's merge is not an alternative approach to evaluate; it is a fact the plan must incorporate. The fork would still contain the stale file contents and would need the same update message."}, {"letter": "D", "text": "Resume the session and rely on Claude to detect the modified files automatically the next time it edits them.", "correct": false, "explanation": "Resumed sessions restore conversation history, not a live view of the file system. Claude will keep reasoning from the cached <code>Read</code> results until told otherwise, and may only discover the drift when an <code>Edit</code> fails to match. Stating the changes up front avoids wasted turns."}], "overall": "", "domain": "Code Generation with Claude Code — Agentic Architecture"}, {"prompt": "You have defined four subagents with clear descriptions and system prompts using <code>AgentDefinition</code>. In testing, the coordinator never delegates: it attempts to answer research questions itself using its own web search tool and produces shallow, uncited reports. The coordinator's <code>allowedTools</code> is set to <code>[\"WebSearch\", \"Read\"]</code>. What is the most likely cause?", "options": [{"letter": "A", "text": "The subagent descriptions are not specific enough for the coordinator to judge when delegation is worthwhile compared with acting directly.", "correct": false, "explanation": "Description quality affects which subagent is chosen, but the coordinator here never delegates at all, even for tasks that obviously need document analysis. When a capability is used zero times, the first thing to check is whether it is available, not how it is described."}, {"letter": "B", "text": "The coordinator's <code>allowedTools</code> omits <code>Task</code>, so it has no mechanism to spawn subagents and falls back to the tools it does have.", "correct": true, "explanation": "Subagents are invoked through the <code>Task</code> tool. If the coordinator's allowed tool set does not include it, the definitions are inert and the coordinator can only use <code>WebSearch</code> and <code>Read</code>, which matches the observed shallow self-research. Adding <code>Task</code> is the fix; removing <code>WebSearch</code> from the coordinator may then also be worthwhile."}, {"letter": "C", "text": "The coordinator's system prompt lacks an explicit instruction to prefer delegation, so it optimises for speed by answering directly.", "correct": false, "explanation": "A delegation instruction is good practice, but the coordinator cannot follow it without a tool that spawns subagents. Adding prompt text while the capability is missing would produce a coordinator that describes delegating and then does the work itself."}, {"letter": "D", "text": "The subagents were defined but not registered, so the coordinator is unaware they exist and cannot reference them by name.", "correct": false, "explanation": "The scenario states the agents are defined via <code>AgentDefinition</code>, which is the registration. The coordinator's awareness of subagents does not help if its tool set excludes the spawning mechanism, which is the concrete omission visible in the configuration."}], "overall": "", "domain": "Multi-Agent Research System — Agentic Architecture"}, {"prompt": "The web search and document analysis subagents both return rich findings to the coordinator. The coordinator then invokes the synthesis subagent with the prompt \"Synthesize the research findings into a report.\" The synthesis agent responds that no findings were provided and produces a generic overview of the topic from its own knowledge. What is the root cause?", "options": [{"letter": "A", "text": "The synthesis agent's <code>AgentDefinition</code> lacks a tool for reading the coordinator's session state, so it cannot retrieve the findings.", "correct": false, "explanation": "There is no session-state tool that would grant a subagent access to the coordinator's history, and designing one would recreate implicit shared memory. Context reaches a subagent through its prompt; the fix is in what the coordinator sends, not in adding tools to the receiver."}, {"letter": "B", "text": "Subagents run with isolated context; the coordinator must include the actual search results and analysis output in the synthesis prompt.", "correct": true, "explanation": "A subagent does not inherit the coordinator's conversation history. \"The research findings\" refers to material only the coordinator has seen, so the synthesis agent legitimately reports having nothing. The coordinator must pass the complete findings, ideally as structured data with source metadata, directly in the prompt."}, {"letter": "C", "text": "The synthesis prompt is too terse; adding a detailed description of the report structure and quality criteria will resolve the issue.", "correct": false, "explanation": "Report structure guidance is valuable, but the agent's complaint is about missing inputs, not unclear outputs. A longer prompt that still references findings without containing them would fail the same way. Content must be present before format instructions matter."}, {"letter": "D", "text": "The web search and document analysis subagents should write their findings to a shared file that the synthesis agent reads when it starts.", "correct": false, "explanation": "A shared file can work as a scratchpad in some designs, but it introduces an out-of-band channel the coordinator cannot observe or filter, weakening hub-and-spoke control. The direct, standard mechanism is for the coordinator to pass findings in the prompt, which is what is missing here."}], "overall": "", "domain": "Multi-Agent Research System — Agentic Architecture"}, {"prompt": "Tracing a typical research run, you see the coordinator spawn the web search subagent, wait about 90 seconds for it to finish, then spawn the document analysis subagent and wait another 80 seconds. The two tasks read different sources and do not depend on each other. End-to-end latency is dominated by this serial phase. What change reduces latency without restructuring the agents?", "options": [{"letter": "A", "text": "Merge web search and document analysis into one subagent so a single invocation covers both source types.", "correct": false, "explanation": "Merging removes the specialisation and tool scoping that keep each agent reliable, and a single agent would still process the two source types one after the other. It trades a clean fix for an architectural regression that does not actually parallelise the work."}, {"letter": "B", "text": "Have the coordinator issue both <code>Task</code> calls in a single response so the two subagents run concurrently.", "correct": true, "explanation": "Parallel subagent execution is achieved by the coordinator emitting multiple <code>Task</code> tool calls in one turn rather than one per turn. Since the tasks are independent, this collapses the 170-second serial phase to roughly the longer of the two. It changes only the coordinator's prompting, not the agent structure."}, {"letter": "C", "text": "Lower each subagent's <code>max_turns</code> so search and analysis each finish faster and the serial phase shrinks.", "correct": false, "explanation": "Capping turns shortens work by cutting it off, which reduces research quality rather than removing the unnecessary serialisation. The tasks are independent; the fix is to overlap them, not to make each one do less."}, {"letter": "D", "text": "Run two coordinator instances, one per source type, and merge their outputs in a final synthesis step.", "correct": false, "explanation": "Duplicating the coordinator breaks the hub-and-spoke model: no single agent observes both branches, handles errors consistently, or partitions scope to avoid overlap. Parallelism is available inside one coordinator's turn without introducing a second hub."}], "overall": "", "domain": "Multi-Agent Research System — Agentic Architecture"}, {"prompt": "Users increasingly submit narrow factual queries such as \"When did Company X acquire Company Y and for how much?\" alongside broad research topics. Every query runs the full pipeline of web search, document analysis, synthesis, and report generation, so a one-fact question takes over four minutes and returns a twelve-page report. What is the most appropriate coordinator design change?", "options": [{"letter": "A", "text": "Have the coordinator assess each query's scope and invoke only the subagents it requires, skipping analysis and reporting for simple facts.", "correct": true, "explanation": "The coordinator's role includes deciding which subagents a query needs, not just sequencing a fixed pipeline. Dynamic selection lets a single-fact question run web search alone and answer directly, while broad topics still get full treatment. This addresses both latency and the mismatch between question and output form."}, {"letter": "B", "text": "Add a keyword-based classifier in front of the coordinator that routes short questions to a standalone Q&A model, bypassing the research system.", "correct": false, "explanation": "A pre-filter duplicates a judgement the coordinator is well placed to make with full language understanding, and keyword rules will misroute many queries. It also creates a second system to maintain. The coordinator already sees the query; let it decide."}, {"letter": "C", "text": "Reduce the report generation subagent's target length so that simple queries produce a short report instead of twelve pages.", "correct": false, "explanation": "Shortening the report treats the symptom. The four-minute latency comes from running document analysis and synthesis that a factual question does not need. Output length settings do not remove unnecessary pipeline stages."}, {"letter": "D", "text": "Cache completed reports and serve factual queries from cached content when the topic overlaps a prior research run.", "correct": false, "explanation": "Caching helps only for repeated topics and returns stale figures for facts that change. Most one-off factual questions will miss the cache and still pay the full pipeline cost. The structural issue is that the pipeline is not adaptive to query scope."}], "overall": "", "domain": "Multi-Agent Research System — Agentic Architecture"}, {"prompt": "Human reviewers reject 25% of generated reports for coverage gaps: a subtopic is mentioned in the introduction but has no supporting findings in the body. The coordinator currently decomposes the topic, delegates once, passes results to synthesis, and returns the report. Reviewers note the gaps are usually obvious from reading the synthesis output itself. What architectural change best addresses this?", "options": [{"letter": "A", "text": "Double the number of initial search queries per subtopic so that first-pass coverage is broad enough to avoid gaps.", "correct": false, "explanation": "Broader initial search raises cost on every run and still cannot anticipate which subtopics will come back thin. Gaps are only knowable after synthesis. Spending more up front is less efficient than checking the result and filling specific holes."}, {"letter": "B", "text": "Add a second, independent synthesis subagent and have the coordinator merge the two syntheses to reduce omissions.", "correct": false, "explanation": "Two syntheses of the same incomplete findings will share the same gaps, because the missing evidence was never gathered. Redundant synthesis addresses variance in writing, not missing inputs, and doubles the most expensive stage."}, {"letter": "C", "text": "Have the coordinator check the synthesis for gaps, re-delegate targeted queries, and re-run synthesis until coverage is sufficient.", "correct": true, "explanation": "An iterative refinement loop turns the coordinator's single pass into evaluate, re-delegate with targeted queries, and re-synthesise. Because reviewers can spot the gaps from the synthesis output, the coordinator can too, and it fixes them before the human sees the report. Cost is spent only where gaps actually exist."}, {"letter": "D", "text": "Move the gap check to the human reviewers earlier in the pipeline, having them approve the decomposition before delegation begins.", "correct": false, "explanation": "Reviewing decomposition catches narrow plans but not subtopics that were planned and then came back with no usable findings, which is the failure described. It also adds human latency to every run when the system could self-check the output."}], "overall": "", "domain": "Multi-Agent Research System — Agentic Architecture"}, {"prompt": "An engineer asks your agent to \"add comprehensive tests to the billing service\", a 400-file legacy module with almost no tests. The agent begins with the first file alphabetically, writes tests, moves to the next, and exhausts its context after about 30 files, most of them low-risk utility helpers. Critical payment flows remain untested. Which decomposition strategy should the agent follow instead?", "options": [{"letter": "A", "text": "Map the module's structure first, identify high-impact areas, then produce a prioritised plan that adapts as dependencies are discovered.", "correct": true, "explanation": "Open-ended tasks call for adaptive decomposition: understand the structure, find where risk concentrates, and plan in priority order, revising as the code reveals dependencies. This puts effort on payment flows before helpers and survives context limits because the plan, not the alphabet, drives what happens next."}, {"letter": "B", "text": "Process the same alphabetical order but spawn a fresh subagent for every 25 files so context does not run out before the module is finished.", "correct": false, "explanation": "Partitioning by count fixes the exhaustion symptom but keeps the arbitrary ordering, so the effort distribution is still unrelated to risk, and per-file tests written in isolation miss cross-file flows. Decomposition should follow the code's importance, not its file names."}, {"letter": "C", "text": "Restrict the task to files changed in the last quarter, since recently modified code is the most likely place for defects.", "correct": false, "explanation": "Recency is one useful risk signal, but legacy payment logic that has not changed in years can be the highest-impact code in the module. Narrowing the request this way silently redefines \"comprehensive\" rather than planning how to achieve it."}, {"letter": "D", "text": "Use a fixed pipeline: generate tests for every file in one pass, then run a second pass to add integration tests across files.", "correct": false, "explanation": "A fixed two-pass chain suits predictable, uniform work such as reviewing each file in a PR. Here the scope is unknown and far larger than the context budget, so a pass over every file will hit the same wall. Investigation must shape the plan before generation begins."}], "overall": "", "domain": "Developer Productivity with Claude — Agentic Architecture"}, {"prompt": "Your boilerplate generator produces a new CRUD resource: model, migration, HTTP handler, validation schema, and tests, in that order, with each file depending on the previous one. Implemented as an open-ended agent with a goal prompt, it sometimes writes the handler before the model, omits the tests, or invents field names inconsistent across files. Reliability matters more than creativity here. What should you change?", "options": [{"letter": "A", "text": "Keep the open-ended agent but add a self-review step at the end that checks the five files exist and use consistent field names.", "correct": false, "explanation": "A final self-check catches some omissions but leaves the generation process unpredictable and adds a repair loop after the fact. When the steps are known and fixed, verifying afterwards is slower and less reliable than structuring the work so the errors cannot occur."}, {"letter": "B", "text": "Spawn one subagent per file type in parallel so each produces its artifact independently, then merge the five outputs.", "correct": false, "explanation": "The files depend on each other: the handler needs the model's fields, the tests need the handler's routes. Parallel independent generation guarantees the inconsistency you are trying to remove. Parallelism suits independent subtasks, not a dependent chain."}, {"letter": "C", "text": "Replace the goal prompt with a single, longer prompt that lists the five files and their required contents in detail.", "correct": false, "explanation": "A longer single prompt still asks the model to hold five interdependent outputs in one generation, where attention dilution and drift produce the inconsistent names you already see. Detail helps, but structure across steps is what enforces order and consistency."}, {"letter": "D", "text": "Use prompt chaining: a fixed sequence of focused steps where each step receives the previous step's output as input.", "correct": true, "explanation": "The workflow is predictable and every step's inputs are known, which is exactly the case for a fixed sequential chain. Each prompt does one thing and feeds structured output, such as the model's fields, into the next, so the handler cannot precede the model and field names stay consistent. Dynamic decomposition is for open-ended tasks, not this one."}], "overall": "", "domain": "Developer Productivity with Claude — Agentic Architecture"}, {"prompt": "After a 40-minute session in which Claude built a detailed understanding of a legacy reporting module, your team wants to compare two refactoring strategies, an incremental strangler approach and an in-place rewrite, and pick one. You want both explorations to start from the same analysis without either being influenced by the other's conclusions. What is the most efficient approach?", "options": [{"letter": "A", "text": "Ask the same session to explore the strangler approach first, then the rewrite, and finally compare the two.", "correct": false, "explanation": "Exploring sequentially in one session means the rewrite discussion happens with the strangler analysis in context, biasing the comparison and letting abandoned ideas leak into later reasoning. It also risks context exhaustion before the comparison is reached."}, {"letter": "B", "text": "Fork the session twice from the current point and explore one strategy in each fork, then compare the outcomes.", "correct": true, "explanation": "Forking creates independent branches that share the 40 minutes of analysis as a common baseline while keeping each exploration isolated. Neither branch sees the other's reasoning, so the comparison is fair, and nothing is re-analysed. This is the intended use of <code>fork_session</code>."}, {"letter": "C", "text": "Start two fresh sessions, each seeded with a written summary of the module analysis, and explore one strategy in each.", "correct": false, "explanation": "Fresh sessions with a summary are the right choice when prior context is stale. Here the analysis is current and detailed, and a summary would lose the file-level findings both explorations need. Forking preserves that baseline intact."}, {"letter": "D", "text": "Resume the session tomorrow with a prompt asking Claude to outline both strategies side by side in a single response.", "correct": false, "explanation": "A side-by-side outline in one turn is a shallow comparison, not an exploration; neither approach gets investigated against the code. It also has the same cross-contamination problem as sequential exploration, since one response reasons about both at once."}], "overall": "", "domain": "Developer Productivity with Claude — Agentic Architecture"}, {"prompt": "Your CI failure-triage job runs a fixed three-step script: read the test log, read the failing test file, propose a fix. It works for simple assertion failures but produces wrong fixes when the cause is a stale fixture, a misconfigured environment variable, or a flaky external dependency, because the relevant files are never examined. Engineers now distrust its output. How should the job be restructured?", "options": [{"letter": "A", "text": "Expand the fixed script to seven steps that also read fixtures, environment config, and dependency manifests on every run.", "correct": false, "explanation": "Adding more fixed steps reads files irrelevant to most failures and still misses causes you have not anticipated. It increases cost on every run while remaining brittle to the next unforeseen category. The problem is the fixed shape, not the step count."}, {"letter": "B", "text": "Let the agent form an investigation plan from the log and generate follow-up subtasks based on what each step reveals.", "correct": true, "explanation": "Root-cause triage is an open-ended investigation: the right next file depends on what the log and first reads show. Dynamic decomposition lets the agent follow a stale-fixture clue into fixture files or an environment error into config, rather than proposing fixes from an incomplete picture. Fixed pipelines suit predictable work; this is not that."}, {"letter": "C", "text": "Keep the three-step script but only act when the log contains an assertion error, skipping other failure types.", "correct": false, "explanation": "Scoping down avoids embarrassing wrong fixes but abandons the failures that cost engineers the most time to diagnose. It resolves distrust by doing less rather than by investigating properly, and leaves the majority of triage manual."}, {"letter": "D", "text": "Run three independent instances of the script and post a fix only when at least two agree, to filter out incorrect proposals.", "correct": false, "explanation": "Agreement between runs that all read the same insufficient inputs is not evidence of correctness; they will agree on the same wrong fix. Consensus filters variance, not missing information. The agent needs to look at different files, not vote."}], "overall": "", "domain": "Claude Code for Continuous Integration — Agentic Architecture"}, {"prompt": "Your review bot implements its own agentic loop against the Messages API with a hard limit of five iterations as the stopping rule. For large pull requests, the bot posts partial reviews that end mid-analysis, and logs show the fifth response had <code>stop_reason: \"tool_use\"</code> with a pending request to read another file. Small PRs finish fine. What is the correct fix?", "options": [{"letter": "A", "text": "Raise the limit to twenty iterations, which comfortably covers the largest pull requests observed over the past quarter.", "correct": false, "explanation": "A higher cap moves the failure to a larger PR and still treats an arbitrary count as the completion signal. The next unusually large change will produce the same truncated review, and the bot will still post partial output as if it were complete."}, {"letter": "B", "text": "Loop while <code>stop_reason</code> is <code>tool_use</code>, stop on <code>end_turn</code>, and keep a generous cap only as an explicit-failure safety fallback.", "correct": true, "explanation": "The model signals whether it has finished; the loop should follow that signal. Continuing on <code>tool_use</code> and stopping on <code>end_turn</code> makes review length follow the work required. A high ceiling remains sensible protection against runaway loops, but hitting it should be surfaced as an error, never posted as a finished review."}, {"letter": "C", "text": "Instruct the model in the system prompt to complete its review within five tool calls and summarise remaining concerns if it runs short.", "correct": false, "explanation": "This asks the model to compress its analysis to fit an arbitrary budget and rewards shallow reviews on exactly the PRs that need depth. It also does not fix the loop, which still exits on a count rather than on the model's completion signal."}, {"letter": "D", "text": "Have the model end its final message with the marker <code>REVIEW COMPLETE</code> and stop the loop only when that string appears in the text.", "correct": false, "explanation": "Parsing text for a sentinel is the anti-pattern the structured <code>stop_reason</code> field exists to avoid. The model may omit or paraphrase the marker, and a marker present alongside a pending tool call would still be ambiguous. The API already tells you when the turn is finished."}], "overall": "", "domain": "Claude Code for Continuous Integration — Agentic Architecture"}, {"prompt": "Your extraction agent has tools <code>extract_fields</code>, <code>validate_totals</code>, and <code>write_record</code>, and the system prompt says to validate before writing. In 6% of runs the agent calls <code>write_record</code> directly after extraction, and downstream finance reports now contain invoices whose line items do not sum to the total. Rejecting bad records downstream is expensive. Which change eliminates the problem?", "options": [{"letter": "A", "text": "Rewrite the system prompt to describe the validate-then-write sequence in bold at the top and repeat it in the <code>write_record</code> description.", "correct": false, "explanation": "The rule is already in the prompt and is skipped 6% of the time; emphasis and repetition lower the rate but leave a probabilistic gate on a step that feeds financial reporting. When downstream rejection is costly, the sequence needs to be guaranteed, not encouraged."}, {"letter": "B", "text": "Add a programmatic prerequisite that blocks <code>write_record</code> until <code>validate_totals</code> has returned a passing result for that document.", "correct": true, "explanation": "A prerequisite gate at the tool-call boundary makes the ordering deterministic: the write cannot execute without a recorded validation pass. The 6% of runs that skip validation are redirected rather than allowed through, and the model can still decide everything else about how it processes the document."}, {"letter": "C", "text": "Merge validation into <code>write_record</code> so the write tool computes the sums itself and refuses records that fail.", "correct": false, "explanation": "Folding validation into the write tool prevents bad writes but hides the validation step from the agent, so it loses the chance to retry extraction with the specific error before attempting a write. It also couples two concerns into one tool, making each harder to describe and reuse."}, {"letter": "D", "text": "Add few-shot examples to the prompt showing the correct three-call sequence for several invoice types, including edge cases.", "correct": false, "explanation": "Examples improve compliance and are worth having for extraction quality, but they remain guidance. A 6% skip rate on a financially significant step indicates the need for enforcement; more examples shift the rate without providing a guarantee."}], "overall": "", "domain": "Structured Data Extraction — Agentic Architecture"}, {"prompt": "Your <code>process_refund</code> MCP tool returns the string \"Operation failed\" for every failure. Logs show two very different situations behind it: payment gateway timeouts, and refunds rejected because the 30-day window has passed. The agent retries the policy rejections three times and then tells the customer to \"try again later\", while sometimes giving up immediately on the transient gateway errors. How should the tool respond instead?", "options": [{"letter": "A", "text": "Return distinct error strings such as \"gateway timeout\" and \"refund window expired\" so the agent can tell the two situations apart from the wording.", "correct": false, "explanation": "Distinct wording is better than a uniform message, but it still asks the model to infer retry policy from prose, and a new error type tomorrow will be interpreted inconsistently. Recovery decisions should be driven by explicit metadata the agent can rely on, not by string matching."}, {"letter": "B", "text": "Add a separate <code>check_refund_eligibility</code> tool the agent must call first, so <code>process_refund</code> is only reached for eligible orders.", "correct": false, "explanation": "A pre-check adds a round trip to every refund and does nothing for the gateway timeouts, which are the other half of the problem. It also reproduces business logic in a second place. The tool that fails is the one that must explain how it failed."}, {"letter": "C", "text": "Return structured error metadata: <code>errorCategory</code> transient or business, an <code>isRetryable</code> flag, and a customer-friendly message for policy rejections.", "correct": true, "explanation": "Structured error responses let the agent act correctly without guessing: retry transient failures, stop immediately on <code>isRetryable: false</code>, and relay a ready-made explanation such as the expired window to the customer. A uniform \"Operation failed\" hides exactly the information the recovery decision depends on."}, {"letter": "D", "text": "Catch failures inside the tool and return a success response containing a note about the problem, avoiding retries entirely.", "correct": false, "explanation": "Reporting failure as success removes the agent's ability to recover at all: it may tell the customer the refund went through, and it will not retry a gateway timeout that would have succeeded. Errors must be visible as errors, with enough structure to act on."}], "overall": "", "domain": "Customer Support Resolution Agent — Tool Design & MCP"}, {"prompt": "To reduce escalations, you connected the CRM, billing, shipping, and loyalty MCP servers to the support agent, giving it 18 tools instead of the original 4. Tool selection accuracy fell from 94% to 71%, with the agent calling <code>get_loyalty_balance</code> or <code>get_shipping_rates</code> during ordinary refund conversations. All 18 tool descriptions are clear and distinct. What is the most effective remedy?", "options": [{"letter": "A", "text": "Add few-shot examples to the system prompt for each of the 18 tools, illustrating the request types and phrasings that should trigger it.", "correct": false, "explanation": "Eighteen sets of examples add substantial prompt length and still leave the model choosing among 18 near-neighbours on every turn. Examples help with ambiguous cases between a few tools; they do not fix a decision space that has grown too wide for the agent's actual job."}, {"letter": "B", "text": "Set <code>tool_choice</code> to <code>any</code> so the agent commits to a tool each turn rather than deliberating across every available option.", "correct": false, "explanation": "<code>tool_choice: \"any\"</code> forces a tool call but does not narrow which one; it would increase spurious calls to irrelevant tools in turns where the agent should have replied in text. The problem is the size of the choice set, not the model's willingness to choose."}, {"letter": "C", "text": "Rewrite the 18 descriptions to include explicit \"do not use for\" boundaries referencing each of the other 17 tools.", "correct": false, "explanation": "The descriptions are already clear and distinct; cross-referencing every tool against every other one produces long, brittle descriptions that must be maintained as tools change. Even perfectly described tools degrade selection when there are too many of them for the role."}, {"letter": "D", "text": "Scope the agent back to the 4 or 5 tools its workflows need, and route rare loyalty or shipping cases through escalation or a dedicated agent.", "correct": true, "explanation": "Giving an agent many more tools than its role requires degrades selection reliability regardless of description quality, because every turn becomes a harder decision. Restricting the set to the high-frequency tools restores the 94% behaviour, and the rare cases are handled by a path designed for them rather than by cluttering the main agent."}], "overall": "", "domain": "Customer Support Resolution Agent — Tool Design & MCP"}, {"prompt": "Before resolving any case the agent needs the applicable policy. Today it calls <code>list_policies</code>, reads the names, calls <code>get_policy</code> for one or two candidates, and often calls <code>list_policies</code> again later in the conversation. This exploratory sequence adds three tool calls and about 25 seconds per case. The policy set has 14 documents and changes monthly. How should you expose the policies through MCP?", "options": [{"letter": "A", "text": "Expose the policy documents as MCP resources so the agent sees the catalogue of policies up front without exploratory calls.", "correct": true, "explanation": "MCP resources are the mechanism for exposing content catalogues such as policy documents. The agent gains visibility into what exists and can pull the relevant policy directly, removing the list-then-fetch discovery loop from every case. Monthly changes are handled by the server updating the resource set."}, {"letter": "B", "text": "Merge <code>list_policies</code> and <code>get_policy</code> into one <code>find_policy</code> tool that accepts a natural-language query and returns the best match.", "correct": false, "explanation": "A search tool still requires a call per lookup and introduces a ranking step that can return the wrong policy silently. It reduces one round trip but keeps policies invisible until asked for. For a small, known set of documents, a catalogue the agent can see beats a search it must run."}, {"letter": "C", "text": "Paste the 14 policy documents into the system prompt so the agent can consult any policy without making a tool call.", "correct": false, "explanation": "Inlining every policy burns context on each turn of every conversation, most of which never touch most policies, and requires a prompt redeploy on each monthly change. It removes the round trips at the cost of the context budget that long support cases need."}, {"letter": "D", "text": "Add a <code>PostToolUse</code> hook that caches <code>list_policies</code> results for the session so repeated listing calls return instantly.", "correct": false, "explanation": "Caching speeds up the repeated listing but leaves the initial discovery sequence in place and still spends model turns on calls whose only purpose is to learn what exists. Hooks are for transforming or gating tool traffic, not for substituting a missing catalogue."}], "overall": "", "domain": "Customer Support Resolution Agent — Tool Design & MCP"}, {"prompt": "The document analysis subagent has one tool, <code>analyze_document</code>, taking a document and a free-text <code>instructions</code> field. Depending on the instruction, it returns summaries, extracted figures, or claim checks in inconsistent shapes, and the synthesis agent misparses about a fifth of them. The coordinator's prompts to the analysis agent already spell out the desired output. What is the best fix?", "options": [{"letter": "A", "text": "Add an <code>output_format</code> enum parameter to <code>analyze_document</code> so the caller specifies whether it wants a summary, data points, or a verification.", "correct": false, "explanation": "An enum on a single tool is a lighter fix, but the tool still has one description covering three unrelated jobs, and the model must pick the right mode each call. Description ambiguity is what causes misrouting; splitting the tool gives each job a clear description and an output contract of its own."}, {"letter": "B", "text": "Have the synthesis agent tolerate the variation by adding a normalisation step that detects the output shape and converts it.", "correct": false, "explanation": "Downstream normalisation absorbs the mess instead of removing it, and each new output variation requires new detection logic. The synthesis agent's context is also the scarcest in the system; spending it on reshaping inputs is the wrong trade."}, {"letter": "C", "text": "Split it into <code>extract_data_points</code>, <code>summarize_content</code>, and <code>verify_claim_against_source</code>, each with a defined output schema.", "correct": true, "explanation": "A generic tool driven by free-text instructions cannot promise a stable output shape. Purpose-specific tools give the model an unambiguous choice, give each operation a defined input and output contract, and let the synthesis agent rely on consistent structure. This is the standard remedy for an overloaded generic tool."}, {"letter": "D", "text": "Add few-shot examples to the analysis agent's system prompt showing the exact output layout expected for each kind of instruction.", "correct": false, "explanation": "Examples improve consistency but leave the interface itself undefined: nothing enforces the layout, and the tool description still cannot say what the tool returns. Tool contracts belong in the tool definition, where the schema enforces them, not only in prose examples."}], "overall": "", "domain": "Multi-Agent Research System — Tool Design & MCP"}, {"prompt": "Every research run must begin by calling <code>decompose_topic</code>, which produces the subtopic partition the coordinator uses to assign work. In about 10% of runs the coordinator skips it and issues <code>Task</code> calls directly, producing overlapping assignments. The system prompt already says the first action must be <code>decompose_topic</code>. How do you guarantee the first call?", "options": [{"letter": "A", "text": "Set <code>tool_choice</code> to <code>any</code> on the first request so the coordinator must call a tool before producing text.", "correct": false, "explanation": "<code>any</code> guarantees some tool is called but not which one; the coordinator could just as easily open with a <code>Task</code> call, which is the failure you observe. Guaranteeing a specific tool needs forced selection by name."}, {"letter": "B", "text": "Force the first request with <code>tool_choice: {\"type\": \"tool\", \"name\": \"decompose_topic\"}</code>, then use <code>auto</code> for subsequent turns.", "correct": true, "explanation": "Forced tool selection makes the model call the named tool on that request, which is exactly the deterministic guarantee needed for a mandatory first step. Switching back to <code>auto</code> afterwards restores normal model-driven selection for delegation and synthesis. Prompt instructions alone leave a non-zero skip rate."}, {"letter": "C", "text": "Move the instruction from the system prompt into the first user message, where recent instructions carry more weight with the model.", "correct": false, "explanation": "Instruction placement can shift compliance rates, but it is still prompt guidance and the observed 10% skip rate demonstrates that guidance is insufficient here. When the API offers a mechanism that guarantees the call, relying on placement is the weaker choice."}, {"letter": "D", "text": "Add a <code>PostToolUse</code> hook on <code>Task</code> that rejects the call with an error if <code>decompose_topic</code> has not run yet in this session.", "correct": false, "explanation": "A blocking hook does prevent the bad delegation, but it acts after the model has already spent a turn choosing wrongly and needs an error round trip to recover. Forced <code>tool_choice</code> prevents the wrong first call at request time with no wasted turn and no extra infrastructure."}], "overall": "", "domain": "Multi-Agent Research System — Tool Design & MCP"}, {"prompt": "You gave the document analysis subagent an MCP tool <code>semantic_search_corpus</code> that performs embedding-based search over the ingested document set with citation-ready excerpts. Its description is \"Search corpus\". In practice the agent uses the built-in <code>Grep</code> tool against raw text dumps almost every time, missing paraphrased passages and producing weaker citations. What is the most likely fix?", "options": [{"letter": "A", "text": "Remove <code>Grep</code> from the subagent's allowed tools so the MCP search tool is the only content search available to it.", "correct": false, "explanation": "Removing the alternative forces the outcome but throws away a tool that is genuinely better for exact identifiers and error strings. It also leaves the underlying problem in place: an MCP tool whose description gives the model no reason to prefer it, which will recur with the next MCP tool you add."}, {"letter": "B", "text": "Add a system prompt rule stating that MCP tools take priority over built-in tools whenever both could plausibly satisfy a request.", "correct": false, "explanation": "A blanket preference rule is a blunt instrument that will misfire for tasks where built-ins are right, and it still does not tell the model what <code>semantic_search_corpus</code> actually does. Tool selection should follow from understanding each tool's capability, not from a category rule."}, {"letter": "C", "text": "Rewrite the description to explain semantic matching, the citation-ready excerpts, and when to prefer it over exact-text search.", "correct": true, "explanation": "The model chooses tools from their descriptions, and a two-word description gives it no reason to prefer an unfamiliar MCP tool over the well-known <code>Grep</code>. Describing the capability, the output shape, and the boundary against exact-text search lets the model select correctly on its own, and keeps <code>Grep</code> for the cases where it is the right tool."}, {"letter": "D", "text": "Rename the tool to <code>grep_corpus</code> so the model associates it with the search behaviour it already reaches for by default.", "correct": false, "explanation": "Borrowing the built-in tool's name signals exact-text matching, which is precisely what this tool does not do, and would confuse selection further. Names should differentiate tools; the fix is a description that explains why this search is different."}], "overall": "", "domain": "Multi-Agent Research System — Tool Design & MCP"}, {"prompt": "An engineer asks the agent to find every caller of the deprecated <code>parseConfig</code> function across a 2,000-file TypeScript monorepo. The agent runs <code>Glob</code> with the pattern <code>**/*parseConfig*</code>, gets no results, and reports that the function is unused. The engineer knows it is called from at least a dozen modules. What should the agent have done?", "options": [{"letter": "A", "text": "Use <code>Grep</code> to search file contents for <code>parseConfig(</code> across the repository, then <code>Read</code> matching files to confirm call sites.", "correct": true, "explanation": "Callers are found in file contents, not file names. <code>Grep</code> searches content for a pattern across the codebase and returns the matching locations, which is exactly what \"every caller\" requires; <code>Read</code> then confirms context where needed. <code>Glob</code> matches paths, so a function name will almost never appear in a path."}, {"letter": "B", "text": "Broaden the <code>Glob</code> pattern to <code>**/*.ts</code> to list every TypeScript file, then <code>Read</code> each one looking for the call.", "correct": false, "explanation": "Listing all 2,000 files and reading each is the brute-force approach that exhausts context and time, and it still uses <code>Glob</code> for a job it does not do. Content search exists precisely so the agent does not have to read everything to find a string."}, {"letter": "C", "text": "Use <code>Glob</code> to locate the module that exports <code>parseConfig</code>, then <code>Read</code> it and follow its import statements to find the dependent modules.", "correct": false, "explanation": "Imports point outward from the exporting module to its dependencies, not inward from callers, so following them from the definition finds nothing useful. Finding dependents requires searching the rest of the codebase for references, which is content search."}, {"letter": "D", "text": "Run <code>Bash</code> with <code>find . -name \"*parseConfig*\"</code> to locate the relevant files, since shell tools are faster on large repositories.", "correct": false, "explanation": "This repeats the same mistake in a different tool: <code>find -name</code> matches file names, not contents, and will return nothing for the same reason <code>Glob</code> did. Speed is irrelevant when the search is looking in the wrong place."}], "overall": "", "domain": "Developer Productivity with Claude — Tool Design & MCP"}, {"prompt": "The agent needs to change <code>return null;</code> to <code>return defaultConfig;</code> inside <code>loadUserConfig</code> in a generated file. The file contains four handler functions whose bodies are identical for several lines around that statement, differing only in the function name declared far above. <code>Edit</code> fails with \"Found 4 matches for old_string\", and widening the anchor by a few lines still matches all four. What is the correct fallback?", "options": [{"letter": "A", "text": "Retry <code>Edit</code> with <code>replace_all</code> enabled, then run three further <code>Edit</code> calls to revert the change in the other functions.", "correct": false, "explanation": "Replacing all four and reverting three needs the reverts to target unique text, which is the same problem in reverse, since the changed lines are still identical across functions. It multiplies risk and edits instead of making one reliable change."}, {"letter": "B", "text": "Use <code>Bash</code> with <code>sed</code> to replace the statement at the specific line number reported by the earlier <code>Read</code>.", "correct": false, "explanation": "Line-number edits are brittle: any earlier change shifts the target and the edit lands on a different function silently. It also bypasses the file-editing tools' safeguards and diff visibility. When <code>Edit</code> cannot anchor, the documented fallback is a full-file rewrite, not shell surgery."}, {"letter": "C", "text": "Ask the engineer to rename the four functions so each body becomes unique, then retry <code>Edit</code> with the same anchor text.", "correct": false, "explanation": "Requesting a manual refactor to work around a tool limitation blocks the task on the human and changes unrelated code. The agent has the tools to complete the modification itself once it stops relying on a unique text anchor."}, {"letter": "D", "text": "<code>Read</code> the whole file, apply the change to the correct function's body, and <code>Write</code> the complete updated content back.", "correct": true, "explanation": "<code>Edit</code> depends on a unique text match; when the surrounding code is repeated and no unique anchor exists, the reliable path is <code>Read</code> followed by <code>Write</code> of the full file with the targeted change. The agent knows which function it is in from the file structure, so the rewrite is precise and the result is verifiable."}], "overall": "", "domain": "Developer Productivity with Claude — Tool Design & MCP"}, {"prompt": "Asked to explain how an order flows from the REST endpoint to the database in an unfamiliar 340-file service, the agent begins by reading every file under <code>src/</code> to \"build a complete picture\". It hits the context limit around file 180 having never located the endpoint handler, and its explanation is generic. How should the agent approach codebase exploration instead?", "options": [{"letter": "A", "text": "Read every file but summarise each into one line as it goes, keeping only the summaries in context to stay under the limit.", "correct": false, "explanation": "This still spends 340 file reads and produces summaries with no relation to the question being asked. The problem is not compression but direction: the agent is reading indiscriminately instead of following the flow it was asked to explain."}, {"letter": "B", "text": "Use <code>Grep</code> to find the order endpoint and its handler, then <code>Read</code> it and follow its imports step by step to the data layer.", "correct": true, "explanation": "Incremental exploration starts from an entry point found with content search and follows imports and calls along the specific path in question. It touches perhaps a dozen files, keeps context focused on relevant code, and yields a concrete trace rather than a generic description. Reading everything up front is the anti-pattern for large codebases."}, {"letter": "C", "text": "Delegate to a subagent that reads the 340 files and returns a full architectural overview, so the main context is preserved.", "correct": false, "explanation": "Isolating verbose output in a subagent protects the main context, but the subagent would still perform the same undirected bulk read and hit the same limit, returning an overview rather than the requested flow. Delegation helps when the delegated task is itself well targeted."}, {"letter": "D", "text": "Use <code>Glob</code> to list the files and read only those in the top-level directories, assuming the entry points live there.", "correct": false, "explanation": "Directory position is a weak guess at where an endpoint lives, and even if the handler is found this way the flow into repositories and models still needs to be traced. A content search for the route or handler name is a direct way to locate the starting point."}], "overall": "", "domain": "Developer Productivity with Claude — Tool Design & MCP"}, {"prompt": "Your team wants the productivity agent to read Jira tickets, add comments, and transition issue states so engineers can work a ticket end to end from Claude Code. A teammate has started writing a custom MCP server against the Jira REST API and estimates two more weeks to cover authentication, pagination, and error handling. Nothing about your Jira usage is unusual. What should you recommend?", "options": [{"letter": "A", "text": "Finish the custom server, since owning the code makes it easier to shape the tool descriptions and error responses to your agent's needs.", "correct": false, "explanation": "Control over descriptions and errors is real, but the two weeks buy an integration that already exists and must then be maintained against Jira API changes. Custom MCP servers are justified for team-specific workflows, not for re-implementing a standard integration."}, {"letter": "B", "text": "Skip MCP and give the agent a set of <code>Bash</code> scripts wrapping <code>curl</code> calls to the Jira API, documented in CLAUDE.md.", "correct": false, "explanation": "Shell wrappers lose the typed tool schemas, descriptions, and structured errors that make tool selection reliable, and they push credential handling into scripts. This is a step backwards from MCP for exactly the reasons MCP exists."}, {"letter": "C", "text": "Adopt an existing community or vendor Jira MCP server, and reserve custom server development for workflows specific to your team.", "correct": true, "explanation": "Standard integrations such as Jira are well served by existing MCP servers that already handle auth, pagination, and errors. Adopting one delivers the capability now and leaves engineering effort for the workflows that are genuinely unique to your team. Custom servers are the right tool only when no existing server fits."}, {"letter": "D", "text": "Expose the Jira project as MCP resources so the agent can browse tickets, and defer commenting and transitions to a later phase.", "correct": false, "explanation": "Resources suit read-only content catalogues, but the team explicitly needs actions: comments and state transitions require tools. Scoping down to browsing does not meet the stated goal, and an existing server already provides both reading and acting."}], "overall": "", "domain": "Developer Productivity with Claude — Tool Design & MCP"}, {"prompt": "Your pipeline defines three extraction tools, <code>extract_invoice</code>, <code>extract_receipt</code>, and <code>extract_purchase_order</code>, and lets the model choose based on the document. With <code>tool_choice</code> left at <code>auto</code>, about 4% of responses contain no tool call at all, just prose such as \"This appears to be an invoice from Acme Corp\", which your parser rejects. Document types arrive unlabeled. Which change fixes this?", "options": [{"letter": "A", "text": "Add a fallback parser that extracts the document type from the prose response and re-calls the model with the matching tool forced.", "correct": false, "explanation": "Parsing prose to recover from a structured-output failure adds a round trip and a fragile text-matching step for a problem the API can prevent outright. The 4% should never reach the parser as prose in the first place."}, {"letter": "B", "text": "Add a system prompt instruction: \"Respond only with a tool call, no text\", and lower the temperature to reduce variance.", "correct": false, "explanation": "Prompt instructions reduce but do not eliminate conversational responses under <code>auto</code>, and temperature affects randomness of content, not the decision to call a tool. A residual failure rate remains where a hard guarantee is available."}, {"letter": "C", "text": "Force <code>extract_invoice</code> with <code>tool_choice: {\"type\": \"tool\", \"name\": \"extract_invoice\"}</code>, since invoices are the most common document type.", "correct": false, "explanation": "Forcing one named tool guarantees a call but removes the model's ability to select the receipt or purchase order schema, so every non-invoice document would be extracted into the wrong shape. Forced selection is for when the required tool is already known."}, {"letter": "D", "text": "Set <code>tool_choice</code> to <code>any</code> so the model must call one of the three tools but still chooses which based on the document.", "correct": true, "explanation": "<code>any</code> guarantees that the response is a tool call while leaving the choice among the three schemas to the model, which is exactly what unlabeled documents require. It removes the prose responses deterministically without sacrificing type selection, unlike forcing a single tool or relying on prompt wording."}], "overall": "", "domain": "Structured Data Extraction — Tool Design & MCP"}, {"prompt": "Your monorepo has four packages, each with its own CLAUDE.md. About 80 lines of shared standards, covering logging, error handling, and commit conventions, are copied into all four and have drifted: two packages still describe a retired logging library. Package maintainers also want to opt into only the standards relevant to their package, such as the API package including HTTP conventions that the CLI package does not need. What is the most maintainable structure?", "options": [{"letter": "A", "text": "Keep one shared standards file per topic and have each package's CLAUDE.md reference the ones it needs with <code>@path/to/file</code> imports.", "correct": true, "explanation": "The <code>@import</code> syntax keeps CLAUDE.md modular: shared standards live once, so drift disappears, and each package's file imports only the topic files its maintainers judge relevant. This satisfies both the deduplication need and the selective-inclusion need without a single monolithic root file."}, {"letter": "B", "text": "Move the shared standards into the root CLAUDE.md so every package inherits them, and delete the duplicated sections from the package files.", "correct": false, "explanation": "A root file removes drift but applies every standard to every package, so the CLI package receives HTTP conventions it does not need and maintainers lose the selective control they asked for. It also grows into the monolith that becomes hard to navigate."}, {"letter": "C", "text": "Add a CI check that fails when the shared sections in the four CLAUDE.md files differ, forcing maintainers to keep the copies in sync.", "correct": false, "explanation": "Linting copies enforces sameness but preserves the duplication and blocks the per-package selectivity maintainers want, since a diff would fail the check. It adds process to manage a problem the import mechanism removes entirely."}, {"letter": "D", "text": "Convert the shared standards into a skill in <code>.claude/skills/</code> that developers invoke at the start of each session to load the conventions.", "correct": false, "explanation": "Skills are for on-demand, task-specific workflows. Universal standards must always be in effect, and relying on a developer remembering to invoke a skill each session makes compliance optional. Always-loaded conventions belong in CLAUDE.md or imported files."}], "overall": "", "domain": "Code Generation with Claude Code — Claude Code Config"}, {"prompt": "A developer reports that Claude Code follows the team's testing conventions in some sessions but not others, even within the same repository. They suspect a stale personal instruction or a directory-level CLAUDE.md is interfering but are not sure which files Claude is actually loading in a given session. What is the quickest way to diagnose this?", "options": [{"letter": "A", "text": "Run <code>/compact</code> to clear accumulated context, then re-issue the request and check whether the conventions are now followed.", "correct": false, "explanation": "<code>/compact</code> condenses conversation history; it does not reveal or change which memory files are loaded. Even if behaviour improves once, the developer still would not know which file was responsible, so the inconsistency will return."}, {"letter": "B", "text": "Ask Claude in the session to list every instruction it has received and identify which ones conflict with the testing conventions.", "correct": false, "explanation": "The model's recollection of its instructions is a paraphrase, not a file listing, and it may omit or blend sources. The question is about configuration state, which the tooling can show directly and reliably."}, {"letter": "C", "text": "Run <code>/memory</code> in the affected session to see exactly which CLAUDE.md and memory files are loaded, then inspect those files.", "correct": true, "explanation": "The <code>/memory</code> command shows which memory files are active for the current session, which is precisely the diagnostic needed when hierarchy or scoping is in doubt. From there the developer can see whether a user-level file or a directory-level file is contributing conflicting guidance and fix the right one."}, {"letter": "D", "text": "Open <code>~/.claude.json</code> and review the project entries to see which configuration files are registered for this repository.", "correct": false, "explanation": "<code>~/.claude.json</code> holds user-scoped settings such as personal MCP servers; it is not a registry of which CLAUDE.md files load for a session. Reading it will not answer the question, and CLAUDE.md discovery is based on location, not registration."}], "overall": "", "domain": "Code Generation with Claude Code — Claude Code Config"}, {"prompt": "A production stack trace points to a <code>TypeError</code> in <code>formatInvoiceDate</code> when the invoice has no due date. The fix is a null check in that one function in one file, and the expected behaviour is clear from the surrounding code and an existing test. A teammate insists every change should start in plan mode. How should you proceed?", "options": [{"letter": "A", "text": "Enter plan mode anyway so Claude explores the invoice module for related date handling before touching the function.", "correct": false, "explanation": "Plan mode adds value when scope, approach, or architecture is uncertain. Here the file, the function, and the fix are all known from the trace and the test; an exploration phase spends time producing a plan whose only step is the edit you already know."}, {"letter": "B", "text": "Spawn the Explore subagent to audit date formatting across the codebase, then apply the fix once the audit completes.", "correct": false, "explanation": "A codebase-wide audit is a different, larger task than the requested bug fix and delays a clear production fix behind discovery work nobody asked for. If a broader review is warranted it can be scheduled separately; it should not gate a one-line correction."}, {"letter": "C", "text": "Fork the session, apply the fix in the fork, and merge back only i
