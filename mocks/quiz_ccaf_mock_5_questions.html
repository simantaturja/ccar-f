<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCAF Mock #5 — 60 Questions by Topic</title>
<style>
  :root {
    --bg: #f7f9fa;
    --panel: #ffffff;
    --border: #e3e5e6;
    --text: #1c1d1f;
    --muted: #6a6f73;
    --primary: #5624d0;
    --primary-dark: #3d1b8f;
    --correct: #1e7e34;
    --correct-bg: #e8f5e9;
    --wrong: #c0392b;
    --wrong-bg: #fdecea;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  header.top h1 {
    font-size: 1.3rem;
    margin: 0;
  }
  .score-badge {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 16px;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .progress-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 20px;
  }
  .progress-bar-track {
    background: #eceef0;
    border-radius: 999px;
    height: 8px;
    overflow: hidden;
    margin-top: 8px;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 999px;
    transition: width 0.25s ease;
    width: 0%;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .q-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 20px;
  }
  .q-nav button {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    font-size: 0.78rem;
    cursor: pointer;
    color: var(--text);
  }
  .q-nav button.current { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(86,36,208,0.15); }
  .q-nav button.answered-correct { background: var(--correct-bg); color: var(--correct); border-color: var(--correct); }
  .q-nav button.answered-wrong { background: var(--wrong-bg); color: var(--wrong); border-color: var(--wrong); }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }
  .domain-tag {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--primary);
    background: #f1ecfc;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .q-title {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .prompt {
    white-space: pre-wrap;
    font-size: 1.05rem;
    line-height: 1.55;
    margin-bottom: 20px;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
    background: var(--panel);
    text-align: left;
    font-size: 0.98rem;
    line-height: 1.5;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option:hover:not(.locked) {
    border-color: var(--primary);
    background: #faf8ff;
  }
  .option .letter {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--muted);
  }
  .option.selected-correct {
    border-color: var(--correct);
    background: var(--correct-bg);
  }
  .option.selected-correct .letter {
    background: var(--correct);
    border-color: var(--correct);
    color: #fff;
  }
  .option.selected-wrong {
    border-color: var(--wrong);
    background: var(--wrong-bg);
  }
  .option.selected-wrong .letter {
    background: var(--wrong);
    border-color: var(--wrong);
    color: #fff;
  }
  .option.reveal-correct:not(.selected-correct) {
    border-color: var(--correct);
  }
  .option.reveal-correct:not(.selected-correct) .letter {
    border-color: var(--correct);
    color: var(--correct);
  }
  .option.locked { cursor: default; }
  .option-explanation {
    margin-top: 8px;
    font-size: 0.88rem;
    color: var(--muted);
    padding-left: 38px;
    display: none;
  }
  .option-explanation.show { display: block; }
  .feedback-banner {
    display: none;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-weight: 600;
    font-size: 0.95rem;
  }
  .feedback-banner.show { display: flex; }
  .feedback-banner.correct { background: var(--correct-bg); color: var(--correct); }
  .feedback-banner.wrong { background: var(--wrong-bg); color: var(--wrong); }
  .overall-explanation {
    display: none;
    margin-top: 16px;
    padding: 16px;
    border-radius: var(--radius);
    background: #f7f6fb;
    border: 1px solid var(--border);
    font-size: 0.92rem;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .overall-explanation.show { display: block; }
  .overall-explanation h4 {
    margin: 0 0 8px;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
  }
  .footer-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    gap: 10px;
  }
  .footer-nav button {
    border: none;
    border-radius: 8px;
    padding: 12px 22px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border) !important;
  }
  .btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; background: var(--primary); }
  .restart-row { text-align: center; margin-top: 14px; }
  .restart-row button {
    background: transparent;
    border: none;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .summary-card { text-align: center; }
  .summary-card .big-score {
    font-size: 2.6rem;
    font-weight: 700;
    color: var(--primary);
    margin: 6px 0;
  }
  @media (max-width: 560px) {
    .card { padding: 16px; }
    .option-explanation { padding-left: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>CCAF Mock #5 — 60 Questions by Topic</h1>
    <div class="score-badge" id="scoreBadge">Score: 0 / 0</div>
  </header>

  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progressLabel">Question 1 of 60</span>
      <span id="answeredLabel">0 answered</span>
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
  </div>

  <div class="q-nav" id="qNav"></div>

  <div class="card" id="quizCard"></div>

  <div class="footer-nav">
    <button class="btn-secondary" id="prevBtn">Previous</button>
    <button class="btn-primary" id="nextBtn">Next</button>
  </div>

  <div class="restart-row"><button id="restartBtn">Restart quiz</button></div>
</div>

<script>
const QUESTIONS = [{"prompt": "Across 2,000 sessions, 3% end with neither a completed refund/answer nor an <code>escalate_to_human</code> call. Most are iteration-cap or <code>max_tokens</code> exits, but a quarter are clean <code>end_turn</code> responses such as \"I'm unable to help further with this.\" You own the orchestration layer. Which design guarantees every session ends in resolution or escalation?", "options": [{"letter": "A", "text": "From code, call <code>escalate_to_human</code> on any exit other than <code>end_turn</code>; treat <code>end_turn</code> as the model's signal that the case is resolved.", "correct": false, "explanation": "This closes the cap and truncation exits but leaves the quarter that end cleanly with an apology. <code>end_turn</code> means the model stopped talking, not that the case was resolved; a guarantee cannot rest on it."}, {"letter": "B", "text": "On cap or <code>max_tokens</code> exits, send a user turn asking the model to finish or escalate, up to twice, then escalate from code; treat <code>end_turn</code> as resolved.", "correct": false, "explanation": "Recovery turns are a reasonable tactic for truncation, but the design still equates <code>end_turn</code> with resolution, so the apologetic dead ends remain unhandled. The retries also spend budget in the very sessions closest to the cap."}, {"letter": "C", "text": "Require the model to finish via a <code>resolve_case</code> tool or <code>escalate_to_human</code>; escalate from code on any exit that used neither.", "correct": true, "explanation": "Making resolution an explicit tool call turns \"resolved\" into a machine-checkable event, and the code fallback covers every other exit path: cap, truncation, exceptions, and polite dead ends. Treating <code>end_turn</code> as success or parsing the final text cannot give the same guarantee."}, {"letter": "D", "text": "Add a Stop hook that inspects the final assistant message for resolution language and, if none is found, calls <code>escalate_to_human</code> from the hook.", "correct": false, "explanation": "A hook runs deterministically, but the decision inside it is a natural-language heuristic: phrasing varies, apologies can read like resolutions, and localisation breaks the check. The signal should be structural, not textual."}], "overall": "", "domain": "Customer Support Resolution Agent — Agentic Architecture"}, {"prompt": "When a subagent process crashes or the coordinator exceeds its 20-minute budget, research jobs stay in a <code>running</code> state indefinitely and the requesting user never receives anything. In the last month 4% of jobs ended this way. Partial findings from completed subagents were available in every case. What should the orchestration layer do?", "options": [{"letter": "A", "text": "A finalizer that, on timeout or crash, re-runs the coordinator once with double the budget and emits a failure notice only if the second run also fails.", "correct": false, "explanation": "This defines a terminal state, but doubles the wall-clock of the worst jobs and discards the partial findings already in hand; the requester waits up to an hour to learn nothing was produced. Recovery should start from what exists, not from zero."}, {"letter": "B", "text": "Emit heartbeat events from each agent to a dashboard and page an operator when a job has produced no events for five minutes so a human can intervene.", "correct": false, "explanation": "Observability helps operators notice stuck jobs but turns every failure into a manual chore and still leaves the requester waiting. It is useful alongside a finalizer, not instead of one; the requirement is that the system itself closes every job."}, {"letter": "C", "text": "A finalizer that, on timeout or crash, returns the raw outputs of every completed subagent concatenated, so no findings are lost.", "correct": false, "explanation": "Nothing is lost, but nothing is usable either: the requester receives unsynthesized search dumps with no indication of what was not covered. A defined end state should still be a report, even a partial one, with its gaps marked."}, {"letter": "D", "text": "A finalizer that, on timeout or crash, synthesizes the completed subagents' findings into a partial report with uncovered areas marked and delivers it with an explicit failure status.", "correct": true, "explanation": "Every job then ends in a defined terminal state the requester can see: a report built from what was actually found, honest about what was not, and flagged as incomplete. The other options either restart from zero, wait for a human, dump raw output, or leave the requester in silence."}], "overall": "", "domain": "Multi-Agent Research System — Agentic Architecture"}, {"prompt": "Human agents receiving escalations cannot see the chat transcript. Today <code>escalate_to_human</code> is called with the reason, the customer ID, and the conversation ID. Agents report spending 6 to 8 minutes re-verifying identity, asking for the order number, and rediscovering what the bot already tried. Which payload design best fixes this?", "options": [{"letter": "A", "text": "Add the customer's issue in one sentence and a recommended action, keeping the payload short enough to read at a glance.", "correct": false, "explanation": "Shorter is easier to read, but the two things costing the most time, whether identity was verified and which actions already ran, are still missing. The human keeps re-verifying and re-trying because the payload does not say they can skip it."}, {"letter": "B", "text": "Add a sentiment score, a priority tier, and the customer's lifetime value so the escalation is routed to the right queue faster.", "correct": false, "explanation": "Routing metadata helps the queue, not the agent who picks the case up. None of these fields removes a minute from re-verification or rediscovery, which is where the 6 to 8 minutes go."}, {"letter": "C", "text": "Append the full message history and every raw tool result to the current payload so the human has all the evidence the bot had.", "correct": false, "explanation": "The evidence is there, but unsynthesized: the agent reads through 40-field order payloads to find out what was tried. Completeness at this volume adds reading time rather than removing rediscovery."}, {"letter": "D", "text": "Add verification method and time, order IDs and amounts, actions attempted with outcomes, root cause, and a recommended next action.", "correct": true, "explanation": "Each field removes a step the human is currently repeating: verification state stops re-verification, order facts stop the order-number question, attempted actions stop retries. Structured, complete, and short enough to act on immediately."}], "overall": "", "domain": "Customer Support Resolution Agent — Agentic Architecture"}, {"prompt": "After <code>get_customer</code> verifies identity, the coordinator hands refund cases to a refund subagent. A PreToolUse gate blocks <code>process_refund</code> unless a verified customer ID is present in the session. The subagent, starting with an empty context, either re-runs <code>get_customer</code> and asks the customer for details again, or hits the gate and fails. How should the handoff be designed?", "options": [{"letter": "A", "text": "Put the verified customer ID, verification method and time, and relevant order facts in the subagent's prompt; have the gate accept that record.", "correct": true, "explanation": "Subagents do not inherit context, so authorization state must travel explicitly in the handoff. Passing the verification record lets the gate keep enforcing the rule while the subagent skips redundant work. It preserves both the guarantee and first-contact efficiency."}, {"letter": "B", "text": "Pass only the customer ID in the subagent's prompt and relax the gate to accept any customer ID that appears there.", "correct": false, "explanation": "Passing the ID alone removes the re-verification turn, but relaxing the gate to accept any ID in the prompt means an ID the customer typed, or one the coordinator guessed, satisfies it. The gate no longer proves verification happened."}, {"letter": "C", "text": "Forward the coordinator's full conversation to the subagent and have the gate search that history for a successful <code>get_customer</code> result.", "correct": false, "explanation": "The proof is in the history, but locating it means the gate parses a long transcript with tool payloads, which is fragile and expensive, and the subagent's context fills with material irrelevant to the refund. Authorization state should be explicit."}, {"letter": "D", "text": "Have the coordinator issue a signed session token and have the subagent call <code>get_customer</code> with the token to re-verify silently before acting.", "correct": false, "explanation": "Silent re-verification avoids asking the customer again, but it still costs a tool turn per handoff and requires the backend to support token-based lookups. The coordinator already holds the verified state; passing it is cheaper than re-deriving it."}], "overall": "", "domain": "Customer Support Resolution Agent — Agentic Architecture"}, {"prompt": "An agent tasked with adding tests to a 900-file legacy service follows a fixed sequence: list files with <code>Glob</code>, then generate one test file per source file in alphabetical order. It exhausts its budget after 110 files, having tested string helpers and constants while the payment and ledger modules remain untested. How should the task be decomposed?", "options": [{"letter": "A", "text": "Rank source files by git churn multiplied by size, then generate tests down the ranked list until the budget is spent.", "correct": false, "explanation": "Ranking is better than alphabetical order, but the list is fixed once computed. Churn and size are proxies that miss a stable, rarely edited ledger module, and the agent never revises the plan when it discovers that one module underpins many others."}, {"letter": "B", "text": "Map structure and entry points first, identify high-impact untested areas, then follow a prioritized plan revised as dependencies emerge.", "correct": true, "explanation": "Open-ended work like this benefits from dynamic decomposition: investigate, prioritize, and let intermediate findings reshape the subtasks. Payment and ledger surface early because the plan is driven by discovered risk, not file order. A fixed sequence can never react to what it learns."}, {"letter": "C", "text": "Ask the team for the twenty most critical modules and have the agent generate tests only for those, in the order given.", "correct": false, "explanation": "Human input on criticality is valuable and worth feeding into the plan, but a fixed list of twenty ignores dependencies the agent would discover, and the team's view of criticality is often stale. It also removes the agent's ability to adapt."}, {"letter": "D", "text": "Start from the payment module and follow its imports outward, generating tests for each dependency reached before moving further.", "correct": false, "explanation": "Seeding from a known critical module is adaptive, but the traversal is driven by import edges rather than risk, so trivial utilities imported by payment get tested before the ledger module that payment never imports directly."}], "overall": "", "domain": "Developer Productivity with Claude — Agentic Architecture"}, {"prompt": "For the topic \"AI regulation across the EU, US, and China\", the coordinator creates three regional subtasks up front and dispatches them. The EU subagent's findings show that a new multilateral treaty now dominates the topic, but the plan never changes and the treaty gets one sentence in the report. How should the coordinator handle discoveries like this?", "options": [{"letter": "A", "text": "Add a final gap-check pass in which the synthesis agent lists topics that appear under-covered so the report is transparent about its limits.", "correct": false, "explanation": "Reporting gaps is honest and worth doing, but it documents the problem instead of fixing it. The treaty was discoverable mid-run; the system should have researched it, not just admitted afterward that it did not."}, {"letter": "B", "text": "Once all three regional subagents return, have the coordinator review the synthesis draft for gaps and run one round of follow-up subtasks for anything missing.", "correct": false, "explanation": "A single re-planning round after synthesis catches some omissions, but a discovery made early waits until the end to be acted on, and a treaty mentioned briefly in the draft may not register as a gap at all. Adaptation should follow findings as they arrive."}, {"letter": "C", "text": "After each subagent returns, have the coordinator evaluate the findings for new subtopics and spawn targeted subtasks, within a bounded iteration budget.", "correct": true, "explanation": "Dynamic decomposition lets intermediate findings reshape the plan, which is exactly what the treaty discovery required. A bounded budget keeps the loop from expanding indefinitely. This adapts to the unknown rather than trying to enumerate it in advance."}, {"letter": "D", "text": "Let the synthesis agent request additional searches directly from the search subagent when it notices a topic that lacks depth.", "correct": false, "explanation": "This reacts to gaps, but bypasses the coordinator, so scope decisions and duplication control move to an agent with no view of the overall plan. Deeper investigation is a coordinator decision; scoped fact checks are what direct access suits."}], "overall": "", "domain": "Multi-Agent Research System — Agentic Architecture"}, {"prompt": "Some responses end with <code>stop_reason</code> <code>max_tokens</code> while the model is midway through writing the <code>process_refund</code> <code>tool_use</code> input, so the JSON is incomplete. Your loop currently treats any non-<code>tool_use</code> stop reason as final and sends the partial text to the customer, who then sees a half sentence and no refund. How should the loop handle this stop reason?", "options": [{"letter": "A", "text": "Treat <code>max_tokens</code> as its own case: discard the incomplete <code>tool_use</code> and re-request with a higher <code>max_tokens</code> or a request to be concise.", "correct": true, "explanation": "<code>max_tokens</code> is a distinct signal meaning the response was cut, not finished. The loop must recognize it, refuse to act on truncated tool input, and recover by requesting again. Treating it as <code>end_turn</code> is the bug; a global setting or partial execution would only mask it."}, {"letter": "B", "text": "Resend the truncated response as the assistant turn followed by a user message saying \"continue\", so the model completes the unfinished JSON.", "correct": false, "explanation": "Continuation works for prose, but an assistant turn containing an incomplete <code>tool_use</code> block is not a valid message to send back, and the model cannot splice the rest of a JSON object onto it. Truncated tool calls must be regenerated, not resumed."}, {"letter": "C", "text": "Execute whichever <code>tool_use</code> blocks parsed successfully and drop the truncated one, then return results so the model can retry the missing call.", "correct": false, "explanation": "Executing parsed blocks looks efficient, but a truncated response is an incomplete plan: earlier blocks may depend on the missing one, and a partial refund call is exactly what you do not want to run. Nothing from a cut response should be trusted as complete."}, {"letter": "D", "text": "Retry once with double the <code>max_tokens</code>; if the retry is also truncated, fall back to presenting the text portion as the final answer.", "correct": false, "explanation": "The first step is right, but the fallback reinstates the original bug for the hardest cases, which are exactly the ones that hit the limit twice. A truncated response should never be presented as final; escalate or retry again instead."}], "overall": "", "domain": "Customer Support Resolution Agent — Agentic Architecture"}, {"prompt": "The coordinator emits three <code>Task</code> <code>tool_use</code> blocks in one response to run the search, document, and synthesis subagents in parallel. Your loop executes only the first block and sends back a single <code>tool_result</code>; the next API call fails with an error about <code>tool_use</code> ids that have no matching <code>tool_result</code>. What should change?", "options": [{"letter": "A", "text": "Execute the blocks one at a time, calling the API after each with the results gathered so far, so the model can react to early results.", "correct": false, "explanation": "Every <code>tool_use</code> in the assistant turn needs a <code>tool_result</code> in the next user message, so calling the API after only one result triggers the same error. Reacting to early results requires the model to have asked for them in separate turns."}, {"letter": "B", "text": "Instruct the coordinator to emit one <code>Task</code> call per turn so each tool result is returned before the next subagent is spawned.", "correct": false, "explanation": "Serializing the calls avoids the error but discards the parallelism that multiple <code>Task</code> calls in one response are designed to provide, roughly tripling latency. It also relies on the model following a prompt to compensate for a loop defect."}, {"letter": "C", "text": "Execute all three, then return a single <code>tool_result</code> under the first block's id whose content aggregates the three subagents' outputs.", "correct": false, "explanation": "All the work is done, but two ids still have no matching result, so the API rejects the request exactly as before. Results must be returned per id; aggregation, if wanted, can happen in the model's next turn."}, {"letter": "D", "text": "Execute every <code>tool_use</code> block in the response and return one user message containing a <code>tool_result</code> for each id.", "correct": true, "explanation": "The API requires a result for every tool call in the prior assistant turn, and multiple blocks in one response are the mechanism for parallel work. Executing all of them and returning all results in one message fixes the error and keeps the intended concurrency."}], "overall": "", "domain": "Multi-Agent Research System — Agentic Architecture"}, {"prompt": "A customer's first message reads: \"I was charged twice for order 88213. I want to speak to a person, not a bot.\" <code>lookup_order</code> confirms the duplicate charge and <code>process_refund</code> could fix it in one call. Your first-contact resolution target is 80%. What should the agent do?", "options": [{"letter": "A", "text": "Call <code>escalate_to_human</code> now, including the confirmed duplicate charge and a recommended refund so the human can resolve it immediately.", "correct": true, "explanation": "An explicit request for a human is an escalation trigger that should be honored without first attempting resolution. Doing the lookup and packaging a recommendation is fine and makes the human faster, but the decision to escalate is not the agent's to negotiate. Resolution metrics do not override a stated preference."}, {"letter": "B", "text": "Call <code>escalate_to_human</code> now with the customer's message and the reason, skipping lookups so the human owns the investigation from the start.", "correct": false, "explanation": "Honoring the request immediately is right; stripping the handoff is not. The lookup already confirmed the duplicate charge, and a human without that finding repeats it. Escalate now, but hand over what is known and a recommended action."}, {"letter": "C", "text": "Process the refund first since the case is unambiguous, then escalate with the resolution noted so the human only needs to confirm.", "correct": false, "explanation": "Acting on the account after the customer has said they want a human takes an action they did not consent to from the bot. Even a correct refund can feel like being overridden. The autonomous action should wait for the human the customer requested."}, {"letter": "D", "text": "Ask the customer why they prefer a human and what outcome they want, so the escalation can be routed to the right team with better context.", "correct": false, "explanation": "Clarifying questions are appropriate for ambiguous requests such as multiple account matches. A demand for a human is not ambiguous; interrogating it adds a turn, delays the handoff, and is the kind of exchange that makes customers repeat themselves in capitals."}], "overall": "", "domain": "Customer Support Resolution Agent — Agentic Architecture"}, {"prompt": "A customer writes: \"This is the third time I've had to explain this. Ridiculous.\" The issue is a return of an unopened item within the 30-day window, fully covered by policy and resolvable with the tools available. The customer has not asked for a human. What should the agent do?", "options": [{"letter": "A", "text": "Call <code>escalate_to_human</code> right away, since strong negative sentiment indicates a relationship at risk that a person should handle.", "correct": false, "explanation": "Sentiment is an unreliable proxy for case complexity, and escalating a routine return adds a queue wait to an already annoyed customer. It also erodes first-contact resolution for cases the agent handles well. Frustration is a reason to act quickly, not to hand off."}, {"letter": "B", "text": "Skip pleasantries and process the return immediately, since the fastest resolution is the best answer to a customer who is tired of explaining.", "correct": false, "explanation": "Speed matters, but ignoring the customer's stated frustration makes the interaction feel mechanical and is a documented driver of lower satisfaction on otherwise correct resolutions. A one-line acknowledgment costs nothing and changes how the fix lands."}, {"letter": "C", "text": "Acknowledge the frustration briefly, resolve the return now, and escalate only if the customer asks for a person.", "correct": true, "explanation": "When the issue is within capability and the customer has not requested a human, the right pattern is empathy plus resolution. Escalation stays available if they ask. This protects both the customer experience and the resolution target, unlike sentiment-triggered handoff or silent processing."}, {"letter": "D", "text": "Offer a choice up front: ask whether they would like the agent to process the return now or be connected to a human agent.", "correct": false, "explanation": "Offering a menu seems respectful but pushes a decision onto someone who wants the problem gone, and it nudges toward escalation of a case that needs none. Resolve first; the customer can still ask for a human at any point."}], "overall": "", "domain": "Customer Support Resolution Agent — Agentic Architecture"}, {"prompt": "Two reviewers can check about 500 of the 5,000 invoices extracted daily. Today a random 10% goes to review. Error analysis shows mistakes cluster in handwritten invoices, multi-currency documents, and the <code>tax_amount</code> field, while typed single-currency invoices are almost always correct. How should extractions be routed to review?", "options": [{"letter": "A", "text": "Route any extraction with a field confidence below 0.7 to review, filling the rest of the capacity with random documents.", "correct": false, "explanation": "A single uncalibrated cutoff ignores what the error analysis already found: handwriting and multi-currency layouts predict errors even when confidence is moderate. Random fill also spends capacity on documents known to be reliable."}, {"letter": "B", "text": "Route on calibrated low field confidence plus traits such as handwriting or multiple currencies, with a small stratified sample of the rest.", "correct": true, "explanation": "Confidence scores, document characteristics, and field-level ambiguity are the signals that predict errors here, so routing on them concentrates limited reviewers where mistakes live. A small stratified sample of high-confidence output keeps measuring error rates and catches new patterns. Random sampling cannot do either."}, {"letter": "C", "text": "Route only extractions whose calibrated field confidence falls below the threshold; since confidence is calibrated, sampling the rest is unnecessary.", "correct": false, "explanation": "Calibrated confidence is the strongest single signal, but calibration drifts as suppliers and layouts change, and confidence cannot flag error patterns it has never seen. Dropping the sample removes your only way to notice that."}, {"letter": "D", "text": "Route every handwritten or multi-currency invoice, then fill remaining capacity with the lowest-confidence <code>tax_amount</code> values.", "correct": false, "explanation": "Document traits and the known bad field cover the current error clusters, but the rule is frozen on today's analysis: other fields and future patterns get no attention, and there is no measurement of what is auto-accepted."}], "overall": "", "domain": "Structured Data Extraction — Agentic Architecture"}, {"prompt": "Your extraction pipeline reports 97% field accuracy overall on a labeled set. Leadership wants to stop human review for extractions where the model's field-level confidence exceeds 0.9, which would cover 80% of volume. What should you do before making that change?", "options": [{"letter": "A", "text": "Check the overall calibration of confidence on the labeled set, and if scores above 0.9 are at least 97% accurate, automate above that threshold.", "correct": false, "explanation": "Overall calibration is a necessary check but hides the same problem as overall accuracy: a well-calibrated aggregate can contain a document type where 0.9 means 85%. Calibration has to hold in each segment you intend to automate."}, {"letter": "B", "text": "Add an independent second model pass as an automated reviewer for high-confidence extractions so humans can be removed without losing a check.", "correct": false, "explanation": "A second pass can catch some errors but tends to share blind spots with the first on the same document types, and it adds cost to the very extractions you believe are fine. It also skips the question of whether the 97% hides weak segments."}, {"letter": "C", "text": "Reduce review to a 2% random sample of high-confidence output and watch the sampled error rate for a month before deciding on full automation.", "correct": false, "explanation": "Ongoing stratified sampling is the right mechanism after automation is justified, but jumping to it first means a month of unreviewed errors if a document type or field is much worse than average. Segment analysis should come before the reduction."}, {"letter": "D", "text": "Break accuracy down by document type and field on the labeled set, and check that confidence above 0.9 is accurate in each segment.", "correct": true, "explanation": "Aggregate accuracy can mask segments that perform far worse, and a threshold is only safe if confidence is calibrated within each segment. Checking by document type and field on labeled data is the prerequisite; the other options change the process before knowing whether it is safe."}], "overall": "", "domain": "Structured Data Extraction — Agentic Architecture"}, {"prompt": "Your extraction pipeline processes a high volume of documents, and human reviewers have capacity to check about 5% of them. Downstream systems act on the extracted data, and some of it drives financial or compliance decisions. Which extractions should be routed to human review?", "options": [{"letter": "A", "text": "Any document containing financial or compliance-critical fields, regardless of confidence, with remaining capacity going to the lowest-confidence rest.", "correct": false, "explanation": "Routing on field criticality feels safe but spends most of the 5% on critical documents the model extracts correctly and confidently, leaving little for the extractions actually likely to be wrong. Criticality is better handled by downstream approval controls on the action taken; review routing should follow the error signal, not the field's importance."}, {"letter": "B", "text": "A stratified random 5% across document types, so error rates are measured evenly and no category is systematically unreviewed.", "correct": false, "explanation": "Stratified sampling is the right tool for measuring error rates in high-confidence output and catching new failure patterns, and a small slice of capacity should go to it. Spending the entire budget on measurement ignores the calibrated signals that already point at which extractions are wrong."}, {"letter": "C", "text": "Low field-level confidence, ambiguous or internally contradictory sources, and fields the model marked absent, plus a small sample of the rest.", "correct": true, "explanation": "Limited reviewer capacity should follow the predictors of error: calibrated low confidence, contradictory or ambiguous sources, and fields the model could not find. That concentrates humans where they change outcomes and keeps the routine 95% flowing. A small stratified sample of confident output preserves ongoing error measurement. Value-based routing and pure sampling both ignore the error signal you already have."}, {"letter": "D", "text": "Documents whose type or source has few prior examples, since accuracy on rare and new formats is unmeasured and most likely to hide errors.", "correct": false, "explanation": "Novel formats deserve attention and confidence is often lower on them, which the confidence route already captures. Routing purely on rarity reviews many correct extractions of unusual but simple documents while a common document type with a contradictory value sails through unreviewed."}], "overall": "", "domain": "Structured Data Extraction — Agentic Architecture"}, {"prompt": "Your <code>process_refund</code> MCP tool already returns structured errors: a <code>message</code> string and a <code>reason</code> taken verbatim from the backend, such as <code>upstream unavailable</code>, <code>amount rejected</code>, or <code>not eligible</code>. Yet transcripts show the agent retrying a gift-card refusal three times, apologising to a customer for a timeout as if the refund were denied, and giving up after one failed attempt during a brief database outage. Which error shape fixes the agent's decisions?", "options": [{"letter": "A", "text": "<code>isError: true</code>, <code>errorCategory</code>, and <code>isRetryable</code>, where validation errors are marked retryable because the agent could resubmit with a corrected amount.", "correct": false, "explanation": "The shape is right but the semantics invert the flag's meaning. An amount rejected against the order total will be rejected again; marking it retryable is what produced the three-attempt loop on the gift-card refusal. <code>isRetryable</code> must describe whether the same call can succeed later, not whether a different call might."}, {"letter": "B", "text": "<code>isError: true</code>, <code>errorCategory</code>, <code>isRetryable</code>, a customer-safe explanation, and a suggested next action such as <code>escalate_to_human</code>.", "correct": true, "explanation": "Each symptom maps to a missing piece: the loop needed a truthful <code>isRetryable</code>, the wrong apology needed a category and a customer-safe explanation, and the early give-up needed to know the timeout was retryable. A suggested next action tells the agent where to go when it cannot retry. The other shapes each break one of these."}, {"letter": "C", "text": "<code>errorCategory</code>, <code>isRetryable</code>, and explanation returned as a normal result with <code>isError: false</code>, since a refused refund is a business outcome rather than a tool failure.", "correct": false, "explanation": "Treating refusals as outcomes sounds principled, but the same shape is then used for timeouts, which are failures by any definition, and everything inspecting the MCP error flag, including hooks and telemetry, stops seeing them. Business errors are still errors to the caller; the category field is where the distinction belongs."}, {"letter": "D", "text": "<code>isError: true</code>, <code>errorCategory</code>, and <code>isRetryable</code>, with the tool retrying transient faults internally for 30 seconds and returning <code>isRetryable: false</code> once exhausted.", "correct": false, "explanation": "Internal retry is worthwhile, but reporting an exhausted timeout as non-retryable tells the agent the outage is permanent, which is exactly the one-attempt give-up seen in the transcripts. The flag should reflect the error's nature so the agent can retry later or escalate with the right explanation."}], "overall": "", "domain": "Customer Support Resolution Agent — Tool Design & MCP"}, {"prompt": "The document analysis subagent sees transient timeouts from the PDF service on about 20% of calls and permission errors on 5% of restricted documents. Every error is currently propagated straight to the coordinator, which re-plans the whole task each time, roughly doubling run time. How should errors be handled?", "options": [{"letter": "A", "text": "Have the subagent retry transient failures locally with backoff, and propagate only unresolved errors with what was attempted and partial results so far.", "correct": true, "explanation": "Local recovery for transient errors keeps the coordinator out of routine noise, while permission errors, which the subagent cannot fix, arrive with enough context for the coordinator to decide. This matches recoverability to the layer that can act on it."}, {"letter": "B", "text": "Have the subagent retry transient failures locally and, on permission errors, skip the document and continue, reporting only the documents it analyzed successfully.", "correct": false, "explanation": "Local retry is right, but silently skipping restricted documents turns a failure into a success with a hole in it. The coordinator never learns that sources were unavailable and cannot seek alternatives or annotate coverage gaps."}, {"letter": "C", "text": "Have the subagent retry every error up to five times with backoff before reporting, so most failures resolve without coordinator involvement.", "correct": false, "explanation": "Retrying permission errors wastes five attempts on a document that will never open, delaying the report the coordinator needs to seek an alternative source. Retry should be driven by whether the error is retryable, not applied uniformly."}, {"letter": "D", "text": "Propagate every error to the coordinator, but as structured context with failure type, attempted document, and partial results.", "correct": false, "explanation": "Structured propagation is the right format for errors the subagent cannot fix. Sending transient timeouts through it still forces the coordinator to re-plan for failures a local retry would have absorbed; the doubling of run time remains."}], "overall": "", "domain": "Multi-Agent Research System — Tool Design & MCP"}, {"prompt": "Your <code>search_patents</code> MCP tool returns <code>{\"results\": []}</code> both when a query genuinely matches nothing and when the patent API is unreachable. The coordinator cannot tell the two apart, so it sometimes reports \"no relevant patents exist\" during outages and sometimes retries queries that correctly found nothing. How should the tool respond?", "options": [{"letter": "A", "text": "Return <code>isError: true</code> in both cases with different message text, so the coordinator treats every empty outcome as something to investigate before reporting.", "correct": false, "explanation": "Marking a valid empty result as an error misrepresents a successful query and pushes the coordinator to retry or escalate work that is finished. Free-text differences in the message are also harder for the agent to branch on than a status field."}, {"letter": "B", "text": "Return <code>results: []</code> in both cases and add a <code>source_status</code> field with <code>ok</code> or <code>unreachable</code> so the coordinator can tell them apart.", "correct": false, "explanation": "The information is present, but the failure is reported as a successful call, so nothing that inspects the MCP error flag, including hooks, retries, and telemetry, sees an outage. An access failure is an error and should be flagged as one."}, {"letter": "C", "text": "Return <code>isError: true</code> with an access-failure category when the API is unreachable, and a success with <code>results: []</code> and a zero match count otherwise.", "correct": true, "explanation": "An access failure and a valid empty result are different facts and should be reported differently. The coordinator can then retry or seek alternatives on failures and confidently record a true zero, with coverage annotations in the report, on successes."}, {"letter": "D", "text": "Return <code>isError: true</code> for both, with <code>isRetryable: true</code> when unreachable and <code>isRetryable: false</code> for zero matches.", "correct": false, "explanation": "Retryability is conveyed, but a successful query with no matches is reported as an error, so the coordinator logs a failure, may annotate the report with a false coverage gap, and cannot distinguish a real zero from a broken source in its metrics."}], "overall": "", "domain": "Multi-Agent Research System — Tool Design & MCP"}, {"prompt": "You added an MCP server exposing <code>semantic_code_search</code>, which finds code by meaning using embeddings. Its description reads \"Search the codebase\". For questions like \"where do we handle retry logic?\", the agent uses the built-in <code>Grep</code> tool with guessed keywords and misses the relevant modules. What is the most effective first fix?", "options": [{"letter": "A", "text": "Change the description to \"Search the codebase by meaning. Use for conceptual questions about behaviour or intent.\"", "correct": false, "explanation": "Better than the original, but it still does not tell the model when to prefer this over <code>Grep</code>, what a good query looks like, or what comes back. Minimal descriptions leave selection between overlapping tools to guesswork."}, {"letter": "B", "text": "Expand the description: it searches by concept, when to prefer it over <code>Grep</code>, the query format, example queries, and what results contain.", "correct": true, "explanation": "Tool descriptions are the primary input to tool selection. \"Search the codebase\" is indistinguishable from Grep to the model, so it picks the familiar tool. Explaining capability, inputs, outputs, and the boundary with Grep fixes the root cause without removing options or adding prompt rules."}, {"letter": "C", "text": "Write the full description and add \"Always use this instead of Grep for any code search\" so the model stops defaulting to the built-in tool.", "correct": false, "explanation": "The full description is right; the override is not. Exact-match searches for an error string or function name are what <code>Grep</code> is for, and a blanket instruction degrades those. Describe the boundary rather than erasing it."}, {"letter": "D", "text": "Keep the description and add few-shot examples to the system prompt showing the agent choosing <code>semantic_code_search</code> for conceptual questions.", "correct": false, "explanation": "Few-shot examples in the system prompt cost context in every session and only cover the cases shown. The model still selects tools from their descriptions, and \"Search the codebase\" gives it nothing to distinguish this tool from Grep; fix the description first."}], "overall": "", "domain": "Developer Productivity with Claude — Tool Design & MCP"}, {"prompt": "The document analysis agent has one tool, <code>analyze_document</code>, described as \"Analyze a document\". The coordinator uses it to extract figures, to summarize, and to verify quoted claims. Outputs vary unpredictably in shape, and the synthesis agent frequently receives a summary when it needed specific data points. What tool design change addresses this?", "options": [{"letter": "A", "text": "Split into <code>extract_data_points</code>, <code>summarize_content</code>, and <code>verify_claim_against_source</code>, each with its own description and output schema.", "correct": true, "explanation": "One generic tool with three purposes cannot have a stable output contract, so downstream agents get whatever the model chose to produce. Purpose-specific tools with defined schemas make the coordinator's intent explicit and the outputs predictable, which is what synthesis needs."}, {"letter": "B", "text": "Keep one tool but add a required <code>mode</code> enum (extract, summarize, verify) with a description of each mode and its expected output.", "correct": false, "explanation": "The enum makes intent explicit, which helps, but one tool still carries one description covering three purposes and one result type whose shape depends on the mode. Downstream agents must branch on which mode ran; separate tools make that contract visible."}, {"letter": "C", "text": "Have the coordinator state the desired output format in every delegation prompt so the document agent knows which kind of result to return.", "correct": false, "explanation": "Per-prompt formatting instructions are probabilistic and put the burden on every call site to restate the contract. When the coordinator forgets or phrases it differently, output drifts again. A schema on the tool enforces the shape once."}, {"letter": "D", "text": "Split into three tools with distinct names but reuse the existing description on each so the change is small and low risk.", "correct": false, "explanation": "Distinct names alone do not fix selection: with identical descriptions the model cannot tell which to call and misrouting continues. Names help, but the description is where purpose, inputs, and boundaries are communicated."}], "overall": "", "domain": "Multi-Agent Research System — Tool Design & MCP"}, {"prompt": "Your repo's <code>.mcp.json</code> defines a Jira server with <code>\"env\": {\"JIRA_TOKEN\": \"${JIRA_TOKEN}\"}</code>. It works for five developers. A sixth reports that no Jira tools appear in their session, though they added <code>JIRA_TOKEN</code> to a <code>.env</code> file in the repo. What should they do first?", "options": [{"letter": "A", "text": "Copy the server block into their <code>~/.claude.json</code> at user scope so it loads independently of the project configuration that seems to be failing.", "correct": false, "explanation": "Duplicating the server at user scope does not change the fact that the variable is not in their environment, so the copy will fail the same way. It also creates a second definition that can drift from the team's shared one."}, {"letter": "B", "text": "Move <code>JIRA_TOKEN</code> from the repo <code>.env</code> into a <code>.env</code> in their home directory, which Claude Code reads on startup.", "correct": false, "explanation": "Neither location is read for <code>${VAR}</code> expansion in <code>.mcp.json</code>; expansion uses the process environment. Moving the file changes nothing, and the server still fails to authenticate."}, {"letter": "C", "text": "Add <code>\"env\": {\"JIRA_TOKEN\": \"${JIRA_TOKEN}\"}</code> to <code>.claude/settings.json</code> so the variable is defined for every session.", "correct": false, "explanation": "Settings can inject environment variables, but this entry only references a variable that is not set, so it resolves to nothing. It also commits a per-developer credential mechanism into shared settings where it does not belong."}, {"letter": "D", "text": "Export <code>JIRA_TOKEN</code> in their shell, restart Claude Code, and confirm with <code>/mcp</code> that the server connected and its tools appear.", "correct": true, "explanation": "Variable expansion in <code>.mcp.json</code> reads the environment Claude Code was launched with, not a <code>.env</code> file in the repo. Setting the variable and verifying discovery with <code>/mcp</code> fixes the root cause and confirms it, without altering shared configuration or duplicating the server."}], "overall": "", "domain": "Code Generation with Claude Code — Tool Design & MCP"}, {"prompt": "Before answering questions about the data model, your agent makes 8 to 10 exploratory calls: <code>list_schemas</code>, then <code>list_tables</code> per schema, then <code>describe_table</code> for likely candidates. The catalog changes rarely. Engineers wait 30 to 40 seconds before any real work starts. How should the MCP server expose this information?", "options": [{"letter": "A", "text": "Add a single <code>get_full_schema</code> tool that returns every table definition in one call so exploration collapses to one round trip.", "correct": false, "explanation": "One big tool call is faster than ten but it is still a model-initiated action with a large payload landing in context every session. It also models read-only reference material as an action, which is what MCP resources are meant to avoid."}, {"letter": "B", "text": "Expose the schema catalog as MCP resources so the agent can see the tables and read definitions without exploratory tool calls.", "correct": true, "explanation": "MCP resources are designed for content catalogs: they give the agent visibility into available data up front, so it can go straight to the relevant definitions. Tools remain for actions. This removes the discovery phase rather than compressing it."}, {"letter": "C", "text": "Expose the catalog through an MCP prompt template that inlines the current schema when a developer invokes it at the start of a session.", "correct": false, "explanation": "Prompts are user-invoked templates; they deliver the schema only when someone remembers to run them, and they push the whole catalog into context whether the question needs it or not. Resources let the agent read what is relevant on demand."}, {"letter": "D", "text": "Paste the current schema into <code>CLAUDE.md</code> so it is loaded in every session and the agent has no reason to explore the database structure.", "correct": false, "explanation": "This works until the schema changes and someone forgets to update the file, and it loads the whole catalog into every session including ones unrelated to the database. Reference data that lives in a system should be served from that system."}], "overall": "", "domain": "Developer Productivity with Claude — Tool Design & MCP"}, {"prompt": "Your pipeline defines <code>extract_metadata</code> plus three enrichment tools that need the document type it returns. With <code>tool_choice</code> set to <code>auto</code>, the model sometimes calls an enrichment tool first using a guessed type, and 7% of documents are enriched with the wrong template. How should the tool workflow be sequenced?", "options": [{"letter": "A", "text": "Use <code>tool_choice: any</code> on the first request with all four tools available, then force the specific enrichment tool on the second request.", "correct": false, "explanation": "Forcing the second step does not fix the first: with <code>any</code> and all tools present, the model can still pick an enrichment tool before metadata exists. The prerequisite is what needs forcing, and the dependent step is what can be left to the model."}, {"letter": "B", "text": "Force <code>extract_metadata</code> with <code>tool_choice</code> on every request in the workflow so the type is always fresh before any tool is chosen.", "correct": false, "explanation": "Forcing the same tool on every request means enrichment never runs: the model is compelled to call <code>extract_metadata</code> again instead of an enrichment tool. Forcing belongs on the first turn only."}, {"letter": "C", "text": "Set <code>tool_choice</code> to <code>any</code> and state in the system prompt that <code>extract_metadata</code> must be called before any enrichment tool runs.", "correct": false, "explanation": "<code>any</code> guarantees some tool is called but not which one, so ordering still depends on the model following the prompt. The 7% failure rate is exactly what probabilistic ordering looks like. Use the forced form when a specific tool must run first."}, {"letter": "D", "text": "Force <code>extract_metadata</code> via <code>tool_choice: {\"type\": \"tool\", \"name\": \"extract_metadata\"}</code> first, then use <code>auto</code> in a follow-up turn.", "correct": true, "explanation": "Forced tool selection guarantees the prerequisite runs first; the follow-up turn with the metadata result in context lets the model pick the right enrichment tool. This is the documented way to sequence dependent tools deterministically without merging them or relying on prompt compliance."}], "overall": "", "domain": "Structured Data Extraction — Tool Design & MCP"}, {"prompt": "Documents arrive with unknown types, and you define <code>extract_invoice</code>, <code>extract_receipt</code>, and <code>extract_purchase_order</code>, each with a JSON schema. About 4% of the time the model replies with text such as \"This appears to be a receipt from...\" and no tool call, which crashes the downstream parser. How do you guarantee a structured result?", "options": [{"letter": "A", "text": "Force <code>extract_receipt</code> with a specific <code>tool_choice</code> since receipts are the most common type, and re-run with another tool if fields come back empty.", "correct": false, "explanation": "Forcing one tool guarantees a call but the wrong schema for a third of documents, and a retry heuristic based on empty fields is fragile. The requirement is that some extraction tool is called, with the model choosing which one; that is a different <code>tool_choice</code> setting."}, {"letter": "B", "text": "Set <code>tool_choice</code> to <code>any</code> so the model must call one of the three extraction tools and cannot answer with conversational text.", "correct": true, "explanation": "<code>any</code> guarantees a tool invocation while leaving tool selection to the model, which is exactly right when the document type is unknown and several schemas exist. Text-only responses become impossible, so the parser always receives structured input."}, {"letter": "C", "text": "Add a system prompt instruction that every response must be a tool call rather than plain text, with two examples of correct behaviour.", "correct": false, "explanation": "Instructions and examples reduce the text-only rate but leave it above zero, and the parser crashes on any exception. When a downstream system cannot tolerate text, the guarantee should come from the API parameter, not from prompt compliance."}, {"letter": "D", "text": "Add a <code>classify_document</code> tool, force it first, then force the matching extraction tool in a second request based on its output.", "correct": false, "explanation": "This guarantees structure, but adds a tool, a round trip, and classification logic in your code that the model would perform anyway when choosing among the three extractors. <code>any</code> achieves the guarantee in a single call."}], "overall": "", "domain": "Structured Data Extraction — Tool Design & MCP"}, {"prompt": "Your CI review service calls the Messages API and posts findings as inline PR comments through a parser expecting <code>file</code>, <code>line</code>, <code>severity</code>, and <code>message</code>. The prompt asks for JSON, but 5% of responses are markdown or prose, and the job fails. Reviews must never be silently skipped. What is the most reliable fix?", "options": [{"letter": "A", "text": "Parse the response with a tolerant extractor that finds JSON inside markdown fences or prose, and fall back to posting the raw text as a single comment.", "correct": false, "explanation": "Tolerant parsing recovers some cases, but posting raw prose as a comment degrades the review into an unstructured wall of text, and edge cases keep appearing. It treats output variance as inevitable when the API can eliminate it."}, {"letter": "B", "text": "Tighten the prompt with an explicit schema, an instruction to output only JSON, and a retry when parsing fails, up to three attempts.", "correct": false, "explanation": "Retries reduce the failure rate at the cost of latency and tokens, and a determined 5% becomes a smaller but nonzero number. When the consumer is a strict parser, prompt-based formatting is the least reliable of the available methods."}, {"letter": "C", "text": "Define a <code>report_findings</code> tool whose input schema is the findings array, force it with <code>tool_choice</code>, and read the <code>tool_use</code> block.", "correct": true, "explanation": "Tool use with a JSON schema is the most reliable structured output method: the response is a schema-validated <code>tool_use</code> block, so syntax errors and prose disappear. Forcing the tool removes the remaining chance of a text-only reply. Semantic checks still apply, but the parser never sees markdown again."}, {"letter": "D", "text": "Define a <code>report_findings</code> tool with the findings schema, leave <code>tool_choice</code> on <code>auto</code>, and instruct the model to always use the tool.", "correct": false, "explanation": "With <code>auto</code> the model may still answer in text, and the instruction is the same probabilistic lever that produced the 5%. Forcing the tool is what removes the text path; defining it is only half the fix."}], "overall": "", "domain": "Claude Code for Continuous Integration — Tool Design & MCP"}, {"prompt": "The team wants a <code>/release-notes</code> command that every developer gets automatically after pulling the repo. One developer also wants a <code>/standup</code> command that drafts their personal daily update, which nobody else should see or maintain. Where should the two command files live?", "options": [{"letter": "A", "text": "Both in <code>.claude/commands/</code> in the repository, so everything is version-controlled and teammates can skip the command they do not use.", "correct": false, "explanation": "Committing a personal command puts one person's workflow into the shared namespace, shows up in everyone's command list, and invites edits from teammates. Version control is the right reason to place the team command there, not the personal one."}, {"letter": "B", "text": "<code>/release-notes</code> in <code>.claude/commands/</code> in the repository and <code>/standup</code> in <code>~/.claude/commands/</code> on that developer's machine.", "correct": true, "explanation": "Project-scoped commands are shared through the repo and appear for anyone who clones or pulls; user-scoped commands in the home directory are personal and available across that user's projects. Matching scope to audience is the whole decision here."}, {"letter": "C", "text": "Both in <code>~/.claude/commands/</code>, with a small setup script in the repo that copies <code>/release-notes</code> into each developer's home directory.", "correct": false, "explanation": "A copy step reintroduces drift: the release-notes command changes and half the team has the old version. Project scope already distributes the file with the code, so the script solves a problem Claude Code has already solved."}, {"letter": "D", "text": "<code>/release-notes</code> in <code>.claude/commands/</code>; <code>/standup</code> also in <code>.claude/commands/</code> but listed in <code>.gitignore</code> so it stays local.", "correct": false, "explanation": "This works on one machine, but the personal command now depends on a gitignore rule, disappears on a fresh clone, and is unavailable in that developer's other projects. User scope exists for exactly this file."}], "overall": "", "domain": "Code Generation with Claude Code — Claude Code Config"}, {"prompt": "Your <code>/db-reset</code> skill in <code>.claude/skills/db-reset/SKILL.md</code> should only rewrite seed SQL files. Twice it has run <code>Bash</code> to drop and recreate a local database directly, once against a shared dev instance. You want the skill to be able to read and write files but never run shell commands, without restricting Bash elsewhere. What should you change?", "options": [{"letter": "A", "text": "Set <code>allowed-tools: Bash(psql:*)</code> in the SKILL.md frontmatter so the skill can only run SQL commands through the shell.", "correct": false, "explanation": "Narrowing Bash to <code>psql</code> is enforced, but <code>psql</code> can drop and recreate a database, which is the incident you are preventing. The requirement is no shell at all for this skill; file tools are sufficient for rewriting seeds."}, {"letter": "B", "text": "Add a <code>permissions.deny</code> entry for <code>Bash</code> in <code>.claude/settings.json</code> so shell access is blocked project-wide.", "correct": false, "explanation": "A project-wide deny is deterministic but far too broad: it blocks running tests, git, and build commands in every other workflow. The requirement is to constrain one skill, and that constraint belongs on the skill."}, {"letter": "C", "text": "State clearly in the SKILL.md body that the skill must not execute shell commands and must only edit files under <code>db/seeds/</code>.", "correct": false, "explanation": "Instructions in the skill body are guidance the model usually follows, but the incidents show it did not. A shared database was touched, so this needs enforcement rather than a stronger sentence."}, {"letter": "D", "text": "Set <code>allowed-tools: Read, Write, Edit</code> in the SKILL.md frontmatter so <code>Bash</code> is unavailable while the skill runs.", "correct": true, "explanation": "The <code>allowed-tools</code> frontmatter restricts which tools are available during that skill's execution and nothing else, which is exactly the scope needed. It is enforced by Claude Code rather than by model compliance, and it leaves Bash available in every other context."}], "overall": "", "domain": "Code Generation with Claude Code — Claude Code Config"}, {"prompt": "You must replace the authentication middleware across six services. You already know how you would do it, but the security team requires sign-off on the approach before any code changes, and their review takes two days. Which way of working with Claude Code fits this constraint?", "options": [{"letter": "A", "text": "Use direct execution on a feature branch and open a pull request, giving the security team working code as the artifact to review.", "correct": false, "explanation": "A PR is a fine review artifact for implementation, but the requirement is approval of the approach before implementation. If the reviewers ask for a different design, six services of work get redone. Reviewing code is not the same as reviewing the plan."}, {"letter": "B", "text": "Run an Explore subagent to map the current middleware usage, then execute directly using its summary as the design justification for reviewers.", "correct": false, "explanation": "An Explore pass is useful for discovery, but its output is a description of the current state, not a proposed approach the security team can approve. Executing immediately still puts implementation ahead of the required sign-off."}, {"letter": "C", "text": "Enter plan mode to explore the services and produce the plan, share it for security sign-off, then execute once approved.", "correct": true, "explanation": "Plan mode separates investigation and design from changes, which is what a mandatory pre-implementation review needs. The plan is the review artifact, the codebase stays untouched during the two-day wait, and execution follows the approved approach. Knowing the answer yourself does not remove the stakeholder gate."}, {"letter": "D", "text": "Enter plan mode for the design and the review, and remain in plan mode during implementation so every change is proposed before it is made.", "correct": false, "explanation": "Plan mode is read-only; staying in it means the implementation never happens. Once the approach is approved, execution needs a mode that can edit files. Plan for the gate, then execute."}], "overall": "", "domain": "Code Generation with Claude Code — Claude Code Config"}, {"prompt": "Your <code>CLAUDE.md</code> contains: \"Never force-push. Never run <code>rm -rf</code> outside <code>tmp/</code>. Always run <code>npm test</code> after editing a file. Prefer named exports over default exports.\" Last week a session force-pushed over a shared branch. Which restructuring is appropriate?", "options": [{"letter": "A", "text": "Force-push and <code>rm -rf</code> rules into <code>permissions.deny</code>, tests into a <code>PostToolUse</code> hook, export preference stays in <code>CLAUDE.md</code>.", "correct": true, "explanation": "Prohibitions with real consequences need deterministic enforcement, which permissions provide; an action that must happen after every edit is what <code>PostToolUse</code> hooks are for; a stylistic preference is guidance and belongs in <code>CLAUDE.md</code>. Each instruction moves to the mechanism that matches its required strength."}, {"letter": "B", "text": "Deny rules for force-push and <code>rm -rf</code>; a <code>PreToolUse</code> hook on <code>Edit</code> that runs <code>npm test</code>; export preference in <code>CLAUDE.md</code>.", "correct": false, "explanation": "Two of three placements are right, but a test run before the edit validates the code that is about to change, not the result. The tests need to follow the edit, which is what <code>PostToolUse</code> provides."}, {"letter": "C", "text": "Implement all four rules in a single <code>PreToolUse</code> hook script that inspects each tool call and blocks or warns depending on the rule.", "correct": false, "explanation": "A hook can block dangerous commands, but <code>PreToolUse</code> runs before an edit and cannot run tests after it, and encoding a style preference as a blocking hook is heavy-handed. Permissions express command bans more simply than custom scripts."}, {"letter": "D", "text": "Deny rules for force-push and <code>rm -rf</code>; keep the test-after-edit rule and the export preference together in <code>CLAUDE.md</code>.", "correct": false, "explanation": "The bans are now enforced, but running tests after each edit stays probabilistic, and it was listed alongside the bans because the team wants it to happen every time. An action that must always follow an event is a hook."}], "overall": "", "domain": "Code Generation with Claude Code — Claude Code Config"}, {"prompt": "Your pipeline runs <code>claude -p</code> to review pull requests. Two requirements: reviews must follow the team's severity criteria, and the CI session must never push to any remote, even if a prompt injection in a PR asks it to. Where should each requirement be implemented?", "options": [{"letter": "A", "text": "Put both the severity criteria and the no-push rule in the project <code>CLAUDE.md</code> so the CI job has consistent context every run.", "correct": false, "explanation": "The severity criteria belong there, but a no-push rule in <code>CLAUDE.md</code> is guidance that a hostile PR can argue against. A rule meant to hold under prompt injection cannot live in the same channel the injection uses."}, {"letter": "B", "text": "Severity criteria in <code>CLAUDE.md</code>; a <code>permissions.deny</code> rule for <code>Bash(git push:*)</code> in the settings the CI job uses.", "correct": true, "explanation": "Review criteria are guidance and are exactly what <code>CLAUDE.md</code> provides to a CI-invoked session. A prohibition that must survive adversarial input needs enforcement outside the model, which a deny rule gives. The split follows what each mechanism can guarantee."}, {"letter": "C", "text": "Severity criteria in <code>CLAUDE.md</code>; run the job with <code>--allowedTools \"Bash(git:*)\"</code> so only git commands are permitted.", "correct": false, "explanation": "Allowing all git commands allows <code>git push</code>, so the only thing preventing an injected push is the model's judgment. An allowlist needs to exclude the dangerous command, or a deny rule needs to name it."}, {"letter": "D", "text": "Pass <code>--allowedTools \"Bash(git:*)\"</code> and restate both requirements in the CI prompt each run so nothing depends on repository files.", "correct": false, "explanation": "Allowing all git commands includes push, so the prompt is the only thing standing in the way of an injected instruction. Restating criteria per run also duplicates what <code>CLAUDE.md</code> already delivers to every session."}], "overall": "", "domain": "Claude Code for Continuous Integration — Claude Code Config"}, {"prompt": "Terraform files live in <code>infra/*/terraform/</code>, <code>modules/**/</code>, and a few service directories. The team's Terraform conventions must apply whenever any <code>.tf</code> file is edited and nowhere else. They currently sit in the 1,100-line root <code>CLAUDE.md</code>, and developers report the guidance is often ignored. Which mechanism fits?", "options": [{"letter": "A", "text": "Move the conventions into <code>CLAUDE.md</code> files inside <code>infra/</code> and <code>modules/</code>, so they load automatically when working in those directories.", "correct": false, "explanation": "Directory-level files help when conventions map to one subtree, but <code>.tf</code> files are spread across several locations including service directories. You would need a copy in each, and any new location is missed. The convention is about file type, not directory."}, {"letter": "B", "text": "Create a <code>/terraform</code> skill containing the conventions that developers invoke before editing infrastructure code.", "correct": false, "explanation": "Skills are for on-demand workflows. Conventions that must apply whenever a file type is touched should load automatically; relying on developers to remember an invocation reintroduces the same inconsistency you are trying to remove."}, {"letter": "C", "text": "Create <code>.claude/rules/terraform.md</code> with frontmatter <code>paths: [\"**/*.tf\"]</code> so the conventions load only for Terraform edits.", "correct": true, "explanation": "Path-scoped rules load conditionally by glob regardless of directory, which matches conventions tied to a file type spread across the tree. It also removes them from the oversized root file, reducing irrelevant context for everyone else. Automatic, targeted, and maintained in one place."}, {"letter": "D", "text": "Move the conventions into <code>.claude/rules/terraform.md</code> without a <code>paths</code> field, so they are out of the root file but still always available.", "correct": false, "explanation": "Splitting the file helps maintainers, but without <code>paths</code> the rule loads in every session, so the context cost and the dilution that led to it being ignored are unchanged. The glob is what makes the rule conditional."}], "overall": "", "domain": "Code Generation with Claude Code — Claude Code Config"}, {"prompt": "About once a week someone needs to turn a design discussion into an Architecture Decision Record with the team's fixed structure, a numbering scheme, and a link check. Today each person pastes the template and instructions into the chat. Which configuration mechanism should hold this workflow?", "options": [{"letter": "A", "text": "A skill at <code>.claude/skills/adr/SKILL.md</code> with the template and steps, invoked as <code>/adr</code> on demand.", "correct": true, "explanation": "A multi-step, task-specific workflow used on demand is what skills are for: shared through the repo, invoked when needed, and out of context the rest of the time. <code>CLAUDE.md</code> would load it into every session; rules and hooks trigger on file edits, not on a request."}, {"letter": "B", "text": "A section in the project <code>CLAUDE.md</code> describing the ADR format so Claude applies it whenever a design decision comes up in conversation.", "correct": false, "explanation": "Always-loaded context suits universal standards. A weekly workflow with a long template is not universal; it consumes context in every session and still depends on Claude recognizing when a discussion counts as a decision."}, {"letter": "C", "text": "A <code>.claude/rules/adr.md</code> file with <code>paths: [\"docs/adr/**\"]</code> so the structure loads whenever an ADR file is edited.", "correct": false, "explanation": "Path rules load when matching files are edited, which covers touching an existing record but not the starting point: someone asks for a new record from a discussion before any file exists. The trigger is a request, not a path."}, {"letter": "D", "text": "A <code>PostToolUse</code> hook on <code>Write</code> under <code>docs/adr/</code> that validates numbering and links after Claude creates the file.", "correct": false, "explanation": "A hook is a good later addition for enforcing numbering and link checks deterministically, but it cannot drive the drafting workflow itself. On its own it validates output from a process that still has to be described somewhere."}], "overall": "", "domain": "Code Generation with Claude Code — Claude Code Config"}, {"prompt": "<code>CLAUDE.md</code> says to run Prettier after editing any file. Roughly 30% of Claude's commits still contain unformatted code, and CI rejects them. You want formatting to happen after every edit without depending on the model remembering. How should this be configured?", "options": [{"letter": "A", "text": "A <code>PreToolUse</code> hook matching <code>Edit</code> and <code>Write</code> that runs Prettier on the target file before the change is applied.", "correct": false, "explanation": "Running before the edit formats the old contents; the new text Claude writes arrives afterward and is unformatted again. The hook runs deterministically but at the wrong moment for this goal."}, {"letter": "B", "text": "Add a git pre-commit hook that runs Prettier so any unformatted files are fixed at commit time regardless of how they were edited.", "correct": false, "explanation": "A pre-commit hook is a sensible backstop for the repository as a whole, but it fires only when a commit happens, so Claude reads and reasons about unformatted files during the session and commits made outside git hooks are not covered. It is complementary, not the fix for after-every-edit."}, {"letter": "C", "text": "A <code>PostToolUse</code> hook matching <code>Bash</code> that runs Prettier across the repository after every command, catching whatever was edited.", "correct": false, "explanation": "It runs deterministically, but on the wrong trigger: edits made with <code>Edit</code> or <code>Write</code> do not fire it until some later shell command, and formatting the whole repository each time is slow. Match the hook to the tools that change files."}, {"letter": "D", "text": "A <code>PostToolUse</code> hook matching <code>Edit</code> and <code>Write</code> that runs Prettier on the file that was just changed.", "correct": true, "explanation": "The hook fires deterministically after each file-changing tool call, so the new contents are formatted immediately and only the touched file is processed. This matches the trigger to the event and removes dependence on the model remembering the CLAUDE.md instruction."}], "overall": "", "domain": "Code Generation with Claude Code — Claude Code Config"}, {"prompt": "When Claude Code edits a source file, you want the matching unit tests to run immediately and, if they fail, the failure output to be shown to Claude so it fixes the regression in the same turn. Which hook configuration achieves this?", "options": [{"letter": "A", "text": "A <code>Stop</code> hook that runs the full test suite when Claude finishes respon
