ding and blocks completion until everything passes.", "correct": false, "explanation": "A Stop hook does provide feedback, but only once per response, after possibly many edits, and running the whole suite each time is slow. The requirement is per-edit feedback that lets Claude fix the specific regression it just introduced."}, {"letter": "B", "text": "A <code>PostToolUse</code> hook on <code>Edit|Write</code> that runs the related tests and, on failure, exits with code 0 and prints the failure output to stdout.", "correct": false, "explanation": "Exit code 0 tells Claude Code the hook succeeded; stdout from a PostToolUse hook is shown in the transcript but not treated as feedback the model must act on. The tests run, but the failing output does not reach Claude as a signal to fix anything."}, {"letter": "C", "text": "A <code>PostToolUse</code> hook on <code>Edit|Write</code> that runs the related tests and, on failure, exits with code 1 and writes the failures to stderr.", "correct": false, "explanation": "Exit code 1 is a non-blocking error: Claude Code shows the stderr to the user and continues, but does not feed it back to the model. The tests ran and failed, and Claude carries on unaware."}, {"letter": "D", "text": "A <code>PostToolUse</code> hook on <code>Edit|Write</code> that runs related tests and, on failure, exits with code 2 and writes failures to stderr.", "correct": true, "explanation": "For a <code>PostToolUse</code> hook, exit code 2 signals a blocking result and its stderr is fed back to Claude, so the model sees the failing tests right after the edit and can correct them in the same turn. This is deterministic and per-edit, unlike the alternatives."}], "overall": "", "domain": "Claude Code for Continuous Integration — Claude Code Config"}, {"prompt": "Refunds over $500 must be approved by a human. The <code>process_refund</code> MCP server is vendor-hosted and cannot be modified. Your system prompt states the rule, yet 2% of refunds above the limit went through last quarter. How should the rule be enforced in the Agent SDK?", "options": [{"letter": "A", "text": "A <code>PreToolUse</code> hook on <code>process_refund</code> that denies calls with <code>amount</code> over 500 and returns a message pointing to <code>escalate_to_human</code>.", "correct": true, "explanation": "A hook intercepts the outgoing tool call in code, so the limit holds regardless of what the model decided, and the returned message redirects it to the escalation workflow. Since the tool itself cannot be changed, interception is the only place a deterministic guarantee can live."}, {"letter": "B", "text": "A <code>PreToolUse</code> hook on <code>process_refund</code> that caps <code>amount</code> at 500 by rewriting the input, so the call proceeds within policy.", "correct": false, "explanation": "Rewriting the input keeps the call inside the limit, but silently refunds a different amount than the agent decided and the customer expects, and no human ever sees the case. The rule was approval, not truncation."}, {"letter": "C", "text": "Ask the vendor to add server-side validation that rejects refunds over $500 with a business error, and keep the prompt rule in place in the meantime.", "correct": false, "explanation": "Server-side enforcement would be ideal defence in depth, but the scenario states the server cannot be modified, and a vendor request has no delivery date. The rule needs to hold now, from your side of the integration."}, {"letter": "D", "text": "A <code>PreToolUse</code> hook on <code>process_refund</code> that records over-limit calls to an audit log and allows them, with a nightly report to finance.", "correct": false, "explanation": "Auditing is deterministic, but the refund has already been paid by the time finance reads the report. The policy requires approval before the action, so the hook must block rather than record."}], "overall": "", "domain": "Customer Support Resolution Agent — Claude Code Config"}, {"prompt": "<code>lookup_order</code> is a third-party MCP tool whose results include full payment card numbers. Compliance requires that the model never receives a full card number. The system prompt already says not to repeat card details, but the numbers still appear in the model's context and in your logs. What should you implement?", "options": [{"letter": "A", "text": "A filter on the agent's final reply that masks any card-number pattern before the message is sent to the customer.", "correct": false, "explanation": "Output filtering protects the customer-facing message but the requirement is about what the model receives. The number is still in context, in the transcript, and in your logs, so the compliance obligation is not met."}, {"letter": "B", "text": "A <code>PostToolUse</code> hook on <code>lookup_order</code> that masks card numbers in the tool result before it is returned to the model.", "correct": true, "explanation": "The hook intercepts the tool result after the call and before the model processes it, which is the only point where you can guarantee the model never sees the raw number from a tool you do not control. It is deterministic and independent of prompt compliance."}, {"letter": "C", "text": "Strengthen the system prompt to instruct the model to disregard card numbers in tool output and not include them in reasoning or replies.", "correct": false, "explanation": "The model cannot un-see data in its context, and an instruction does not remove the number from the transcript or logs. Compliance rules about data exposure need enforcement in the data path, not in guidance."}, {"letter": "D", "text": "A <code>PostToolUse</code> hook on <code>lookup_order</code> that deletes the card field from the session transcript and logs after the model's turn completes.", "correct": false, "explanation": "Scrubbing the transcript afterward limits retention, but the model has already received the number and may have reasoned with or repeated it. The requirement is that the model never receives it, which means altering the result before it is returned."}], "overall": "", "domain": "Customer Support Resolution Agent — Claude Code Config"}, {"prompt": "The team needs a Postgres MCP server available to all eight developers, each with their own <code>DATABASE_URL</code>. One developer is also trialling a Figma MCP server that nobody else has asked for. How should the two servers be configured?", "options": [{"letter": "A", "text": "Both servers in the project <code>.mcp.json</code>, with the Figma entry documented as experimental so teammates know to disregard its connection errors.", "correct": false, "explanation": "A committed server loads for everyone; teammates without Figma credentials see connection failures in every session and the tool list gains entries nobody else uses. Experimental servers belong in the scope of the person experimenting."}, {"letter": "B", "text": "Both servers in each developer's <code>~/.claude.json</code>, with the Postgres block shared through the team wiki for people to copy.", "correct": false, "explanation": "User scope keeps Figma private, but distributing the shared Postgres configuration by copy-paste guarantees drift and skips version control. Project scope exists precisely so shared tooling ships with the repository."}, {"letter": "C", "text": "Postgres in the project <code>.mcp.json</code> using <code>${DATABASE_URL}</code>, and Figma in that developer's user-scoped <code>~/.claude.json</code>.", "correct": true, "explanation": "Shared team tooling goes in project scope, committed, with variable expansion so each developer's credentials stay out of the repo. Personal or experimental servers go in user scope where they affect only that person. Both remain available simultaneously in that developer's sessions."}, {"letter": "D", "text": "Postgres in <code>.mcp.json</code> with each developer's connection string committed under their username, and Figma in <code>.claude/settings.local.json</code>.", "correct": false, "explanation": "Committing per-user connection strings puts credentials in the repository, which variable expansion is designed to prevent. Local settings files hold permissions and preferences, not MCP server definitions, so the Figma entry would not load."}], "overall": "", "domain": "Developer Productivity with Claude — Claude Code Config"}, {"prompt": "You have three pieces of context for Claude Code: a high-level architecture overview every task needs; a 40-page design document relevant only to this quarter's billing refactor; and a one-off bug report you are about to fix. How should each be provided?", "options": [{"letter": "A", "text": "Architecture overview in <code>CLAUDE.md</code>; design document via <code>@docs/billing-refactor.md</code> in refactor prompts; bug report inline.", "correct": true, "explanation": "Universal, cross-session context belongs in <code>CLAUDE.md</code>. A large document needed only for some tasks is best pulled in on demand with an <code>@</code> reference so it does not load everywhere. A one-off detail is simplest stated inline. Each choice matches reusability and specificity."}, {"letter": "B", "text": "All three in <code>CLAUDE.md</code>, with the design document imported via <code>@docs/billing-refactor.md</code> and the bug report under a Current Work heading at the top.", "correct": false, "explanation": "Importing the 40-page document into <code>CLAUDE.md</code> loads it into every session for every developer, including unrelated work. A one-off bug report in a shared file also goes stale immediately and needs removing later."}, {"letter": "C", "text": "Reference all three with <code>@</code> paths in each prompt so nothing is loaded unless the developer explicitly asks for it that session.", "correct": false, "explanation": "The architecture overview is needed every time; making developers remember to reference it produces sessions that lack basic context. <code>@</code> references suit task-specific material, not the baseline everyone needs."}, {"letter": "D", "text": "Architecture overview in <code>CLAUDE.md</code>; design document in <code>.claude/rules/billing.md</code> with <code>paths: [\"src/billing/**\"]</code>; bug report inline.", "correct": false, "explanation": "Path rules are for conventions that should apply whenever matching files are edited. A 40-page design document would load on every billing edit for every developer, long after the refactor ends. Task-specific material is better pulled in on demand."}], "overall": "", "domain": "Code Generation with Claude Code — Claude Code Config"}, {"prompt": "Extracted invoice records are inserted directly into a database whose loader rejects any payload that is not exactly the expected JSON shape. Your prompt says \"respond only with JSON matching this schema\", and 4% of responses fail to load: trailing commentary, a missing field, or a string where a number was expected. Which structured output method fits this requirement?", "options": [{"letter": "A", "text": "Prefill the assistant turn with <code>{</code> so the model starts inside the JSON object and skips any commentary before it.", "correct": false, "explanation": "Prefilling reliably removes preambles, and for loosely consumed output that is often enough. It does nothing about missing fields or a string in a numeric slot, and it does not validate structure, so the loader's strict contract is still at risk."}, {"letter": "B", "text": "Add three few-shot examples of correct records to the prompt so the model sees exactly what valid output looks like.", "correct": false, "explanation": "Examples improve consistency and are valuable for ambiguous fields, but they make compliance more likely rather than certain. A downstream system that rejects any deviation needs a guarantee, which examples cannot provide."}, {"letter": "C", "text": "Define an <code>insert_invoice</code> tool whose input schema is the record, force it with <code>tool_choice</code>, and read the <code>tool_use</code> block.", "correct": true, "explanation": "Tool use with a JSON schema is the strictest method available: the output is a schema-validated <code>tool_use</code> block, so syntax errors, extra text, and type mismatches are eliminated. When the consumer cannot tolerate deviation, this is the appropriate choice over prompt formatting or prefill."}, {"letter": "D", "text": "Define an <code>insert_invoice</code> tool with the record schema, keep <code>tool_choice</code> on <code>auto</code>, and instruct the model to use it for every document.", "correct": false, "explanation": "The schema is right; leaving <code>tool_choice</code> on <code>auto</code> is not. The model may still reply with text for an unusual document, and the loader rejects it. Forcing the tool closes that path; the instruction alone does not."}], "overall": "", "domain": "Structured Data Extraction — Prompt & Structured Output"}, {"prompt": "Your CI service calls the Messages API to write a markdown PR summary that is posted verbatim for humans to read. No system parses it. About 10% of summaries begin with \"Here is a summary of the changes:\" before the first heading, which reviewers find noisy. What is the most proportionate fix?", "options": [{"letter": "A", "text": "Prefill the assistant turn with <code>## Summary</code> so the response begins at the first heading and the preamble has nowhere to go.", "correct": true, "explanation": "Prefilling directly controls how free-form output begins, which is exactly the problem, and it costs nothing in tooling. Schema enforcement is unnecessary because nothing parses the text, and prompt instructions alone are what produced the 10% rate."}, {"letter": "B", "text": "Define a <code>post_summary</code> tool with a <code>markdown</code> string field and force it with <code>tool_choice</code> so the output is structured.", "correct": false, "explanation": "Tool use guarantees a schema, but the schema here is a single free-text field, so you gain plumbing without gaining anything the requirement needs. Strictness should match the consumer, and this consumer is a human reading markdown."}, {"letter": "C", "text": "Add a system prompt line stating the response must start directly with a markdown heading and contain no introductory sentence.", "correct": false, "explanation": "This is reasonable and may reduce the rate, but instructions about the first line are precisely the kind of formatting guidance the model sometimes overrides. When a lighter mechanism exists that controls the opening deterministically, use it."}, {"letter": "D", "text": "Include a few-shot example of a summary that begins directly with a heading so the model imitates the format.", "correct": false, "explanation": "An example improves consistency and may reduce the rate further, but it remains a probabilistic nudge about the first line. Prefilling controls the first line directly and costs less context."}], "overall": "", "domain": "Claude Code for Continuous Integration — Prompt & Structured Output"}, {"prompt": "You moved invoice extraction to tool use with a strict JSON schema, and syntax failures dropped to zero. Downstream, 3% of records still fail: line items that do not sum to <code>total</code>, and a shipping date placed in <code>invoice_date</code>. A teammate proposes switching to prefilled JSON with regex validation. What should you do?", "options": [{"letter": "A", "text": "Switch to prefilled JSON output with regex checks per field, since the schema approach evidently is not catching these errors and regex can encode the rules.", "correct": false, "explanation": "The remaining errors are semantic, and no output method catches them: prefill plus regex validates shape and format, not whether numbers add up or a date is the right date. Switching would bring back the syntax failures you just eliminated."}, {"letter": "B", "text": "Add <code>calculated_total</code> to the schema so the model sums the line items itself, and reject any record where it differs from <code>total</code>.", "correct": false, "explanation": "Having the model compute a check value is a good self-correction pattern and worth adding. Rejecting the record ends the story too early: the mismatch should be fed back so the model can correct the extraction, and misplaced dates are not covered."}, {"letter": "C", "text": "Add an instruction to the prompt asking the model to double-check totals and date fields before finalizing the extraction.", "correct": false, "explanation": "Self-checking instructions have some effect but are probabilistic and give you no signal when they fail. Semantic validation in code, with the error fed back, is both more reliable and observable."}, {"letter": "D", "text": "Keep tool use, add code validation for sums and date roles, and on failure re-request with the document, failed extraction, and the error.", "correct": true, "explanation": "Strict schemas eliminate syntax errors but not semantic ones, so the fix is a validation layer for the semantics plus retry-with-error-feedback so the model can correct itself. Adding a <code>calculated_total</code> field alongside <code>stated_total</code> can also surface discrepancies. This builds on the working method instead of abandoning it."}], "overall": "", "domain": "Structured Data Extraction — Prompt & Structured Output"}, {"prompt": "Three outputs need structured handling: (1) extracted records loaded by a strict validator; (2) a legacy pipeline that expects raw JSON text on stdout and cannot handle <code>tool_use</code> responses; (3) an internal reviewer note that a person reads. Which pairing of method to output is most appropriate?", "options": [{"letter": "A", "text": "(1) prompt-based JSON with validation and retry, (2) tool use with a JSON schema, (3) prefill a markdown heading.", "correct": false, "explanation": "This inverts the first two. The strict validator is the case that most needs schema-guaranteed output, and the legacy pipeline explicitly cannot consume a <code>tool_use</code> response, so tool use there breaks integration regardless of how compliant the JSON is."}, {"letter": "B", "text": "(1) tool use with a JSON schema, (2) prefill <code>{</code> with validation, (3) prompt-based formatting.", "correct": true, "explanation": "Strictness should match the consumer. The validator gets the guaranteed method; the legacy pipeline cannot accept tool use, so prefilled JSON with validation is the strongest option it can consume; a human-read note needs only prompt guidance. Each method is the most reliable one the consumer can accept."}, {"letter": "C", "text": "(1) tool use with a JSON schema, (2) tool use with a JSON schema, (3) tool use with a JSON schema.", "correct": false, "explanation": "Uniform tool use is the most reliable method in isolation, but the legacy pipeline cannot consume it, so output (2) would require an adapter you were told does not exist. For the human note it adds structure nobody reads. Consistency is not the goal; fit is."}, {"letter": "D", "text": "(1) prefill <code>{</code> with validation, (2) prefill <code>{</code> with validation, (3) prefill a markdown heading.", "correct": false, "explanation": "Prefill controls how output begins and is a good fit for the legacy pipeline and arguably the note, but it does not validate structure. The strict validator will still reject shape and type errors that tool use would have prevented."}], "overall": "", "domain": "Structured Data Extraction — Prompt & Structured Output"}, {"prompt": "Reviewing generated code for a paginated list endpoint, you find six problems: a typo in a log message, an inconsistent variable name, a missing null check, an incorrect log level, plus two that interact: the cursor encoding breaks when the sort order changes, and the sort order defaults differently in two code paths. How should you feed this back?", "options": [{"letter": "A", "text": "Fix them one at a time in six separate turns, starting with the cursor bug, so each change can be tested before the next.", "correct": false, "explanation": "Sequential iteration is right for independent problems, but separating the cursor and sort-order issues risks a cursor fix that assumes a default the next turn changes. The two interacting issues need to be described together."}, {"letter": "B", "text": "Send all six in one message ordered by severity so Claude can plan a single coherent set of edits and you review once.", "correct": false, "explanation": "One large message is efficient but blends a subtle design interaction with four unrelated nits, making it harder to verify that the cursor and sort fix is right. Batching is for issues that must be considered together, not for everything at once."}, {"letter": "C", "text": "Send the cursor and sort-order issues together in one message explaining the interaction, then the four independent issues in follow-ups.", "correct": true, "explanation": "Interacting problems need to be evaluated together so the fix is consistent across both; fixing one alone can be undone by the other. Independent nits are cheap to handle sequentially and keep each change verifiable. Matching the batching to whether issues interact is the point."}, {"letter": "D", "text": "Ask Claude to review the endpoint itself and list any problems it finds, then confirm which of its findings match yours before it edits.", "correct": false, "explanation": "A self-review can surface issues but the model retains its generation context and is less likely to question its own decisions, and you already have the findings. This delays the fixes and gives less targeted feedback than the specifics you hold."}], "overall": "", "domain": "Code Generation with Claude Code — Prompt & Structured Output"}, {"prompt": "You ask Claude Code to add a caching layer to a service in a domain new to you. The first implementation is clean but has no invalidation story and ignores what happens when the cache is unavailable, things you did not think to specify because you did not know to. What refinement technique addresses this gap before the next attempt?", "options": [{"letter": "A", "text": "Write a test suite covering invalidation and cache-unavailable behaviour first, then have Claude iterate until the tests pass.", "correct": false, "explanation": "Test-driven iteration is powerful once you know what to test. Here the gap is that you did not know invalidation and failure modes mattered, so the tests you write will miss the next unknown just as the prompt did."}, {"letter": "B", "text": "Ask Claude to interview you about requirements, edge cases, and failure modes before implementing, then answer its questions.", "correct": true, "explanation": "The interview pattern is designed for unfamiliar domains: the model surfaces considerations you have not anticipated, such as invalidation strategy and degraded-mode behaviour, before code is written. The other techniques assume you already know what to specify."}, {"letter": "C", "text": "Provide two or three concrete input and output examples of cache reads and writes so the expected behaviour is unambiguous.", "correct": false, "explanation": "Examples are the best fix when prose is interpreted inconsistently, but the problem here is missing requirements, not misread ones. Examples of reads and writes would not reveal that invalidation was never discussed."}, {"letter": "D", "text": "Send the two identified gaps as a single detailed message so Claude adds invalidation and fallback handling in one revision.", "correct": false, "explanation": "This fixes the two issues you happened to notice, but in an unfamiliar domain there are likely others you have not. Targeted feedback closes known gaps; it does not discover unknown ones."}], "overall": "", "domain": "Code Generation with Claude Code — Prompt & Structured Output"}, {"prompt": "Claude Code generates tests for a date-parsing utility in CI. The tests pass but miss null input, February 29 in non-leap years, and timezone offsets like <code>+05:45</code>, all of which have caused production bugs. The prompt says \"cover edge cases thoroughly\". What is the most effective refinement?", "options": [{"letter": "A", "text": "Add a <code>CLAUDE.md</code> rule stating that generated tests must consider null inputs, calendar boundaries, and timezone handling in every module.", "correct": false, "explanation": "A general rule broadens attention but stays abstract; the model must still translate it into the specific cases that bit you. It is useful project context and not wrong, but less direct than showing the exact failures."}, {"letter": "B", "text": "Replace \"cover edge cases thoroughly\" with \"be exhaustive and think carefully about every possible malformed input before writing tests\".", "correct": false, "explanation": "Rephrasing a vague instruction into a more emphatic vague instruction rarely changes outcomes. The model already believes it covered edge cases; it needs to see which ones it missed."}, {"letter": "C", "text": "Reply in the current CI conversation with the three missed cases as concrete input and expected output, and ask for tests covering them.", "correct": false, "explanation": "Concrete cases are the right feedback, but a reply in one CI conversation is lost when the next run starts from a fresh prompt. The same examples belong in the CI prompt itself so every future generation benefits."}, {"letter": "D", "text": "Add the three missed cases as concrete input and expected-output examples to the CI prompt, and re-run to confirm they are covered.", "correct": true, "explanation": "Targeted feedback on specific failures, expressed as concrete input and expected output, is the most effective refinement and communicates far more than an abstract instruction. Putting the examples into the CI prompt makes the improvement persistent. Rewording the vague instruction or adding a general rule leaves the model guessing."}], "overall": "", "domain": "Claude Code for Continuous Integration — Prompt & Structured Output"}, {"prompt": "Your invoice schema marks <code>due_date</code> as a required string. Roughly 12% of supplier invoices state no due date. In those cases the model returns a plausible date, often 30 days after the invoice date, and the finance team has paid several invoices on fabricated deadlines. What schema change addresses this?", "options": [{"letter": "A", "text": "Make <code>due_date</code> nullable and instruct the model to return <code>null</code> when the document does not state one.", "correct": true, "explanation": "A required field forces the model to produce something even when the source has nothing, and fabrication is the predictable result. Allowing <code>null</code> lets it represent absence honestly. Prompt warnings and post-checks work against the schema's pressure instead of removing it."}, {"letter": "B", "text": "Keep the field required but add a prompt instruction not to infer or calculate a due date that is not explicitly written in the document.", "correct": false, "explanation": "The instruction and the schema now conflict: the model must emit a string yet must not invent one. Under that pressure it will usually still produce a date. Removing the requirement is what lets the instruction be followed."}, {"letter": "C", "text": "Make <code>due_date</code> optional so it can be omitted, and add a post-check flagging any due date exactly 30 days after the invoice date.", "correct": false, "explanation": "Optional is close to right, but omission and <code>null</code> mean different things downstream: a missing key can be read as \"not extracted\" rather than \"not stated\". The 30-day check then catches one fabrication pattern and flags legitimate net-30 invoices."}, {"letter": "D", "text": "Add a <code>due_date_confidence</code> number so downstream can skip due dates the model reports with low confidence.", "correct": false, "explanation": "Confidence helps prioritize review but still yields a fabricated date with some score attached, and calibration of that score is unproven. The cleaner representation of missing information is <code>null</code>, not a low-confidence guess."}], "overall": "", "domain": "Structured Data Extraction — Prompt & Structured Output"}, {"prompt": "Your schema has <code>document_type</code> as an enum of five values. New document kinds appear monthly, and ambiguous scans are common. The model forces every document into one of the five, so credit notes are labelled <code>invoice</code> and unreadable scans get a confident type. How should the enum be designed?", "options": [{"letter": "A", "text": "Replace the enum with a free-text <code>document_type</code> string so the model can name any type it encounters.", "correct": false, "explanation": "Free text removes the forced choice but also removes consistency: you get <code>credit note</code>, <code>Credit Note</code>, and <code>CN</code> for the same thing, and downstream routing on type becomes unreliable. Enums exist to prevent that."}, {"letter": "B", "text": "Expand the enum each month as new types are discovered and re-deploy the schema so coverage keeps up with the documents.", "correct": false, "explanation": "Chasing new types keeps the enum accurate in hindsight, but every month's new kind is mislabelled until the update ships, and ambiguous scans still get forced into a confident value. The schema should handle the unknown by design."}, {"letter": "C", "text": "Add <code>other</code> and <code>unclear</code> values to the enum, plus a <code>document_type_detail</code> string the model fills in when it chooses <code>other</code>.", "correct": true, "explanation": "An <code>other</code> value with a detail string keeps the category set stable and routable while still capturing new kinds accurately; <code>unclear</code> lets the model represent genuine ambiguity instead of guessing. This is the extensible-enum pattern for exactly this situation."}, {"letter": "D", "text": "Add a <code>type_confidence</code> score alongside the enum and route documents below a threshold to a human for classification.", "correct": false, "explanation": "Confidence is useful for review routing, but it does not give the model a correct value to emit for a credit note, so the record still carries a wrong type until a human intervenes. Fixing the representation comes first."}], "overall": "", "domain": "Structured Data Extraction — Prompt & Structured Output"}, {"prompt": "Amounts appear in source documents as <code>1.234,56 €</code>, <code>$1,234.56</code>, <code>1234.56 USD</code>, and <code>USD 1 234,56</code>. Your tool schema has <code>amount</code> as a number and <code>currency</code> as an ISO enum, yet 6% of records have amounts off by a factor of 1,000 or the wrong currency. What should you add?", "options": [{"letter": "A", "text": "Change <code>amount</code> to a string, capture the raw text, and normalize it in application code with locale-aware parsing and a currency lookup table.", "correct": false, "explanation": "This moves the ambiguity to code that lacks the document's context: <code>1.234</code> is a thousand in one locale and a decimal in another, and code cannot tell which from the string alone. The model can, if told how to normalize."}, {"letter": "B", "text": "Add normalization rules to the prompt: how to read thousands and decimal separators from locale cues, and how to map symbols to ISO currencies.", "correct": true, "explanation": "Strict schemas define the target shape but not how to get there from inconsistent sources. Format normalization instructions alongside the schema give the model the rules it needs to convert correctly, using document context that code downstream would not have. Examples or rejection alone leave the rules implicit."}, {"letter": "C", "text": "Add few-shot examples showing one correctly normalized record for each of the four formats observed so far.", "correct": false, "explanation": "Examples help and pair well with rules, but on their own they cover only the observed formats and leave the model to infer the underlying rule. New variants such as Swiss apostrophe separators would still be guessed at."}, {"letter": "D", "text": "Reject any record whose raw amount text fails a strict regex and route it to human review rather than risk a wrong number.", "correct": false, "explanation": "Rejection protects the database but sends 6% or more of otherwise straightforward documents to reviewers, and the regex has to encode every locale convention anyway. Teaching the model the conversion is cheaper than refusing to do it."}], "overall": "", "domain": "Structured Data Extraction — Prompt & Structured Output"}, {"prompt": "Extracting from research papers, the <code>methodology</code> field is required but comes back empty for 30% of documents. Inspection shows those papers describe their method in narrative prose across the introduction and results rather than in a labelled section, while the successful 70% have an explicit Methods heading. What is the most effective fix?", "options": [{"letter": "A", "text": "Make <code>methodology</code> non-nullable with a minimum length so the model is obliged to extract something rather than leave it empty.", "correct": false, "explanation": "Forcing a value when the model has not located the content invites fabrication, the opposite of the accuracy goal. The information is present in these papers; the model needs to know where to look, not to be compelled to fill a slot."}, {"letter": "B", "text": "Add 2 to 4 few-shot examples showing correct methodology extraction from papers that describe methods in narrative form.", "correct": true, "explanation": "The failures correlate with document structure, and few-shot examples are the most effective way to demonstrate handling of structural variety. Examples of narrative-form papers teach the model to assemble methodology from prose, addressing the actual 30% pattern rather than the field definition."}, {"letter": "C", "text": "Expand the field description to say that methodology may be described anywhere in the paper and should be summarized if no section exists.", "correct": false, "explanation": "A better description helps and is worth doing, but a sentence saying methods may appear anywhere is weaker than showing what extraction from a narrative paper looks like. Descriptions tell; examples demonstrate."}, {"letter": "D", "text": "Split long papers into sections and run extraction per section, then merge whichever section produced a methodology value.", "correct": false, "explanation": "Chunking is a context-length tactic. These papers fit in context; the problem is recognizing method descriptions scattered through prose, which chunking makes harder by separating the pieces that need to be read together."}], "overall": "", "domain": "Structured Data Extraction — Prompt & Structured Output"}, {"prompt": "Developers dismiss 35% of automated review findings. You suspect a few code patterns generate most false positives but cannot tell which, because findings contain only file, line, severity, and a free-text message. What should be added so the false-positive patterns can be found and fixed systematically?", "options": [{"letter": "A", "text": "Run each review three times and post only findings that appear in at least two runs, filtering out unstable ones before developers see them.", "correct": false, "explanation": "Consensus filtering reduces noise but also drops real issues caught intermittently, and it still gives you no data about what the dismissed findings had in common. It hides variance instead of learning from it."}, {"letter": "B", "text": "Require developers to enter a free-text reason when dismissing a finding, then read the reasons monthly to spot themes.", "correct": false, "explanation": "Free-text reasons are valuable qualitative signal but inconsistent and slow to analyze, and developers often leave them blank. Without a structured field on the finding side, you cannot join dismissals to the pattern that triggered them."}, {"letter": "C", "text": "Lower the default severity of all findings so dismissals feel less costly while you gather informal feedback about problem areas.", "correct": false, "explanation": "Severity changes how findings look, not how often they are wrong. Developer trust erodes from high false-positive categories regardless of label, and you would still lack the data to identify which patterns are at fault."}, {"letter": "D", "text": "Add a structured <code>detected_pattern</code> field to each finding and log dismissals with it, so dismissal rates can be analyzed per pattern.", "correct": true, "explanation": "Capturing structured metadata about what triggered each finding is what makes systematic analysis possible: group dismissals by pattern, find the two or three that dominate, and improve their prompts, criteria, or few-shot examples. This closes the feedback loop the free-text message cannot."}], "overall": "", "domain": "Claude Code for Continuous Integration — Prompt & Structured Output"}, {"prompt": "Human reviewers correct about 400 extracted fields a week, and each correction is stored as document type, field, model value, and corrected value. The team wants extraction to improve from this data rather than only fixing individual records. How should the corrections be used?", "options": [{"letter": "A", "text": "Append every correction as a few-shot example in the extraction prompt so the model has seen each mistake it previously made on these document types.", "correct": false, "explanation": "Hundreds of examples bloat the prompt, dilute attention, and mostly repeat the same handful of patterns. Few-shot examples work when they are few and targeted; the corrections should be analyzed to choose them, not pasted wholesale."}, {"letter": "B", "text": "Cluster corrections by document type and field; for the top patterns update descriptions, normalization rules, or examples; re-evaluate on a held-out set.", "correct": true, "explanation": "A feedback loop turns structured error metadata into targeted changes: recurring patterns reveal which field descriptions, normalization rules, or examples need work, and a held-out evaluation confirms the change helped without regressing elsewhere. This is systematic improvement rather than record-by-record patching."}, {"letter": "C", "text": "Add a second extraction pass that re-reads any field a reviewer has ever corrected on that document type, and prefer the second pass's value.", "correct": false, "explanation": "A second pass increases cost on the fields most likely to be wrong but shares the same prompt and therefore the same blind spots. It treats the symptom per record without changing what causes the error."}, {"letter": "D", "text": "Use the corrected pairs to fine-tune a model on your document types so the corrections become part of the model's behaviour.", "correct": false, "explanation": "Fine-tuning is a heavy, slow lever, and the correction volume is small and pattern-concentrated. The same gains are typically available through prompt, schema, and example changes that can ship the same day and be evaluated immediately."}], "overall": "", "domain": "Structured Data Extraction — Prompt & Structured Output"}, {"prompt": "Contracts arrive continuously and your SLA promises each is processed within 36 hours of arrival. You plan to accumulate documents and submit them through the Message Batches API, which processes a batch within 24 hours. What is the longest submission interval that still guarantees the SLA?", "options": [{"letter": "A", "text": "Every 24 hours, since the batch processing window matches the interval and gives a predictable daily rhythm.", "correct": false, "explanation": "A document arriving just after a submission waits up to 24 hours for the next batch and then up to 24 hours for processing, a worst case of 48 hours. Predictability of the schedule does not help a contract that misses the promise by half a day."}, {"letter": "B", "text": "Every 12 hours, so the worst-case wait before submission plus the 24-hour processing window stays within 36 hours.", "correct": true, "explanation": "The worst case is the full interval waiting for submission plus the full 24-hour processing window. Interval plus 24 must be at most 36, so the interval is at most 12 hours. Shorter intervals also meet the SLA but create more, smaller batches than necessary; longer ones break it."}, {"letter": "C", "text": "Every 36 hours, aligning the batch cadence directly with the SLA so each cycle maps to one commitment period.", "correct": false, "explanation": "This ignores processing time entirely: a document arriving right after a submission could wait 36 hours and then need up to 24 more. Aligning the cadence to the SLA number is intuitive but doubles the worst case."}, {"letter": "D", "text": "Every 4 hours, which comfortably meets the SLA and keeps each batch small enough to resubmit quickly if some requests fail.", "correct": false, "explanation": "Four-hour batches meet the SLA with room to spare, and small batches do simplify resubmission. But the question asks for the longest interval that still guarantees the promise, and 4 hours triples the number of batches without being required."}], "overall": "", "domain": "Structured Data Extraction — Context & Reliability"}, {"prompt": "You move nightly test generation to the Message Batches API for the 50% saving. Each request tells Claude to read the module under test and its existing test file with tools before writing tests. Results come back with a <code>tool_use</code> block and no tests. How should the workload be restructured to stay on the batch API?", "options": [{"letter": "A", "text": "Gather the module source and existing test file in the pipeline and include their contents in each batch request, so no tool calls are needed mid-request.", "correct": true, "explanation": "The Batches API does not execute tools or continue a request after a <code>tool_use</code>; each request is a single model turn. Supplying the files up front turns the task into one turn and keeps the discount. The other options either expect unsupported behaviour or give up the saving."}, {"letter": "B", "text": "Keep the tool definitions in the batch requests but add a batch-completion step that executes the returned tool calls and submits a follow-up batch with the results.", "correct": false, "explanation": "This is technically possible but each tool round trip becomes another batch with its own up-to-24-hour window, so a request needing two reads could take three days. Multi-turn tool use is what the batch API is not designed for."}, {"letter": "C", "text": "Switch test generation back to the synchronous Messages API, where the agentic loop can execute tool calls, and accept the cost.", "correct": false, "explanation": "This works but abandons the goal. Nightly test generation is latency-tolerant, which makes it an ideal batch workload; the only obstacle is the mid-request tool use, and that can be removed by restructuring the request."}, {"letter": "D", "text": "Run <code>claude -p</code> from a cron job overnight so Claude Code's own tools handle the reads, avoiding the batch API limitation.", "correct": false, "explanation": "Headless Claude Code can read files, but it uses the synchronous API under the hood, so there is no batch discount. It also swaps a structured batch job for a shell loop that has to manage its own retries and correlation."}], "overall": "", "domain": "Claude Code for Continuous Integration — Context & Reliability"}, {"prompt": "A batch of 10,000 documents returns 9,650 successes. The 300 failures cite the request exceeding the model's context length; 50 report a transient server error. Each request carried a <code>custom_id</code> equal to the document ID. How should you handle the failures?", "options": [{"letter": "A", "text": "Resubmit the full batch of 10,000 so results stay in one place, relying on the 50% discount to keep the cost acceptable and avoiding any merge step.", "correct": false, "explanation": "Re-running 9,650 successful documents doubles the cost of the job and delays the failures by another processing window. The <code>custom_id</code> exists so you can identify and resubmit only what failed."}, {"letter": "B", "text": "Retry the 350 failed documents through the synchronous Messages API, unchanged, so they finish within minutes rather than another 24-hour window.", "correct": false, "explanation": "Speed is fine for the 50 transient failures, but the 300 oversized documents will fail identically on the synchronous API because the input still does not fit. Resubmitting unchanged repeats a known failure."}, {"letter": "C", "text": "Drop the 350 documents into a manual-review queue, since batch failures indicate documents the model is unlikely to handle well.", "correct": false, "explanation": "A transient error says nothing about the document, and an oversized document is a chunking problem, not a quality signal. Sending 3.5% of volume to humans for a fixable mechanical issue wastes reviewer capacity."}, {"letter": "D", "text": "Submit a new batch with only the failed <code>custom_id</code>s: chunk the 300 oversized documents to fit, resubmit the 50 transient failures unchanged.", "correct": true, "explanation": "Failure handling by <code>custom_id</code> lets you target only what failed, and the fix should match the cause: transient errors just need retrying, context-length errors need the document split. This keeps the discount and resolves both failure types on the next batch."}], "overall": "", "domain": "Structured Data Extraction — Context & Reliability"}, {"prompt": "Your support agent makes a classification call at the start of every live chat and runs a nightly job that scores 20,000 transcripts for quality. Finance asks you to move both to the Message Batches API for the 50% saving. How should you respond?", "options": [{"letter": "A", "text": "Move both, and for live chats poll the batch aggressively; most batches complete well inside the 24-hour window so customers will rarely notice.", "correct": false, "explanation": "The batch API has no latency guarantee; \"usually fast\" is not a property you can build a live conversation on. A customer waiting on classification cannot be told the batch is still processing."}, {"letter": "B", "text": "Keep both synchronous: the nightly scoring job feeds a morning dashboard, and any batch delay would leave the dashboard stale.", "correct": false, "explanation": "A nightly job with results due in the morning tolerates hours of latency, which is what the batch window offers. Refusing the saving here forgoes half the cost of your largest workload for a risk that fits within the schedule."}, {"letter": "C", "text": "Move the nightly transcript scoring to the batch API; keep the live-chat classification on the synchronous API.", "correct": true, "explanation": "Match the processing mode to the blocking behaviour: a customer is waiting on the classification, so it must be synchronous, while transcript scoring is non-blocking and latency-tolerant and captures the full saving on 20,000 requests. Moving both or neither ignores that difference."}, {"letter": "D", "text": "Move both, with live chats submitted to a batch and a fallback to a synchronous call if the batch result has not arrived within 30 seconds.", "correct": false, "explanation": "The fallback will fire on nearly every live chat, so you pay for the batch request and the synchronous call, plus 30 seconds of added latency. The complexity buys nothing because the live workload was never a batch candidate."}], "overall": "", "domain": "Customer Support Resolution Agent — Context & Reliability"}, {"prompt": "Two hours into exploring a legacy monolith, the agent's answers degrade: it refers to \"the typical repository pattern\" instead of the <code>LedgerRepository</code> class it read earlier and contradicts a dependency it traced an hour ago. Context is 85% full of raw <code>Grep</code> and <code>Read</code> output. What should the workflow look like?", "options": [{"letter": "A", "text": "Keep a scratchpad file of key findings the agent updates and re-reads, and delegate verbose searches to subagents returning summaries.", "correct": true, "explanation": "Degradation comes from specifics being crowded out by raw tool output. A scratchpad persists discovered facts outside the context window, and subagent isolation keeps verbose search results out of the main conversation. Together they sustain coherent exploration well past the point where a single context fills."}, {"letter": "B", "text": "Run <code>/compact</code> now and again every 30 minutes, so the raw tool output is summarized before it can crowd out the specifics.", "correct": false, "explanation": "Compaction frees space, but each pass summarizes lossily, and the specifics being lost, class names and traced dependencies, are exactly what summaries blur. Repeated compaction manages the symptom; persisting findings outside the context removes the cause."}, {"letter": "C", "text": "Copy every file the agent has identified as important into <code>CLAUDE.md</code> so the knowledge is loaded at the start of every session.", "correct": false, "explanation": "Loading large amounts of code into always-on project context bloats every session, including unrelated ones, and goes stale as the code changes. Findings belong in a working file the agent consults, not in the shared configuration."}, {"letter": "D", "text": "Switch to a model with a larger context window so the exploration output fits and the agent can keep everything it has read available.", "correct": false, "explanation": "More room delays the wall but does not remove it, and long inputs still suffer from position effects that bury specifics in the middle. Managing what enters context is a more durable fix than expanding it."}], "overall": "", "domain": "Developer Productivity with Claude — Context & Reliability"}, {"prompt": "A research job runs five subagents in sequence. When the coordinator process crashed after three had finished, restarting re-ran all five from scratch, doubling cost and time. Subagents currently return results only in their tool result to the coordinator. How should the system be designed for crash recovery?", "options": [{"letter": "A", "text": "Make every subagent idempotent and re-run all five on restart, accepting the extra cost as the price of a simple and predictable recovery model.", "correct": false, "explanation": "Idempotency is good hygiene but re-running finished work is exactly the cost you are trying to avoid. Simplicity here is paid for on every crash, and long research runs make crashes likely enough to matter."}, {"letter": "B", "text": "Resume the coordinator's session with <code>--resume</code> so it continues from its conversation history, which already contains the three completed results.", "correct": false, "explanation": "Session resumption restores the conversation, but the history holds verbose tool results rather than structured state, and it depends on the session having been persisted up to the moment of the crash. It is a coarse recovery for a problem that wants an explicit contract."}, {"letter": "C", "text": "Each subagent exports structured state as it finishes; on restart the coordinator loads a manifest and runs only the remaining subagents with it.", "correct": true, "explanation": "Structured state persistence is the crash-recovery pattern: completed work is written somewhere durable, a manifest records what finished, and the coordinator resumes by injecting that state into the remaining agents' prompts. The other approaches either redo the work or lean on conversation history that was never designed as a checkpoint."}, {"letter": "D", "text": "Checkpoint the coordinator's full conversation as JSON after every turn and restore it on restart so no messages are lost.", "correct": false, "explanation": "A full transcript checkpoint captures everything, including tens of thousands of tokens of raw results, and restoring it means restarting with a nearly full context. What the remaining subagents need is the findings, not the conversation that produced them."}], "overall": "", "domain": "Multi-Agent Research System — Context & Reliability"}, {"prompt": "A task has two phases: discover every external API call site across a 120-file service, then design a shared retry wrapper with the team. Discovery produces thousands of lines of matches, and in past attempts the design conversation became incoherent because the context was already nearly full. How should the phases be organized?", "options": [{"letter": "A", "text": "Run discovery in the main session, then use <code>/compact</code> before starting the design conversation to free up context space.", "correct": false, "explanation": "Compaction recovers space but summarizes lossily, so specific call sites and edge cases found in discovery may blur before the design phase needs them. It repairs a full context after the fact rather than keeping the noise out."}, {"letter": "B", "text": "Use <code>/clear</code> between phases and re-describe the discovery results by hand when starting the design conversation.", "correct": false, "explanation": "Clearing gives a clean slate but throws away the discovery output entirely, leaving you to reconstruct it manually and probably incompletely. The findings should carry forward in a compact form without human transcription."}, {"letter": "C", "text": "Write all discovery output to a file and reference it with <code>@</code> at the start of the design phase so nothing is lost.", "correct": false, "explanation": "Persisting to a file is a good instinct, but pulling thousands of raw lines back in with <code>@</code> refills the context with the same noise. The file should hold a distilled summary, not the raw matches."}, {"letter": "D", "text": "Delegate discovery to a subagent that returns a concise summary of call sites and patterns; inject that into the design phase.", "correct": true, "explanation": "Subagent isolation keeps verbose discovery output out of the main context entirely, and summarizing findings before the next phase gives the design conversation what it needs at a fraction of the tokens. This prevents the exhaustion rather than recovering from it."}], "overall": "", "domain": "Developer Productivity with Claude — Context & Reliability"}, {"prompt": "Yesterday you spent a session with Claude Code tracing how the billing module handles proration and reached a plan for a fix. Overnight, teammates merged changes to three files in that module. Today you want to implement the fix without repeating the whole investigation. How should you resume?", "options": [{"letter": "A", "text": "Resume the session and tell Claude which three files changed, asking it to re-read those before continuing.", "correct": true, "explanation": "Most of yesterday's analysis is still valid, so resumption preserves it, and naming the changed files lets Claude perform targeted re-analysis instead of a full re-exploration. This restores accurate state at minimal cost; the alternatives either trust stale results or redo everything."}, {"letter": "B", "text": "Resume the session and continue implementing the plan, since Claude will re-read any file it needs when it edits it.", "correct": false, "explanation": "Claude may edit based on yesterday's understanding of a file that has since changed, and it has no way to know which of its cached conclusions are stale. Resumption without flagging changes risks acting on outdated analysis."}, {"letter": "C", "text": "Start a new session and repeat the proration investigation so the analysis reflects the current code exactly.", "correct": false, "explanation": "A full re-investigation is the safe extreme, but three changed files out of a whole module do not justify discarding a day of valid context. Targeted re-analysis gets you current state far more cheaply."}, {"letter": "D", "text": "Fork the session so the original analysis is preserved, and in the fork ask Claude to re-explore the module from scratch.", "correct": false, "explanation": "Forking is for exploring divergent approaches from a shared baseline, not for refreshing stale state. Re-exploring from scratch inside a fork combines the cost of a new investigation with none of the benefit of the preserved context."}], "overall": "", "domain": "Code Generation with Claude Code — Context & Reliability"}, {"prompt": "Three weeks ago a session mapped the payment service and produced a migration plan. Since then a refactor touched about 60% of its files and renamed several modules. You want to continue the migration today. Which approach restores useful state most reliably?", "options": [{"letter": "A", "text": "Resume the old session and list the changed files so Claude re-reads them before continuing with the plan.", "correct": false, "explanation": "Targeted re-analysis works when a few files changed. With 60% changed and modules renamed, the stale tool results dominate the context and the list of changed files is most of the codebase, so resumption carries more misinformation than value."}, {"letter": "B", "text": "Resume the old session and run <code>/compact</code> so stale tool output is summarized away and Claude works from a condensed history.", "correct": false, "explanation": "Compaction condenses the stale results but does not correct them; a summary of wrong file contents is still wrong. It also blurs the specific decisions you actually want to preserve."}, {"letter": "C", "text": "Start a new session seeded with a structured summary of earlier findings and decisions, noting the code has since been refactored.", "correct": true, "explanation": "When prior tool results are mostly stale, a fresh session seeded with a structured summary of decisions and key facts is more reliable than resuming: Claude re-reads current code while keeping the reasoning that still applies. Resumption in any form carries three weeks of outdated file contents."}, {"letter": "D", "text": "Fork the old session so the original plan is preserved and continue the migration in the fork against the current code.", "correct": false, "explanation": "A fork inherits the same stale context as the parent; it protects the original but does not refresh anything. Forking is for branching alternatives from a valid baseline, and this baseline is no longer valid."}], "overall": "", "domain": "Code Generation with Claude Code — Context & Reliability"}, {"prompt": "After an hour analyzing the checkout module with Claude Code, you want to compare two refactoring strategies, extracting a service versus introducing a strategy pattern, each explored independently from the same analysis, without either exploration contaminating the other. How should you set this up?", "options": [{"letter": "A", "text": "Continue in the same session: explore the service extraction first, then ask Claude to set it aside and explore the strategy pattern.", "correct": false, "explanation": "The second exploration happens with the first still in context, so its conclusions are anchored by what came before. That is the contamination you wanted to avoid, and it also fills the context with both explorations."}, {"letter": "B", "text": "Open two new sessions and have each re-analyze the checkout module before exploring its assigned strategy.", "correct": false, "explanation": "This achieves independence but pays for the hour of analysis twice and risks the two sessions reaching slightly different baselines, which makes the comparison less clean than one shared starting point."}, {"letter": "C", "text": "Spawn two subagents with the <code>Task</code> tool, giving each a pasted summary of the analysis and one strategy to explore.", "correct": false, "explanation": "Subagents are independent, but they start from whatever summary you write rather than the full analysis, so nuance is lost and the summaries may differ. Forking preserves the exact baseline without transcription."}, {"letter": "D", "text": "Fork the session twice from the current point and explore one strategy in each fork, then compare the outcomes.", "correct": true, "explanation": "Forking creates independent branches from a shared analysis baseline, which is exactly the requirement: each fork has the full hour of context, neither sees the other's exploration, and the comparison starts from identical state. The alternatives either share context or rebuild it."}], "overall": "", "domain": "Code Generation with Claude Code — Context & Reliability"}, {"prompt": "You ask the agent to find every caller of <code>calculateTax</code>. The function is re-exported through two wrapper modules under different names, and one wrapper aliases it again. The agent's first attempt was to <code>Read</code> all 300 source files, exhausting context before it finished. How should the search be structured?", "options": [{"letter": "A", "text": "<code>Grep</code> for the definition and every export or alias, then <code>Grep</code> each name across the codebase and <code>Read</code> only matching files.", "correct": true, "explanation": "Content search finds the export chain cheaply, each discovered name becomes a new search, and reading is limited to files that actually reference one of the names. This builds understanding incrementally within context limits, which reading everything up front cannot do."}, {"letter": "B", "text": "Use <code>Glob</code> for files whose names contain <code>tax</code> and <code>Read</code> those, since callers of tax logic are likely to live in tax-related files.", "correct": false, "explanation": "Glob matches file paths, not contents, and callers of a tax function are scattered across checkout, invoicing, and reporting code whose filenames say nothing about tax. This finds the definition's neighbourhood and misses the callers."}, {"letter": "C", "text": "Start from the module that defines <code>calculateTax</code>, <code>Read</code> it, and follow its imports outward file by file until all callers are found.", "correct": false, "explanation": "Following imports goes the wrong direction: imports point to what a file depends on, not who depends on it. Finding callers requires searching for references, which is what content search does in one pass."}, {"letter": "D", "text": "<code>Read</code> the two wrapper modules first to learn the alias names, then <code>Read</code> every file that imports either wrapper to check for calls.", "correct": false, "explanation": "Learning the aliases from the wrappers is a sound first step, but reading every importer of the wrappers still pulls in files that use other exports and never call this function. Searching for the specific names keeps the read set small."}], "overall": "", "domain": "Developer Productivity with Claude — Context & Reliability"}];

let current = 0;
const userAnswers = new Array(QUESTIONS.length).fill(null); // stores selected letter or null

const qNav = document.getElementById('qNav');
const quizCard = document.getElementById('quizCard');
const scoreBadge = document.getElementById('scoreBadge');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const answeredLabel = document.getElementById('answeredLabel');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const restartBtn = document.getElementById('restartBtn');

function buildNav() {
  qNav.innerHTML = '';
  QUESTIONS.forEach((_, i) => {
    const b = document.createElement('button');
    b.textContent = i + 1;
    b.addEventListener('click', () => { current = i; render(); });
    qNav.appendChild(b);
  });
}

function score() {
  let correct = 0, answered = 0;
  userAnswers.forEach((letter, i) => {
    if (letter !== null) {
      answered++;
      const opt = QUESTIONS[i].options.find(o => o.letter === letter);
      if (opt && opt.correct) correct++;
    }
  });
  return { correct, answered };
}

function updateHeader() {
  const { correct, answered } = score();
  scoreBadge.textContent = `Score: ${correct} / ${QUESTIONS.length}`;
  progressLabel.textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
  answeredLabel.textContent = `${answered} answered`;
  progressFill.style.width = `${(answered / QUESTIONS.length) * 100}%`;

  Array.from(qNav.children).forEach((btn, i) => {
    btn.classList.toggle('current', i === current);
    btn.classList.remove('answered-correct', 'answered-wrong');
    if (userAnswers[i] !== null) {
      const opt = QUESTIONS[i].options.find(o => o.letter === userAnswers[i]);
      btn.classList.add(opt && opt.correct ? 'answered-correct' : 'answered-wrong');
    }
  });

  prevBtn.disabled = current === 0;
  nextBtn.textContent = current === QUESTIONS.length - 1 ? 'Finish' : 'Next';
}

function selectAnswer(qIndex, letter) {
  if (userAnswers[qIndex] !== null) return;
  userAnswers[qIndex] = letter;
  render();
}

function renderQuestion(q, qIndex) {
  const selected = userAnswers[qIndex];
  const locked = selected !== null;

  const optionsHtml = q.options.map(opt => {
    let cls = 'option';
    if (locked) {
      cls += ' locked';
      if (opt.letter === selected && opt.correct) cls += ' selected-correct';
      else if (opt.letter === selected && !opt.correct) cls += ' selected-wrong';
      if (opt.correct) cls += ' reveal-correct';
    }
    return `
      <div>
        <button class="${cls}" data-letter="${opt.letter}" ${locked ? 'disabled' : ''}>
          <span class="letter">${opt.letter}</span>
          <span>${escapeHtml(opt.text)}</span>
        </button>
        <div class="option-explanation ${locked ? 'show' : ''}">${escapeHtml(opt.explanation)}</div>
      </div>`;
  }).join('');

  let bannerHtml = '';
  if (locked) {
    const opt = q.options.find(o => o.letter === selected);
    const isCorrect = opt && opt.correct;
    bannerHtml = `<div class="feedback-banner show ${isCorrect ? 'correct' : 'wrong'}">
      ${isCorrect ? '✓ Correct!' : '✗ Not quite — check the highlighted answer.'}
    </div>`;
  }

  const overallHtml = locked && q.overall
    ? `<div class="overall-explanation show"><h4>Description</h4>${escapeHtml(q.overall).replace(/\n/g, '<br>')}</div>`
    : '';

  quizCard.innerHTML = `
    ${q.domain ? `<div class="domain-tag">${escapeHtml(q.domain)}</div>` : ''}
    <div class="q-title">Question ${qIndex + 1} of ${QUESTIONS.length}</div>
    <div class="prompt">${escapeHtml(q.prompt)}</div>
    <div class="options">${optionsHtml}</div>
    ${bannerHtml}
    ${overallHtml}
  `;

  quizCard.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(qIndex, btn.dataset.letter));
  });
}

function renderSummary() {
  const { correct } = score();
  const pct = Math.round((correct / QUESTIONS.length) * 100);
  quizCard.innerHTML = `
    <div class="summary-card">
      <div class="q-title">Quiz complete</div>
      <div class="big-score">${correct} / ${QUESTIONS.length}</div>
      <div>${pct}% correct</div>
    </div>`;
}

function render() {
  if (current >= QUESTIONS.length) {
    current = QUESTIONS.length - 1;
  }
  renderQuestion(QUESTIONS[current], current);
  updateHeader();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

prevBtn.addEventListener('click', () => {
  if (current > 0) { current--; render(); }
});

nextBtn.addEventListener('click', () => {
  if (current < QUESTIONS.length - 1) {
    current++;
    render();
  } else {
    renderSummary();
  }
});

restartBtn.addEventListener('click', () => {
  userAnswers.fill(null);
  current = 0;
  render();
});

buildNav();
render();
</script>
