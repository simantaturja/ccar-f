<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Quiz</title>
<style>
  :root {
    --bg: #f7f9fa;
    --panel: #ffffff;
    --border: #e3e5e6;
    --text: #1c1d1f;
    --muted: #6a6f73;
    --primary: #5624d0;
    --primary-dark: #3d1b8f;
    --correct: #1e7e34;
    --correct-bg: #e8f5e9;
    --wrong: #c0392b;
    --wrong-bg: #fdecea;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  .app {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px 16px 80px;
  }
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  header.top h1 {
    font-size: 1.3rem;
    margin: 0;
  }
  .score-badge {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 8px 16px;
    font-weight: 600;
    font-size: 0.9rem;
  }
  .progress-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 20px;
  }
  .progress-bar-track {
    background: #eceef0;
    border-radius: 999px;
    height: 8px;
    overflow: hidden;
    margin-top: 8px;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 999px;
    transition: width 0.25s ease;
    width: 0%;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    color: var(--muted);
  }
  .q-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 20px;
  }
  .q-nav button {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    font-size: 0.78rem;
    cursor: pointer;
    color: var(--text);
  }
  .q-nav button.current { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(86,36,208,0.15); }
  .q-nav button.answered-correct { background: var(--correct-bg); color: var(--correct); border-color: var(--correct); }
  .q-nav button.answered-wrong { background: var(--wrong-bg); color: var(--wrong); border-color: var(--wrong); }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
  }
  .domain-tag {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: var(--primary);
    background: #f1ecfc;
    padding: 4px 10px;
    border-radius: 999px;
    margin-bottom: 12px;
  }
  .q-title {
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 4px;
  }
  .prompt {
    white-space: pre-wrap;
    font-size: 1.05rem;
    line-height: 1.55;
    margin-bottom: 20px;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    cursor: pointer;
    background: var(--panel);
    text-align: left;
    font-size: 0.98rem;
    line-height: 1.5;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option:hover:not(.locked) {
    border-color: var(--primary);
    background: #faf8ff;
  }
  .option .letter {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--muted);
  }
  .option.selected-correct {
    border-color: var(--correct);
    background: var(--correct-bg);
  }
  .option.selected-correct .letter {
    background: var(--correct);
    border-color: var(--correct);
    color: #fff;
  }
  .option.selected-wrong {
    border-color: var(--wrong);
    background: var(--wrong-bg);
  }
  .option.selected-wrong .letter {
    background: var(--wrong);
    border-color: var(--wrong);
    color: #fff;
  }
  .option.reveal-correct:not(.selected-correct) {
    border-color: var(--correct);
  }
  .option.reveal-correct:not(.selected-correct) .letter {
    border-color: var(--correct);
    color: var(--correct);
  }
  .option.locked { cursor: default; }
  .option-explanation {
    margin-top: 8px;
    font-size: 0.88rem;
    color: var(--muted);
    padding-left: 38px;
    display: none;
  }
  .option-explanation.show { display: block; }
  .feedback-banner {
    display: none;
    align-items: center;
    gap: 8px;
    margin-top: 18px;
    padding: 12px 16px;
    border-radius: var(--radius);
    font-weight: 600;
    font-size: 0.95rem;
  }
  .feedback-banner.show { display: flex; }
  .feedback-banner.correct { background: var(--correct-bg); color: var(--correct); }
  .feedback-banner.wrong { background: var(--wrong-bg); color: var(--wrong); }
  .overall-explanation {
    display: none;
    margin-top: 16px;
    padding: 16px;
    border-radius: var(--radius);
    background: #f7f6fb;
    border: 1px solid var(--border);
    font-size: 0.92rem;
    line-height: 1.6;
    white-space: pre-wrap;
  }
  .overall-explanation.show { display: block; }
  .overall-explanation h4 {
    margin: 0 0 8px;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--muted);
  }
  .footer-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 20px;
    gap: 10px;
  }
  .footer-nav button {
    border: none;
    border-radius: 8px;
    padding: 12px 22px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary {
    background: var(--primary);
    color: #fff;
  }
  .btn-primary:hover { background: var(--primary-dark); }
  .btn-secondary {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border) !important;
  }
  .btn-secondary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; background: var(--primary); }
  .restart-row { text-align: center; margin-top: 14px; }
  .restart-row button {
    background: transparent;
    border: none;
    color: var(--muted);
    text-decoration: underline;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .summary-card { text-align: center; }
  .summary-card .big-score {
    font-size: 2.6rem;
    font-weight: 700;
    color: var(--primary);
    margin: 6px 0;
  }
  @media (max-width: 560px) {
    .card { padding: 16px; }
    .option-explanation { padding-left: 0; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>CCAF Mock #1 — 60 Questions by Topic</h1>
    <div class="score-badge" id="scoreBadge">Score: 0 / 0</div>
  </header>

  <div class="progress-wrap">
    <div class="progress-label">
      <span id="progressLabel">Question 1 of 60</span>
      <span id="answeredLabel">0 answered</span>
    </div>
    <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
  </div>

  <div class="q-nav" id="qNav"></div>

  <div class="card" id="quizCard"></div>

  <div class="footer-nav">
    <button class="btn-secondary" id="prevBtn">Previous</button>
    <button class="btn-primary" id="nextBtn">Next</button>
  </div>

  <div class="restart-row"><button id="restartBtn">Restart quiz</button></div>
</div>

<script>
const QUESTIONS = [{"prompt": "After calling <code>get_customer</code> and <code>lookup_order</code> , the agent has retrieved all available system data but faces uncertainty. Which situation represents the most appropriate trigger for calling <code>escalate_to_human</code> ?", "options": [{"letter": "A", "text": "The customer wants to cancel an order that shipped yesterday, with delivery scheduled for tomorrow. The agent should escalate because the customer might change their mind once they receive the package.", "correct": false, "explanation": "This is a routine in-transit cancellation with a clear policy path. Escalating on speculation that the customer \u201cmight change their mind\u201d is guessing at intent, not resolving ambiguity."}, {"letter": "B", "text": "The customer claims they never received their order, but tracking shows it was delivered and signed for at their address three days ago. The agent should escalate because presenting contradictory evidence might damage the customer relationship.", "correct": false, "explanation": "Contradictory tracking evidence is a defined dispute workflow. The agent has the evidence and should present it and open the appropriate claim; escalating to avoid an uncomfortable conversation trades away first-contact resolution for nothing."}, {"letter": "C", "text": "The customer's message mentions both a billing question and a product return. The agent should escalate so a human can coordinate handling both issues in a single interaction.", "correct": false, "explanation": "Two concerns in one message is a decomposition problem, not an escalation trigger. The agent has tools for both the billing question and the return and should handle them in a single interaction."}, {"letter": "D", "text": "The customer requests a price match against a competitor. Your policies allow adjustments for price drops on your own site within 14 days but are silent on competitor pricing. The agent should escalate for policy interpretation.", "correct": true, "explanation": "A price match against a competitor is the only option where the agent has exhausted its data and still has no defensible basis for a decision: the policy covers price drops on your own site but is <em>silent</em> on competitor pricing. Escalation is the right trigger when resolving the case requires interpreting or extending policy, which is a human judgment call \u2014 not something the agent should improvise."}], "overall": "", "domain": "Customer Support Resolution Agent \u2014 Agentic Architecture"}, {"prompt": "Production logs show that for simple requests like \"refund order #1234\", your agent succeeds in 3-4 tool calls with 91% resolution rate. However, for complex requests like \"I've been charged twice, my discount didn't apply, and I want to cancel\", the agent averages 12+ tool calls with only 54% resolution\u2014often investigating concerns sequentially and gathering redundant customer data for each one. What's the most effective change to improve complex request handling?", "options": [{"letter": "A", "text": "Reduce the number of available tools by consolidating get_customer, lookup_order, and billing-related lookups into a single investigate_issue tool.", "correct": false, "explanation": "Collapsing the lookups into one coarse <code>investigate_issue</code> tool hides the problem: fewer tools, but the same serial investigation inside it, plus a loss of the granularity that makes simple requests work at 91%."}, {"letter": "B", "text": "Add few-shot examples demonstrating ideal tool call sequences for various multi-part billing scenarios to your system prompt.", "correct": false, "explanation": "Few-shot examples are soft guidance. They can nudge tool choice, but they do not change an architecture that re-fetches customer data once per concern."}, {"letter": "C", "text": "Add explicit verification gates between steps requiring the agent to checkpoint after resolving each concern before moving to the next.", "correct": false, "explanation": "Verification gates after each concern add <em>more</em> sequential turns, worsening the very metric you are trying to improve."}, {"letter": "D", "text": "Decompose the request into distinct concerns, then investigate each in parallel using shared customer context before synthesizing a resolution.", "correct": true, "explanation": "The logs name two distinct root causes: the agent investigates concerns <em>sequentially</em> (driving the 12+ tool calls) and re-<em>gathers redundant customer data</em> for each one. Decomposing the request into distinct concerns, investigating them in parallel against a shared customer context, then synthesising a single resolution is the only option that fixes both \u2014 it cuts round-trips and removes the duplicate lookups while keeping each concern fully investigated."}], "overall": "", "domain": "Customer Support Resolution Agent \u2014 Agentic Architecture"}, {"prompt": "Production metrics show that when your agent resolves complex cases involving billing disputes or multi-order returns, customer satisfaction scores are 15% lower than for simple cases\u2014even when the resolution is technically correct. Root cause analysis reveals the agent provides accurate resolutions but inconsistently explains the reasoning: sometimes omitting relevant policy details, other times missing timeline information or next steps. The specific context gaps vary by case. You want to improve resolution quality without adding human review overhead. Which approach is most effective?", "options": [{"letter": "A", "text": "Implement few-shot examples in the system prompt showing complete resolution explanations for five common complex case types, demonstrating how to include policy context, timelines, and next steps.", "correct": false, "explanation": "Five fixed exemplars encode a static template, but the stem states the missing context gaps vary by case, so a case outside those five patterns still ships with a policy detail or timeline omitted. Few-shot demonstration is soft guidance, not a per-response completeness check against the draft actually produced."}, {"letter": "B", "text": "Add a confirmation step where the agent asks \"Does this fully address your concern?\" before closing, letting customers request additional information if needed.", "correct": false, "explanation": "Asking \"Does this fully address your concern?\" shifts detection of the omission onto the customer after an incomplete answer has already been delivered, which is the exact experience driving satisfaction 15% lower. It treats the symptom, adds a conversational round trip, and depends on customers knowing what policy or timeline detail was left out."}, {"letter": "C", "text": "Add a self-critique step where the agent evaluates its draft response for completeness\u2014ensuring it addresses the customer's concern, includes relevant context, and anticipates follow-up questions.", "correct": true, "explanation": "A self-critique step (evaluator-optimizer pattern) directly addresses the root cause of inconsistent explanation completeness by having the agent evaluate its own draft against specific criteria\u2014such as policy context, timelines, and next steps\u2014before presenting it. This catches case-specific gaps that vary across different complex scenarios without requiring human review."}, {"letter": "D", "text": "Increase the model tier from Haiku to Sonnet for complex cases, routing based on detected case complexity.", "correct": false, "explanation": "The stem states resolutions are already technically correct, so raw reasoning capability is not the root cause; upgrading Haiku to Sonnet for complex cases spends more per resolution without adding any mechanism that verifies policy context, timelines, and next steps are present in the draft."}], "overall": "", "domain": "Customer Support Resolution Agent \u2014 Agentic Architecture"}, {"prompt": "Your agent handles single-concern requests with 94% accuracy (e.g., \"I need a refund for order #1234\"). However, when customers include multiple concerns in one message (e.g., \"I need a refund for order #1234 and also want to update my shipping address for order #5678\"), tool selection accuracy drops to 58%. The agent typically addresses only one concern or mixes up parameters between requests. What's the most effective approach to improve reliability for multi-concern requests?", "options": [{"letter": "A", "text": "Implement response validation that detects incomplete responses and automatically re-prompts the agent to address any missed concerns.", "correct": false, "explanation": "Validation plus re-prompting catches the missed concern after the fact but leaves the decomposition failure intact, and it does nothing about the parameter mixing between order #1234 and #5678 that the stem describes. Each retry adds a round trip while the underlying pattern gap persists."}, {"letter": "B", "text": "Implement a preprocessing layer that uses a separate model call to decompose multi-concern messages into individual requests, process each independently, then combine the results.", "correct": false, "explanation": "A separate decomposition model call adds an extra inference hop, latency and cost to solve a gap that in-prompt examples close, since the agent already resolves individual concerns at 94%. It also discards cross-concern context that may matter when both requests touch the same customer."}, {"letter": "C", "text": "Add few-shot examples to your prompt demonstrating the correct reasoning and tool sequence for multi-concern requests.", "correct": true, "explanation": "Adding few-shot examples demonstrating correct reasoning and tool sequencing for multi-concern requests is the most effective approach because the agent already handles individual concerns well at 94% accuracy\u2014it simply needs pattern guidance for handling multiple concerns in one message. This is a low-cost, proven technique that directly addresses the root cause of the agent failing to decompose and properly route parameters across multiple requests."}, {"letter": "D", "text": "Consolidate related tools into fewer, more general-purpose tools.", "correct": false, "explanation": "Tool granularity is not the failure mode: single-concern selection already works at 94%, so the tools are fine. Folding refunds and address updates into broader general-purpose tools makes parameter confusion between orders #1234 and #5678 more likely, not less."}], "overall": "", "domain": "Customer Support Resolution Agent \u2014 Agentic Architecture"}, {"prompt": "You're implementing the agentic loop for your support agent. After each API call to Claude, you need to determine whether to continue the loop (execute the requested tools and call Claude again) or stop (present the final response to the customer). What determines this decision?", "options": [{"letter": "A", "text": "Parse Claude's response text for phrases like \"I've completed\" or \"Is there anything else?\"\u2014these natural language signals indicate the task is finished.", "correct": false, "explanation": "String-matching phrases like \"I've completed\" is brittle and unnecessary: the API already exposes a structured <code>stop_reason</code>. Claude's wording varies turn to turn, and it may narrate a closing pleasantry in the same response that carries a <code>tool_use</code> block, so the loop would stop before the tool ran."}, {"letter": "B", "text": "Set a maximum iteration count (e.g., 10 calls) and stop when reached, regardless of whether Claude indicates more work is needed.", "correct": false, "explanation": "An iteration cap is a runaway-cost backstop, not the loop-control signal. Stopping at 10 calls \"regardless of whether Claude indicates more work is needed\" ignores a <code>stop_reason</code> of <code>tool_use</code>, cutting off the turn mid-tool-call and handing the customer a response whose pending tool results were never returned."}, {"letter": "C", "text": "Check whether the response includes any assistant text content\u2014if Claude generated explanatory text, the loop should end.", "correct": false, "explanation": "Assistant text and <code>tool_use</code> blocks coexist in one response. Claude routinely explains what it is about to do (\"let me look up that order\") in the same message that requests the tool, so ending the loop whenever explanatory text appears would abort before any tool executed."}, {"letter": "D", "text": "Check the <code>stop_reason</code> field in Claude's response\u2014continue when it equals <code>\"tool_use\"</code> and stop when it equals <code>\"end_turn\"</code> .", "correct": true, "explanation": "The <code>stop_reason</code> field is Claude's explicit, structured signal for loop control: <code>\"tool_use\"</code> indicates Claude wants to execute a tool and receive the results back, while <code>\"end_turn\"</code> indicates Claude has completed its response and the loop should terminate."}], "overall": "", "domain": "Customer Support Resolution Agent \u2014 Agentic Architecture"}, {"prompt": "Your agent achieves 55% first-contact resolution, well below the 80% target. Logs show it escalates straightforward cases (standard damage replacements with photo evidence) while attempting to autonomously handle complex situations requiring policy exceptions. What's the most effective way to improve escalation calibration?", "options": [{"letter": "A", "text": "Deploy a separate classifier model trained on historical tickets to predict which requests need escalation before the main agent begins processing.", "correct": false, "explanation": "A separately trained classifier is heavy infrastructure for a problem the stem localizes to undefined decision boundaries, and training it on historical tickets bakes in the same miscalibrated escalation behavior those logs record. It also front-loads a routing decision before the agent has examined the evidence, such as the photo attached to a standard damage replacement."}, {"letter": "B", "text": "Have the agent self-report a confidence score (1-10) before each response and automatically route requests to humans when confidence falls below a threshold.", "correct": false, "explanation": "Self-reported confidence is the miscalibrated signal itself: the agent is already confident enough to autonomously attempt policy exceptions and unconfident on standard photo-evidence damage replacements, so thresholding that number routes the same cases the same wrong way. It adds a gate without ever teaching where the escalation boundary lies."}, {"letter": "C", "text": "Implement sentiment analysis to detect customer frustration levels and automatically escalate when negative sentiment exceeds a threshold.", "correct": false, "explanation": "Sentiment analysis measures customer emotion, not case complexity. A calm customer requesting a policy exception still gets handled autonomously, and a frustrated one with a straightforward damage replacement gets escalated, which worsens the 55% first-contact resolution rather than fixing the boundary the logs expose."}, {"letter": "D", "text": "Add explicit escalation criteria to your system prompt with few-shot examples demonstrating when to escalate versus resolve autonomously.", "correct": true, "explanation": "Adding explicit escalation criteria with few-shot examples directly addresses the root cause\u2014unclear decision boundaries between straightforward and complex cases. This is the most proportionate and effective first intervention, as it teaches the agent precisely when to escalate versus resolve autonomously without requiring additional infrastructure."}], "overall": "", "domain": "Customer Support Resolution Agent \u2014 Agentic Architecture"}, {"prompt": "Your CI pipeline includes two Claude-powered code review modes: a <code>pre-merge-commit</code> hook that blocks PR merging until complete, and \"deep analysis\" that runs overnight, polls for batch completion, then posts detailed suggestions to the PR. You want to reduce API costs using the Message Batches API, which offers 50% cost savings but requires polling and may take up to 24 hours to complete. Which mode should use batch processing?", "options": [{"letter": "A", "text": "Neither mode", "correct": false, "explanation": "Excluding both modes forgoes the 50% savings on a workload already built for it: deep analysis runs overnight and polls for completion, so the Message Batches API's asynchronous turnaround imposes no cost it is not already paying. This leaves real savings unclaimed for no benefit."}, {"letter": "B", "text": "Both modes", "correct": false, "explanation": "The pre-merge-commit hook blocks PR merging until it completes, so subjecting it to a batch job that may take up to 24 hours would stall merges for a day. Batch processing's latency tolerance requirement directly conflicts with a synchronous blocking gate."}, {"letter": "C", "text": "Pre-merge-commit hook only", "correct": false, "explanation": "This inverts the fit. The blocking pre-merge hook is the one mode that cannot absorb the batch API's up-to-24-hour turnaround, and routing it through polling would halt merges, while deep analysis, already overnight and poll-based, keeps paying full price."}, {"letter": "D", "text": "Deep analysis only", "correct": true, "explanation": "Deep analysis is the ideal candidate for batch processing because it already runs overnight, tolerates latency, and uses a polling model to check for completion before posting results\u2014perfectly matching the Message Batches API's asynchronous, poll-based design while capturing the 50% cost savings."}], "overall": "", "domain": "Claude Code for Continuous Integration \u2014 Agentic Architecture"}, {"prompt": "Your CI/CD system performs three types of Claude-powered analysis: (1) quick style checks on each PR that block merging until complete, (2) comprehensive security audits of the entire codebase run weekly, and (3) test case generation triggered nightly for recently-modified modules. The Message Batches API offers 50% cost savings but can take up to 24 hours to process. You want to optimize API costs while maintaining acceptable developer experience. Which combination correctly matches each task to its API approach?", "options": [{"letter": "A", "text": "Use the Message Batches API for all three tasks to maximize the 50% cost savings, and configure the pipeline to poll for batch completion.", "correct": false, "explanation": "PR style checks block merging, so routing them through a batch window of up to 24 hours stalls every merge; polling for completion reports the delay rather than removing it. This trades the stated requirement of acceptable developer experience for savings on the one workload that cannot tolerate latency."}, {"letter": "B", "text": "Use synchronous calls for all three tasks for consistent response times, and rely on prompt caching to reduce costs across all workloads.", "correct": false, "explanation": "The weekly full-codebase security audit and nightly test generation have no latency requirement, so paying synchronous rates on them forfeits the 50% discount for responsiveness nobody consumes. Prompt caching reduces cost on repeated prompt prefixes and does not substitute for the batch discount on these scheduled, latency-tolerant jobs."}, {"letter": "C", "text": "Use synchronous calls for PR style checks; use the Message Batches API for weekly security audits and nightly test generation.", "correct": true, "explanation": "This is the correct approach. PR style checks block developers and require immediate responses via synchronous calls, while weekly security audits and nightly test generation are scheduled tasks with flexible timelines that can easily tolerate the up-to-24-hour batch processing window, capturing the 50% cost savings on both."}, {"letter": "D", "text": "Use synchronous calls for PR style checks and nightly test generation; use Message Batches API only for weekly security audits.", "correct": false, "explanation": "Nightly test generation for recently-modified modules is a scheduled job whose output is not awaited by anyone, so it fits the up-to-24-hour batch window as comfortably as the weekly audit. Keeping it synchronous gives up 50% savings on a second latency-tolerant workload for no developer-experience benefit."}], "overall": "", "domain": "Claude Code for Continuous Integration \u2014 Agentic Architecture"}, {"prompt": "A pull request modifies 14 files across the stock tracking module. Your single-pass review analyzing all files together produces inconsistent results: detailed feedback for some files but superficial comments for others, obvious bugs missed, and contradictory feedback\u2014flagging a pattern as problematic in one file while approving identical code elsewhere in the same PR. How should you restructure the review?", "options": [{"letter": "A", "text": "Switch to a higher-tier model with a larger context window to give all 14 files adequate attention in one pass.", "correct": false, "explanation": "Context capacity is not the binding constraint here: 14 files already fit in one pass, and the symptoms described are uneven attention across them, not truncated input. A larger window and higher-tier model still spreads a single pass thinly, so superficial comments and contradictory verdicts persist at higher cost per review."}, {"letter": "B", "text": "Split into focused passes: analyze each file individually for local issues, then run a separate integration-focused pass examining cross-file data flow.", "correct": true, "explanation": "Splitting the review into focused per-file passes directly addresses the root cause of attention dilution, ensuring consistent depth and catching local issues reliably. A separate integration-focused pass then handles cross-file concerns like data flow dependencies, covering both dimensions of review quality."}, {"letter": "C", "text": "Require developers to split large PRs into smaller submissions of 3-4 files before the automated review runs.", "correct": false, "explanation": "This pushes the fix onto developers instead of the reviewer, and the same dilution simply reappears within each 3-4 file submission. Splitting the PR also destroys the cross-file view needed to catch data-flow issues in the stock tracking module, which the separate integration pass is meant to preserve."}, {"letter": "D", "text": "Run three independent review passes on the full PR and only flag issues that appear in at least two of the three runs.", "correct": false, "explanation": "Two-of-three voting across full-PR passes only suppresses findings that vary between runs; bugs missed because attention was diluted are likely missed in all three passes, so they never reach the threshold. It triples token cost, keeps per-file depth shallow, and discards legitimate issues surfaced by only one run."}], "overall": "", "domain": "Claude Code for Continuous Integration \u2014 Agentic Architecture"}, {"prompt": "Your team uses Claude Code to generate code suggestions, but you notice a pattern: subtle issues\u2014performance optimizations that break edge cases, cleanups that change behavior unexpectedly\u2014only surface when a different team member reviews the PR. Claude's reasoning during generation shows it considered these cases but concluded its approach was correct. Which approach directly addresses the root cause of this self-review limitation?", "options": [{"letter": "A", "text": "Enable extended thinking mode for the generation pass, allowing more thorough deliberation before producing suggestions.", "correct": false, "explanation": "Extended thinking deepens deliberation inside the same generation context, but the stem states Claude's reasoning already considered these edge cases and concluded its approach was correct. More thinking on the same premises reinforces the rationalization rather than supplying the independent judgment that catches it."}, {"letter": "B", "text": "Have a second, independent Claude Code instance review the changes without seeing the generator's reasoning.", "correct": true, "explanation": "Using a second, independent Claude Code instance without access to the generator's reasoning directly addresses the root cause by eliminating confirmation bias. This fresh perspective mirrors the benefit of human peer review, where a different team member catches issues the original author rationalized away."}, {"letter": "C", "text": "Add explicit self-review instructions to the generation prompt, asking Claude to critique its own suggestions before finalizing output.", "correct": false, "explanation": "Self-critique runs in the same context, with the generator's own justifications for dismissing those edge cases still in view. Since the reasoning trace shows the cases were already weighed and waved off, asking for self-review simply re-executes the biased evaluation."}, {"letter": "D", "text": "Include comprehensive test files and documentation in the prompt context so Claude better understands expected behavior during generation.", "correct": false, "explanation": "The failure is not missing knowledge of expected behavior; the reasoning shows the edge cases were identified and then dismissed as acceptable. Adding test files and documentation inflates context without introducing any reviewer whose judgment is independent of the generator's conclusion."}], "overall": "", "domain": "Claude Code for Continuous Integration \u2014 Agentic Architecture"}, {"prompt": "Your team wants to reduce API costs for automated analysis. Currently, real-time Claude calls power two workflows: (1) a blocking pre-merge check that must complete before developers can merge, and (2) a technical debt report generated overnight for review the next morning. Your manager proposes switching both to the Message Batches API for its 50% cost savings. How should you evaluate this proposal?", "options": [{"letter": "A", "text": "Keep real-time calls for both workflows to avoid batch result ordering issues.", "correct": false, "explanation": "The overnight technical debt report is read the next morning, so it has hours of slack and fits comfortably inside the batch window; refusing batch for it forfeits the 50% savings for no benefit. Result ordering is also not a real obstacle, since batch results are matched back by request identifier rather than position."}, {"letter": "B", "text": "Use batch processing for the technical debt reports only; keep real-time calls for pre-merge checks.", "correct": true, "explanation": "This is the correct approach because the Message Batches API's up to 24-hour processing time with no guaranteed latency SLA makes it ideal for overnight technical debt reports but unsuitable for blocking pre-merge checks where developers are waiting. This matches each workflow to the appropriate API based on its latency requirements."}, {"letter": "C", "text": "Switch both workflows to batch processing with status polling to check for completion.", "correct": false, "explanation": "Polling only observes progress, it does not accelerate it. The Message Batches API can take up to 24 hours with no guaranteed latency SLA, so a blocking pre-merge check would leave developers waiting an unbounded time before they can merge, which is the one constraint the stem makes non-negotiable."}, {"letter": "D", "text": "Switch both to batch processing with a timeout fallback to real-time if batches take too long.", "correct": false, "explanation": "Because batch processing carries no latency guarantee, the timeout would fire routinely on the pre-merge path, so the check ends up running in real time anyway after first absorbing the wait. The team then pays for both submissions and maintains fallback logic, a worse outcome than simply keeping that workflow real-time."}], "overall": "", "domain": "Claude Code for Continuous Integration \u2014 Agentic Architecture"}, {"prompt": "The code review component works iteratively: Claude analyzes a changed file, then may request related files (imports, base classes, tests) via tool calling to understand context before providing final feedback. Your application defines a tool that lets Claude request file contents; Claude invokes this tool, receives results, and continues its analysis. You're evaluating batch processing to reduce API costs. What is the primary technical constraint when considering batch processing for this workflow?", "options": [{"letter": "A", "text": "Batch processing lacks request correlation identifiers for matching outputs to input requests.", "correct": false, "explanation": "The Message Batches API does provide correlation: each request carries a <code>custom_id</code> that is echoed on its result, which is exactly how outputs are matched back to inputs. This is factually wrong about the batch API and misses the real blocker, the missing mid-request tool loop."}, {"letter": "B", "text": "The batch API doesn't support tool definitions in request parameters.", "correct": false, "explanation": "Batch requests accept the same Messages API parameters as synchronous calls, including <code>tools</code>, so a file-contents tool can be defined. Claude can even emit a <code>tool_use</code> block; what cannot happen is executing it and feeding results back, which is the actual constraint."}, {"letter": "C", "text": "Batch processing latency of up to 24 hours is too slow for pull request feedback, though the workflow could otherwise function.", "correct": false, "explanation": "The up-to-24-hour turnaround is a genuine drawback for pull request feedback, but the clause \"could otherwise function\" is false: the iterative loop where Claude requests imports, base classes and tests and continues on the results cannot run at all in a fire-and-forget batch. This names a secondary cost, not the primary technical constraint."}, {"letter": "D", "text": "The asynchronous model prevents executing tools mid-request and returning results for Claude to continue analysis.", "correct": true, "explanation": "The batch API's asynchronous fire-and-forget model means there is no mechanism to intercept a tool call mid-request, execute the tool, and return results for Claude to continue its analysis. This fundamentally breaks iterative tool-calling workflows that require multiple rounds of tool invocation and response within a single logical interaction."}], "overall": "", "domain": "Claude Code for Continuous Integration \u2014 Agentic Architecture"}, {"prompt": "The web search and document analysis agents have both completed their tasks and returned findings to the coordinator. What is the appropriate next step for producing an integrated research output?", "options": [{"letter": "A", "text": "Each agent directly sends its findings to the report generation agent, bypassing the coordinator", "correct": false, "explanation": "Sending findings straight to report generation bypasses the coordinator's centralized control, so nothing tracks subagent completion or routing. It also skips synthesis entirely, leaving the report agent to receive two unreconciled sets of findings with no component responsible for integrating them."}, {"letter": "B", "text": "The document analysis agent requests the web search results and merges them internally", "correct": false, "explanation": "Having the document analysis agent fetch and merge the web search results gives a specialized worker orchestration responsibilities it was not designed for, creating direct peer-to-peer coupling between subagents. It also duplicates the integration job that the pipeline already has a dedicated synthesis agent to perform."}, {"letter": "C", "text": "The coordinator passes both sets of findings to the synthesis agent for unified integration", "correct": true, "explanation": "This is correct because the orchestrator-workers pattern requires the coordinator to maintain centralized control by collecting results from subagents and routing them to the appropriate next component\u2014in this case, the synthesis agent, which is specifically designed to unify and integrate findings into a coherent output."}, {"letter": "D", "text": "The coordinator concatenates the raw outputs from both agents and returns them as the final result", "correct": false, "explanation": "Concatenating raw outputs yields two adjacent findings dumps, not the integrated research output the question asks for. No component reconciles overlaps or contradictions between the web search and document analysis results, so the synthesis step is skipped and the coordinator is doing work it should be delegating."}], "overall": "", "domain": "Multi-Agent Research System \u2014 Agentic Architecture"}, {"prompt": "When researching a broad topic, you observe that the web search agent and document analysis agent are both investigating the same subtopics, resulting in significant overlap in their findings. Token usage has nearly doubled without proportionally increasing the breadth or depth of research coverage. What's the most effective way to address this?", "options": [{"letter": "A", "text": "Implement a shared state mechanism where agents log their current focus area, allowing other agents to dynamically avoid duplicating work in progress", "correct": false, "explanation": "A shared focus-area log is reactive coordination applied after both agents are already running, so overlap is only caught once tokens have been spent on it, and concurrent claims race. It also adds read/write state traffic to every agent turn, when the coordinator could simply have assigned distinct subtopics or source types up front."}, {"letter": "B", "text": "Have the coordinator explicitly partition the research space before delegation, assigning distinct subtopics or source types to each agent", "correct": true, "explanation": "Having the coordinator explicitly partition the research space before delegation is the most effective approach because it addresses the root cause\u2014unclear task boundaries\u2014before any work begins. This preserves the benefits of parallel execution while preventing duplicated effort and wasted tokens."}, {"letter": "C", "text": "Convert to sequential execution where document analysis runs only after web search completes, using the web search findings as context to avoid duplication", "correct": false, "explanation": "Serializing the web search and document analysis agents surrenders the parallelism the architecture exists for, roughly doubling wall-clock research time. Piping all web findings in as context for the second agent also inflates its input tokens, so the near-doubled token usage is not reliably recovered."}, {"letter": "D", "text": "Allow both agents to complete their parallel work, then have the coordinator deduplicate overlapping findings before passing to the synthesis agent", "correct": false, "explanation": "Post-hoc deduplication by the coordinator runs only after both agents have already generated the redundant findings, so the wasted tokens the stem identifies are fully spent before the fix applies. It cleans up the output while leaving the duplicated work, and the extra reconciliation pass costs more tokens still."}], "overall": "", "domain": "Multi-Agent Research System \u2014 Agentic Architecture"}, {"prompt": "During testing, you observe that the synthesis agent frequently needs to verify specific claims while combining findings. Currently, when verification is needed, the synthesis agent returns control to the coordinator, which invokes the web search agent, then re-invokes synthesis with results. This adds 2-3 round trips per task and increases latency by 40%. Your evaluation shows that 85% of these verifications are simple fact-checks (dates, names, statistics) while 15% require deeper investigation. What's the most effective approach to reduce overhead while maintaining system reliability?", "options": [{"letter": "A", "text": "Have the synthesis agent accumulate all verification needs and return them as a batch to the coordinator at the end of its pass, which then sends them all to the web search agent at once.", "correct": false, "explanation": "Batching verifications to the end of the pass still routes all of them through the coordinator to the web search agent and then requires re-invoking synthesis with results, so the round-trip overhead behind the 40% latency increase remains for the 85% of simple lookups. It also forces synthesis to draft claims it cannot yet confirm."}, {"letter": "B", "text": "Have the web search agent proactively cache extra context around each source during initial research, anticipating what the synthesis agent might need to verify.", "correct": false, "explanation": "Proactive caching guesses in advance what will need checking, so it inflates every research payload with context that mostly goes unused while still missing the specific dates, names or statistics synthesis actually queries. Anything not pre-cached still incurs the full coordinator round-trip, so the overhead is not reliably eliminated."}, {"letter": "C", "text": "Give the synthesis agent a scoped <code>verify_fact</code> tool for simple lookups, while complex verifications continue delegating to the web search agent through the coordinator.", "correct": true, "explanation": "Providing a scoped fact-verification tool handles the 85% of simple lookups directly, eliminating most round-trips while preserving the coordinator-based delegation path for the 15% of complex verifications. This applies the principle of least privilege, keeping the synthesis agent focused on its primary task while still reducing latency significantly."}, {"letter": "D", "text": "Give the synthesis agent access to all web search tools so it can handle any verification need directly without round-trips through the coordinator.", "correct": false, "explanation": "Granting the full web search toolset violates least privilege and hands synthesis the 15% of deep investigations the web search agent is specialized for, pulling it away from its integration role. It removes the coordinator's oversight of complex research and effectively reimplements one agent inside another."}], "overall": "", "domain": "Multi-Agent Research System \u2014 Agentic Architecture"}, {"prompt": "A colleague suggests having the document analysis agent send its output directly to the synthesis agent instead of routing through the coordinator. What is the main advantage of keeping the coordinator as the central hub for all subagent communication?", "options": [{"letter": "A", "text": "Routing through the coordinator enables automatic retry logic that direct agent-to-agent calls cannot support", "correct": false, "explanation": "Retry logic is not a coordinator privilege; any caller, including one subagent invoking another directly, can wrap a call and reattempt it on failure. The hub-and-spoke advantage is uniform visibility and control over what each subagent sees, not an exclusive or automatic retry mechanism."}, {"letter": "B", "text": "The coordinator can observe all interactions, handle errors consistently, and decide what information each subagent should receive", "correct": true, "explanation": "The coordinator pattern provides centralized visibility into all interactions, consistent error handling across the system, and fine-grained control over what information each subagent receives, which are the primary advantages of hub-and-spoke communication."}, {"letter": "C", "text": "The coordinator batches multiple subagent requests together, reducing the total number of API calls and overall latency", "correct": false, "explanation": "The coordinator does not batch subagent work; the document analysis output travelling through the hub instead of straight to synthesis adds a round trip and re-serialises the payload into the coordinator's context, so central routing generally raises call count, tokens and latency. Control is the benefit, and this overhead is its price."}, {"letter": "D", "text": "Subagents operate with isolated memory, and direct communication would require complex serialization that only the coordinator can perform", "correct": false, "explanation": "Serialization of data between components is not unique to coordinators\u2014any component can serialize and pass data, so direct communication between subagents would not face a special serialization barrier that only a coordinator can overcome."}], "overall": "", "domain": "Multi-Agent Research System \u2014 Agentic Architecture"}, {"prompt": "After running the system on the topic \"impact of AI on creative industries,\" you observe that each subagent completes successfully: the web search agent finds relevant articles, the document analysis agent summarizes papers correctly, and the synthesis agent produces coherent output. However, the final reports cover only visual arts, completely missing music, writing, and film production. When you examine the coordinator's logs, you see it decomposed the topic into three subtasks: \"AI in digital art creation,\" \"AI in graphic design,\" and \"AI in photography.\" What is the most likely root cause?", "options": [{"letter": "A", "text": "The coordinator agent's task decomposition is too narrow, resulting in subagent assignments that don't cover all relevant domains of the topic.", "correct": true, "explanation": "The coordinator's logs directly reveal it decomposed the broad topic into only three visual arts subtasks (digital art, graphic design, photography), completely omitting music, writing, and film. Since the subagents all executed their assigned tasks correctly, the narrow decomposition by the coordinator is clearly the root cause of the missing coverage."}, {"letter": "B", "text": "The synthesis agent lacks instructions for identifying coverage gaps in the findings it receives from other agents.", "correct": false, "explanation": "The synthesis agent can only reason over what it receives, and it received only digital art, graphic design, and photography findings. Coverage-gap instructions at that stage could at best report the omission after the fact; they cannot produce music, writing, or film research that was never assigned or gathered."}, {"letter": "C", "text": "The document analysis agent is filtering out sources related to non-visual creative industries due to overly restrictive relevance criteria.", "correct": false, "explanation": "The coordinator never created a subtask for music, writing, or film, so no sources from those industries were ever retrieved for the document analysis agent to filter out. The stem also states this agent summarized the papers it received correctly, which rules out overly restrictive relevance criteria as the cause."}, {"letter": "D", "text": "The web search agent's queries are not comprehensive enough and need to be expanded to cover more creative industry sectors.", "correct": false, "explanation": "The web search agent found relevant articles for the three subtasks it was handed, so its query quality is not the failure. Its scope was fixed upstream by the coordinator's decomposition into visual-arts subtasks; broadening queries within \"AI in photography\" still cannot reach music, writing, or film."}], "overall": "", "domain": "Multi-Agent Research System \u2014 Agentic Architecture"}, {"prompt": "You need to add Slack as a new notification channel. The existing codebase has clear, consistent patterns for email, SMS, and push channels. However, the Slack API offers fundamentally different integration approaches\u2014incoming webhooks (simple, one-way only), bot tokens (enables delivery confirmation and programmatic control), or Slack Apps (bidirectional events, requires workspace approval). Your ticket says \"add Slack support\" without specifying which integration method or whether advanced features like delivery tracking will be needed. How should you approach this task?", "options": [{"letter": "A", "text": "Start direct execution using incoming webhooks to match the existing one-way notification pattern.", "correct": false, "explanation": "Choosing incoming webhooks resolves the ticket's ambiguity by assumption, silently foreclosing the delivery tracking that \"add Slack support\" neither requires nor rules out. Consistency with the one-way email, SMS and push pattern is a reasonable default, but it is a decision with architectural consequences that should be surfaced rather than absorbed into code."}, {"letter": "B", "text": "Enter plan mode to explore the integration options and their architectural implications, then present a recommendation before implementing.", "correct": true, "explanation": "This is correct because the Slack integration involves multiple valid approaches with significantly different architectural implications, and the requirements are ambiguous. Using plan mode to explore trade-offs between webhooks, bot tokens, and Slack Apps allows for an informed recommendation and team alignment before committing to an implementation path."}, {"letter": "C", "text": "Start direct execution using the bot token approach to enable delivery confirmation capabilities.", "correct": false, "explanation": "Bot tokens commit unilaterally to the heavier option, taking on token management and workspace scoping to enable delivery confirmation that no stated requirement asks for. The stem's problem is unspecified requirements, and picking the most capable integration is still picking, without the team alignment the trade-offs warrant."}, {"letter": "D", "text": "Start direct execution to scaffold the Slack channel class following existing patterns, deferring the integration method decision until later.", "correct": false, "explanation": "The integration method shapes the class's interface: a webhook channel is fire-and-forget, while bot tokens or a Slack App add confirmation handling and inbound events. Scaffolding to the existing pattern first does not defer the decision, it embeds a one-way assumption in structure that later has to be reworked."}], "overall": "", "domain": "Code Generation with Claude Code \u2014 Agentic Architecture"}, {"prompt": "You're adding error handling wrappers to external API calls across a 120-file codebase. The task has three phases: (1) discovering all API call locations and patterns, (2) designing the error handling approach collaboratively, and (3) implementing wrappers consistently. During Phase 1, Claude generates verbose output listing hundreds of call sites with context. Your context window is filling rapidly before you've finished discovery. What's the most effective approach to complete this while maintaining implementation consistency?", "options": [{"letter": "A", "text": "Use the Explore subagent for Phase 1 to isolate verbose output and return a summary, then continue Phases 2-3 in the main conversation.", "correct": true, "explanation": "Using the Explore subagent for Phase 1 is ideal because it isolates the verbose discovery output in a separate context, returning only a concise summary to the main conversation. This preserves the main context window for the collaborative design and consistent implementation phases where retained context is most valuable."}, {"letter": "B", "text": "Continue all phases in the main conversation, using /compact periodically to reduce context usage as you progress through the files.", "correct": false, "explanation": "The hundreds of call sites still enter the main context before <code>/compact</code> runs, so this only cleans up after the overflow rather than preventing it. Compaction is lossy summarization and may drop the specific discovery details that Phases 2 and 3 depend on, weakening the implementation consistency the task requires."}, {"letter": "C", "text": "Define your error handling pattern in CLAUDE.md, then process files in batches across multiple sessions, relying on the shared memory file for consistency.", "correct": false, "explanation": "CLAUDE.md carries the written pattern but not the collaborative Phase 2 design discussion, so each new session restarts without the reasoning behind the chosen approach. Across batches spanning 120 files, that lost context is exactly where inconsistent wrapper implementations creep in."}, {"letter": "D", "text": "Switch to headless mode with --continue, passing explicit context summaries between batch invocations to maintain continuity.", "correct": false, "explanation": "Headless mode with --continue is designed for automation rather than interactive collaborative work, and manually passing context summaries between invocations adds significant overhead that subagents handle automatically and more reliably."}], "overall": "", "domain": "Code Generation with Claude Code \u2014 Agentic Architecture"}, {"prompt": "Production logs reveal that the agent misinterprets data from your MCP tools: Unix timestamps from <code>get_customer</code> , ISO 8601 dates from <code>lookup_order</code> , and numeric status codes (1=pending, 2=shipped). Some tools are third-party MCP servers you cannot modify. What's the most maintainable approach to normalize data formats?", "options": [{"letter": "A", "text": "Use a PostToolUse hook to intercept tool results and apply formatting transformations before agent processing", "correct": true, "explanation": "Using a PostToolUse hook provides a centralized, deterministic point to intercept and normalize all tool outputs\u2014including those from third-party MCP servers\u2014before the agent processes them. This is the most maintainable approach because it applies transformations uniformly via code rather than relying on LLM interpretation or agent behavior."}, {"letter": "B", "text": "Create a <code>normalize_data</code> tool that the agent calls after each data retrieval to transform values", "correct": false, "explanation": "Requiring the agent to call a separate normalization tool after every data retrieval doubles API calls and depends on the agent reliably remembering to invoke it each time. This approach is fragile because agents can forget or skip steps, making it unsuitable for deterministic data transformations."}, {"letter": "C", "text": "Add detailed format documentation to your system prompt explaining each tool's data conventions", "correct": false, "explanation": "Documenting that <code>get_customer</code> returns Unix timestamps and that 2 means shipped leaves the actual conversion to the model on every call, which is soft guidance where the stem needs a reliable transformation. The prompt also grows with every tool added, and misreadings like the ones already in production logs remain possible."}, {"letter": "D", "text": "Modify tools you control to return human-readable formats; create wrapper tools for third-party tools", "correct": false, "explanation": "Wrapper tools around the unmodifiable third-party MCP servers work, but they multiply the surface to maintain: every new or changed upstream tool needs its own wrapper, transformation logic is scattered across two code paths, and the original third-party tool remains callable and unnormalized. A single <code>PostToolUse</code> hook covers all of them from one place."}], "overall": "", "domain": "Customer Support Resolution Agent \u2014 Tool Design & MCP"}, {"prompt": "Production metrics show your agent averages 4+ API round-trips per resolution. Analysis reveals Claude frequently requests <code>get_customer</code> and <code>lookup_order</code> in separate sequential turns even when both are needed upfront. What's the most effective way to reduce round-trips?", "options": [{"letter": "A", "text": "Prompt Claude to batch tool requests per turn, and return all tool results together before the next API call.", "correct": true, "explanation": "Prompting Claude to batch related tool requests in a single turn, and returning all results together before the next API call, leverages Claude's native ability to request multiple tools simultaneously. This is the most effective approach because it directly addresses the sequential calling pattern with minimal architectural changes."}, {"letter": "B", "text": "Create composite tools like <code>get_customer_with_orders</code> that bundle common lookup combinations into single calls.", "correct": false, "explanation": "Creating composite tools reduces flexibility and increases maintenance burden by requiring new bundled tools for every common combination, without addressing the root cause\u2014which is that Claude already supports requesting multiple tools per turn and simply needs to be prompted to do so."}, {"letter": "C", "text": "Implement speculative execution that automatically calls likely-needed tools alongside any requested tool, returning all results regardless of what was requested.", "correct": false, "explanation": "Speculative execution fires tools Claude never asked for, so most resolutions pay for unused <code>get_customer</code> or <code>lookup_order</code> payloads in latency, backend load and context tokens. It also hides an unrequested-side-effect risk, and it is far heavier architecture than prompting for the multi-tool turns Claude already supports natively."}, {"letter": "D", "text": "Increase <code>max_tokens</code> to give Claude more space to plan ahead and naturally batch its tool requests.", "correct": false, "explanation": "<code>max_tokens</code> only caps how long a single response may be; it does not change whether Claude emits one <code>tool_use</code> block or several in a turn. The agent is not truncating mid-plan, it is choosing sequential calls, so raising the ceiling leaves the 4+ round-trip pattern untouched."}], "overall": "", "domain": "Customer Support Resolution Agent \u2014 Tool Design & MCP"}, {"prompt": "Production data shows that in 12% of cases, your agent skips <code>get_customer</code> entirely and calls <code>lookup_order</code> using only the customer's stated name, occasionally leading to misidentified accounts and incorrect refunds. What change would most effectively address this reliability issue?", "options": [{"letter": "A", "text": "Add few-shot examples showing the agent always calling <code>get_customer</code> first, even when customers volunteer order details.", "correct": false, "explanation": "Few-shot examples only shift the model's priors; they cannot guarantee that <code>get_customer</code> runs before <code>lookup_order</code>. The 12% skip rate might shrink, but nothing prevents the sequence violation on the next unusual phrasing, so misidentified accounts and incorrect refunds remain possible."}, {"letter": "B", "text": "Enhance the system prompt to state that customer verification via <code>get_customer</code> is mandatory before any order operations.", "correct": false, "explanation": "A system prompt declaring verification \"mandatory\" is still soft guidance the model can deprioritize when a customer volunteers order details. The stem describes a reliability defect with financial consequences, which calls for a deterministic block rather than a stronger instruction."}, {"letter": "C", "text": "Implement a routing classifier that analyzes each request and enables only the subset of tools appropriate for that request type.", "correct": false, "explanation": "A routing classifier gates which tools are exposed per request type, but refund handling legitimately needs both <code>get_customer</code> and <code>lookup_order</code>, so the classifier cannot enforce ordering between them. It targets tool selection, while the failure here is a skipped prerequisite in a sequence, and it adds a new misclassification failure point."}, {"letter": "D", "text": "Add a programmatic prerequisite that blocks <code>lookup_order</code> and <code>process_refund</code> calls until <code>get_customer</code> has returned a verified customer ID.", "correct": true, "explanation": "Adding a programmatic prerequisite that blocks downstream tools until <code>get_customer</code> returns a verified customer ID provides a deterministic guarantee that the required sequence is followed. This is the most effective approach because it removes the possibility of the agent skipping verification, regardless of LLM behavior."}], "overall": "", "domain": "Customer Support Resolution Agent \u2014 Tool Design & MCP"}, {"prompt": "Production logs reveal a consistent pattern: when customers include \"account\" in messages (e.g., \"I want to check my account for the order I placed yesterday\"), the agent calls <code>get_customer</code> first 78% of the time. When customers phrase similar requests without \"account\" (e.g., \"I want to check on the order I placed yesterday\"), it calls <code>lookup_order</code> first 93% of the time. The tool descriptions are well-written and unambiguous. What is the most likely root cause of this discrepancy?", "options": [{"letter": "A", "text": "The model requires more training data on multi-concept messages and should be fine-tuned on examples that include both account and order language", "correct": false, "explanation": "Fine-tuning misdiagnoses a deterministic routing rule as a model capability gap. The split is systematic and keyword-gated (78% with \"account\", 93% without), not the diffuse error pattern a data shortage produces, and retraining would not remove the keyword-sensitive instruction still sitting in the system prompt."}, {"letter": "B", "text": "The system prompt contains keyword-sensitive instructions that steer behavior based on terms like \"account,\" creating unintended tool selection patterns", "correct": true, "explanation": "This is the most likely root cause because the systematic, keyword-triggered pattern (78% vs 93%) strongly suggests explicit routing logic in the system prompt that reacts to the word \"account\" and directs the agent toward customer-related tools. Since the tool descriptions are already well-written and unambiguous, the discrepancy points to prompt-level instructions creating unintended beha de <code>Button.tsx</code> throughout the tree, the shared test conventions must be copied into every directory that contains a test. Those copies then drift, which is the opposite of maintainable."}, {"letter": "B", "text": "Create rule files in <code>.claude/rules/</code> with YAML frontmatter specifying glob patterns to conditionally apply conventions based on file paths", "correct": true, "explanation": "Using rule files in <code>.claude/rules/</code> with YAML frontmatter and glob patterns (e.g., <code>**/*.test.tsx</code>, <code>src/api/**/*.ts</code>) allows conventions to be automatically and deterministically applied based on file paths, regardless of where those files are located in the directory structure. This is the most maintainable approach because it handles cross-cutting concerns like test files spread throughout the codebase without requiring duplication or manual intervention."}, {"letter": "C", "text": "Consolidate all conventions in the root CLAUDE.md file under headers for each area, relying on Claude to infer which section applies", "correct": false, "explanation": "One root file with per-area headers makes Claude infer which section governs the file at hand, replacing path-based determinism with judgment that can pick the React section while editing an API handler. It also loads every convention for every file, and gives tests scattered beside their sources no reliable trigger."}, {"letter": "D", "text": "Create skills in <code>.claude/skills/</code> for each code type that include the relevant conventions in their SKILL.md files", "correct": false, "explanation": "Skills in <code>.claude/skills/</code> are invoked by the model when a task matches the skill description; they are not bound to file paths, so nothing guarantees the test-conventions skill activates when <code>Button.test.tsx</code> is edited. Glob-scoped rule files attach to the file being touched without depending on that judgment."}], "overall": "", "domain": "Code Generation with Claude Code \u2014 Claude Code Config"}, {"prompt": "Your CLAUDE.md has grown to over 400 lines containing coding standards, testing conventions, a detailed PR review checklist, deployment workflow instructions, and database migration procedures. You want Claude to always follow the coding standards and testing conventions, but only apply PR review, deployment, and migration guidance when you're actually performing those tasks. What's the most effective restructuring approach?", "options": [{"letter": "A", "text": "Keep all content in CLAUDE.md but use @import syntax to organize it into separately maintained files by category", "correct": false, "explanation": "<code>@import</code> only splits the text across files for maintenance; imported content is still pulled into CLAUDE.md for every conversation. All 400-plus lines of PR checklist, deployment and migration guidance keep consuming context on unrelated tasks, so the always-on versus on-demand distinction is never actually made."}, {"letter": "B", "text": "Split the CLAUDE.md into files in .claude/rules/ with path-specific glob patterns so each rule loads only for matching file types", "correct": false, "explanation": "Path-specific glob patterns in .claude/rules/ are designed to apply rules based on file types being edited, not based on workflow tasks like PR reviews or deployments. This approach misapplies file-path matching to workflow-based distinctions that don't correspond to specific file types."}, {"letter": "C", "text": "Move all guidance into separate Skills files organized by workflow type, keeping only a brief project description in CLAUDE.md", "correct": false, "explanation": "Moving the coding standards and testing conventions into Skills makes them conditional on Claude detecting a trigger, which contradicts the requirement that they always apply. Universal rules belong in the always-loaded CLAUDE.md; only the PR review, deployment and migration workflows should be trigger-invoked."}, {"letter": "D", "text": "Keep universal standards in CLAUDE.md and create Skills for task-specific workflows (PR reviews, deployments, migrations) with trigger keywords", "correct": true, "explanation": "This is the most effective approach because CLAUDE.md content is loaded for every conversation, ensuring coding standards and testing conventions are always applied, while Skills are invoked on-demand when Claude detects relevant trigger keywords, making them ideal for task-specific workflows like PR reviews, deployments, and migrations."}], "overall": "", "domain": "Code Generation with Claude Code \u2014 Claude Code Config"}, {"prompt": "Your team created an <code>/analyze-codebase</code> skill that performs comprehensive code analysis\u2014dependency scanning, test coverage calculation, and code quality metrics. After running this command, team members report that Claude becomes less responsive in the session and loses track of their original task. What's the most effective way to address this while preserving full analysis capability?", "options": [{"letter": "A", "text": "Add instructions to the skill to compress all outputs into a brief summary before displaying", "correct": false, "explanation": "The dependency scan, coverage numbers, and quality metrics still pass through the main conversation before any summarization instruction runs, so the context window is already consumed. Instruction-based compression is also unreliable and discards detail, working against preserving full analysis capability."}, {"letter": "B", "text": "Split the skill into three smaller skills that each generate less output", "correct": false, "explanation": "Three smaller skills produce the same total dependency, coverage, and quality output, and all of it still lands in the main session's context. The problem is where the output accumulates, not how many invocations produce it."}, {"letter": "C", "text": "Add <code>model: haiku</code> to the frontmatter to use a faster, more efficient model </code> files are ordinary project documentation and are not automatically loaded as instructions the way Claude Code's own memory and rules files are. Moving the TypeScript, testing and API guidance there would silently stop it from reaching the model."}, {"letter": "C", "text": "Create separate markdown files in <code>.claude/rules/</code>, each covering one topic (e.g., <code>testing.md</code>, <code>api-conventions.md</code>)", "correct": true, "explanation": "Claude Code supports a <code>.claude/rules/</code> directory where you can create separate markdown files for topic-specific guidelines (e.g., <code>testing.md</code>, <code>api-conventions.md</code>), allowing teams to organize large instruction sets into focused, maintainable modules."}, {"letter": "D", "text": "Create multiple files named <code>CLAUDE.md</code> at different levels of the directory tree, each one overriding the parent's instructions", "correct": false, "explanation": "The description of the mechanism is wrong: nested <code>CLAUDE.md</code> files layer together with the parent's guidance rather than overriding it. It also organizes instructions by directory location instead of by topic, and deployment procedures or TypeScript conventions have no single subdirectory they naturally belong to."}], "overall": "", "domain": "Code Generation with Claude Code \u2014 Claude Code Config"}, {"prompt": "You've found that including 2-3 full exemplar endpoint implementations as context significantly improves consistency when generating new API endpoints. However, this context is only useful for creating new endpoints\u2014not for bug fixes, code reviews, or other API directory work. What's the most efficient configuration approach?", "options": [{"letter": "A", "text": "Create a skill that references the exemplar endpoints and includes pattern-following instructions, invoked on-demand via slash command.", "correct": true, "explanation": "Creating a skill with the exemplar endpoints and pattern-following instructions allows on-demand invocation via a slash command, ensuring the context is loaded only when generating new endpoints and not during unrelated tasks like bug fixes or code reviews."}, {"letter": "B", "text": "Reference the exemplar endpoints manually in each generation request by copying relevant code into your prompt.", "correct": false, "explanation": "Copying exemplar code into each prompt does keep the context task-scoped, but it is unrepeatable manual work that drifts as the exemplars change and gives the team no shared, versioned definition of the pattern. The question asks for a configuration, not a per-request habit."}, {"letter": "C", "text": "Configure path-specific rules in .claude/rules/api/ that include the exemplar code and activate when working in the API directory.", "correct": false, "explanation": "Path-specific rules in <code>.claude/rules/</code> do auto-activate by glob pattern when Claude reads matching files, but they fire for every task in the API directory \u2014 bug fixes and reviews included \u2014 not just new endpoint generation, so the exemplar context is loaded exactly where the stem says it is not useful."}, {"letter": "D", "text": "Add the exemplar endpoint code with pattern documentation to the project CLAUDE.md file so it's automatically available.", "correct": false, "explanation": "Project <code>CLAUDE.md</code> is loaded into every session automatically, so 2-3 full endpoint implementations would consume context during bug fixes, code reviews and all other API directory work. That is the opposite of loading the exemplars only when new endpoints are generated."}], "overall": "", "domain": "Code Generation with Claude Code \u2014 Claude Code Config"}, {"prompt": "You've created a <code>/commit</code> skill in <code>.claude/skills/commit/SKILL.md</code> that your team uses. One developer wants to customize it for their personal workflow (different commit message format, additional checks) without affecting teammates. W
