/skills/</code> overrides a project skill of the same name. The recommended fix, a distinct name, is unaffected either way.</span>"}], "overall": "", "domain": "Code Generation with Claude Code \u2014 Claude Code Config"}, {"prompt": "Your team has created a <code>/migration</code> skill that generates database migration files. The skill accepts a migration name via <code>$ARGUMENTS</code>. In production, you're seeing three issues: (1) developers often invoke the skill without arguments, resulting in poorly-named files, (2) the skill sometimes incorporates database schema details from unrelated earlier conversations, and (3) a developer accidentally triggered destructive test cleanup when the skill had broad tool access. Which configuration approach addresses all three issues?", "options": [{"letter": "A", "text": "Include validation instructions in the skill's SKILL.md that direct Claude to verify <code>$ARGUMENTS</code> contains a valid name, add prompts to ignore prior conversation context, and list forbidden operations Claude should avoid.", "correct": false, "explanation": "All three fixes rest on soft guidance: instructions cannot stop a destructive cleanup command the way <code>allowed-tools</code> denies the tool outright, telling Claude to ignore prior conversation does not remove that schema discussion from the context window the way <code>context: fork</code> does, and validation text inside SKILL.md surfaces nothing at invocation time to stop an argument-less <code>/migration</code> call."}, {"letter": "B", "text": "Add <code>argument-hint</code> frontmatter to prompt for required parameters, use <code>context: fork</code> to isolate execution, and restrict <code>allowed-tools</code> to file write operations.", "correct": true, "explanation": "This approach correctly uses three distinct skill configuration features to address each issue: <code>argument-hint</code> frontmatter shows expected parameters during autocomplete (addressing missing arguments), <code>context: fork</code> isolates execution in a subagent context separate from conversation history (preventing context bleeding from earlier conversations), and <code>allowed-tools</code> restricts tool access to only file write operations (preventing destructive actions)."}, {"letter": "C", "text": "Use positional parameters <code>$1</code> and <code>$2</code> instead of <code>$ARGUMENTS</code> to enforce specific inputs, include explicit schema file references via <code>@</code> syntax to control context, and add <code>description</code> frontmatter warning about destructive operations.", "correct": false, "explanation": "Positional <code>$1</code> and <code>$2</code> still bind to whatever was typed, so an argument-less invocation remains argument-less; <code>@</code> schema references add more context rather than isolating the skill from unrelated earlier conversations; and <code>description</code> frontmatter is documentation shown to the user, carrying no enforcement, so the broad tool access that caused the destructive cleanup persists."}, {"letter": "D", "text": "Split into separate <code>/migration-create</code> and <code>/migration-apply</code> skills, add instructions in each SKILL.md to request a migration name if not provided, and use different <code>allowed-tools</code> scopes for each skill.", "correct": false, "explanation": "Splitting the skill and scoping <code>allowed-tools</code> per half does constrain destructive operations, but asking for a migration name via SKILL.md instructions is soft guidance where <code>argument-hint</code> would surface the parameter at invocation, and nothing here isolates execution, so schema details from unrelated earlier conversations still bleed in."}], "overall": "", "domain": "Code Generation with Claude Code \u2014 Claude Code Config"}, {"prompt": "Production logs show the agent sometimes selects <code>get_customer</code> when <code>lookup_order</code> would be more appropriate, particularly for ambiguous requests like \"I need help with my recent purchase.\" You decide to add few-shot examples to your system prompt to improve tool selection. Which approach will most effectively address this issue?", "options": [{"letter": "A", "text": "Add examples grouped by tool\u2014all <code>get_customer</code> scenarios together, then all <code>lookup_order</code> scenarios.", "correct": false, "explanation": "Grouping all <code>get_customer</code> examples together and then all <code>lookup_order</code> examples shows each tool in isolation and never contrasts them, so it gives no signal for a request like \"I need help with my recent purchase\" where both tools look plausible. The confusion is comparative, and this layout removes the comparison."}, {"letter": "B", "text": "Add 4-6 examples targeting ambiguous scenarios, each showing reasoning for why one tool was chosen over plausible alternatives.", "correct": true, "explanation": "Targeting few-shot examples at the specific ambiguous scenarios where errors occur, with explicit reasoning about why one tool is preferred over another, directly teaches the model the comparative decision-making process it needs for edge cases. This approach is the most effective because worked examples demonstrating reasoning are better than declarative rules for nuanced tool selection."}, {"letter": "C", "text": "Add explicit \"use when\" and \"do not use when\" guidelines in each tool's description covering the ambiguous cases.", "correct": false, "explanation": "\"Use when\" and \"do not use when\" clauses are declarative rules, and for nuanced tool selection worked examples that show the reasoning outperform rules the model must apply on its own. The stem also specifies improving selection through few-shot examples in the system prompt, not rewriting tool descriptions."}, {"letter": "D", "text": "Add 10-15 examples of clear, unambiguous requests that demonstrate correct tool selection for each tool's typical use cases.", "correct": false, "explanation": "The failures occur specifically on ambiguous requests, so 10-15 examples of clear, unambiguous requests reinforce cases the agent already handles correctly. It spends prompt tokens on the wrong population of inputs and dilutes the examples with no coverage of the boundary between <code>get_customer</code> and <code>lookup_order</code>."}], "overall": "", "domain": "Customer Support Resolution Agent \u2014 Prompt & Structured Output"}, {"prompt": "Your automated code review system shows inconsistent severity ratings\u2014similar issues like null pointer risks receive \"critical\" severity in some PRs but only \"medium\" in others. Developer trust is declining because teams can't predict which findings require immediate attention. What's the most effective way to improve severity consistency?", "options": [{"letter": "A", "text": "Request that Claude include its reasoning for each severity assignment, then use that reasoning to manually calibrate and adjust ratings during review", "correct": false, "explanation": "Reasoning traces plus manual calibration correct ratings after the fact instead of fixing the ambiguity that produces them, so the model keeps emitting \"critical\" for one null pointer risk and \"medium\" for another. It also inserts a human into every PR, which cannot restore the predictability the declining developer trust depends on."}, {"letter": "B", "text": "Add a CLAUDE.md file that lists issue types and their default severities, instructing Claude to reference this mapping when assigning ratings", "correct": false, "explanation": "A static issue-type-to-severity mapping loses important context, since the same issue type (e.g., a null pointer risk) may warrant different severities depending on factors like code path, exposure, or criticality of the affected component. This rigid approach oversimplifies severity assignment and can lead to inaccurate ratings."}, {"letter": "C", "text": "Include explicit severity criteria in your prompt with ode> with <code>--json-schema</code> enforces structured output at the CLI level, guaranteeing well-formed JSON with the required fields (file path, line number, severity, suggested fix) that can be reliably parsed and posted as inline PR comments via the GitHub API. This is the most effective approach because it leverages native CLI capabilities designed specifically for structured output enforcement."}, {"letter": "B", "text": "Keep the narrative review format but add a summarization step that uses Claude to generate a structured JSON summary of the findings.", "correct": false, "explanation": "A second Claude pass adds an inference call's latency and cost while still producing unvalidated JSON that can be malformed. It also re-derives file paths and line numbers from prose that already lost them, so inline comment placement becomes a guess rather than data."}, {"letter": "C", "text": "Add a \"Review Output Format\" section to CLAUDE.md with examples showing structured findings, so Claude learns the expected format from project context.", "correct": false, "explanation": "<code>CLAUDE.md</code> supplies project context as guidance, not as a schema constraint; the model can drift back to narrative prose on any run. A CI job posting inline comments through the GitHub API needs a guaranteed parseable payload, which <code>--output-format json</code> with <code>--json-schema</code> enforces and prose examples do not."}, {"letter": "D", "text": "Include explicit formatting instructions in your review prompt requiring each finding to follow a parseable template like <code>[FILE:path] [LINE:n] [SEVERITY:level] ...</code>.", "correct": false, "explanation": "A bracket template like <code>[FILE:path] [LINE:n]</code> is an instruction the model may partially follow, so the pipeline needs custom regex parsing plus failure handling for every deviation. This is exactly the unenforced formatting that native schema validation at the CLI level replaces."}], "overall": "", "domain": "Claude Code for Continuous Integration \u2014 Prompt & Structured Output"}, {"prompt": "Your automated review analyzes comments and docstrings. The current prompt instructs Claude to \"check that comments are accurate and up-to-date.\" Findings frequently flag acceptable patterns (TODO markers, straightforward descriptions) while missing comments that describe behavior the code no longer implements. What change addresses the root cause of this inconsistent analysis?", "options": [{"letter": "A", "text": "Specify explicit criteria: flag comments only when their claimed behavior contradicts actual code behavior", "correct": true, "explanation": "Specifying explicit criteria\u2014flag comments only when their claimed behavior contradicts actual code behavior\u2014directly addresses the root cause by replacing the vague instruction with a precise definition of what constitutes a problem. This eliminates both false positives on acceptable patterns and false negatives on genuinely misleading comments."}, {"letter": "B", "text": "Include git blame data so Claude can identify comments that predate recent code modifications", "correct": false, "explanation": "Git blame timing is a proxy for staleness, not a test of accuracy: a comment that predates a refactor can still describe behavior correctly, and a misleading comment touched in the same commit looks fresh. The vague \"accurate and up-to-date\" instruction remains, so TODO markers keep getting flagged."}, {"letter": "C", "text": "Add few-shot examples of misleading comments to help the model recognize similar patterns in the codebase", "correct": false, "explanation": "Few-shot examples illustrate the target class but leave the vague \"check that comments are accurate and up-to-date\" instruction in force, so the model still has no decision rule that excludes TODO markers and straightforward descriptions. It nudges recall for patterns resembling the examples rather than defining the criterion."}, {"letter": "D", "text": "Filter out TODO, FIXME, and descriptive comment patterns before analysis to reduce noise", "correct": false, "explanation": "Pre-filtering TODO, FIXME and descriptive comments suppresses the visible false positives without giving Claude any criterion, and the harder failure \u2014 comments describing behavior the code no longer implements \u2014 is unaffected. Blanket pattern removal also hides descriptive comments that genuinely contradict the code."}], "overall": "", "domain": "Claude Code for Continuous Integration \u2014 Prompt & Structured Output"}, {"prompt": "Your automated reviews identify valid issues but developers report the feedback isn't actionable. Findings say things like \"complex ticket allocation logic\" or \"potential null pointer\" without specifying what to change. When you add detailed instructions like \"always include specific fix suggestions,\" the model still produces inconsistent output\u2014sometimes detailed, sometimes vague. What prompting technique would most reliably produce consistently actionable feedback?", "options": [{"letter": "A", "text": "Add 3-4 few-shot examples showing the exact format you want: issue identified, code location, specific fix suggestion", "correct": true, "explanation": "Few-shot examples are the most effective technique for achieving consistent output format when instructions alone produce variable results. Providing 3-4 examples showing the exact desired format (issue, location, specific fix) gives the model a concrete pattern to follow, which is more reliable than abstract instructions."}, {"letter": "B", "text": "Further refine the instructions with more explicit requirements for each part of the feedback format (location, issue, severity, suggested fix)", "correct": false, "explanation": "The stem states that adding detailed instructions such as \"always include specific fix suggestions\" already failed to stop the output drifting between detailed and vague. Adding more explicit requirements pulls harder on the lever that has already proven insufficient; abstract instructions leave the concrete shape of a finding underdetermined in a way demonstrations do not."}, {"letter": "C", "text": "Implement a two-pass approach where one prompt identifies issues and a second prompt generates fixes, allowing specialization", "correct": false, "explanation": "Splitting identification from fix generation addresses decomposition, not format consistency: the second prompt still has only prose guidance, so it can emit \"potential null pointer\" style vagueness just as readily. It also adds a second inference pass and drops the reviewing context that motivated the finding."}, {"letter": "D", "text": "Expand the context window to include more of the surrounding codebase so the model has sufficient information to suggest specific fixes", "correct": false, "explanation": "The reviews already \"identify valid issues,\" so the failure is the specificity and shape of the written feedback, not missing information about the code. Pulling in more of the surrounding codebase spends tokens and latency on a comprehension problem the stem does not report, and leaves output format unconstrained."}], "overall": "", "domain": "Claude Code for Continuous Integration \u2014 Prompt & Structured Output"}, {"prompt": "Your automated code review averages 15 findings per pull request, with developers reporting a 40% false positive rate. The bottleneck is investigation time: developers must click into each finding to read Claude's reasoning before deciding whether to address or dismiss it. Your CLAUDE.md already contains comprehensive rules for acceptable patterns, and stakeholders have rejected any approach that filters findings before developer review. What change would best address the investigation time bottleneck?", "options": [{"letter": "A", "text": "Configure Claude to only surface findings it assesses as high confidence, filtering out uncertain flags before developers see them", "correct": false, "explanation": "Surfacing only high-confidence findings withholds the uncertain ones, which is precisely the pre-review filtering stakeholders rejected. It also leans on the model's own confidence in a system already producing a 40% false positive rate, so the suppressed findings are not reliably the wrong ones."}, {"letter": "B", "text": "Require Claude to include its reasoning and confidence assessment inline with each finding", "correct": true, "explanation": "Including reasoning and confidence assessments inline with each finding directly addresses the investigation time bottleneck by allowing developers to quickly evaluate findings without clicking into each one separately. This approach respects the constraint against filtering, since all findings remain visible while making triage significantly faster."}, {"letter": "C", "text": "Add a post-processor that analyzes finding patterns and automatically suppresses those matching historical false positive signatures", "correct": false, "explanation": "Automatically suppressing findings that match historical false positive signatures is another form of filtering before developer review, which stakeholders have explicitly rejected. Even though it uses data-driven pattern matching, it still removes findings from the developer's view."}, {"letter": "D", "text": "Categorize findings as \"blocking issues\" versus \"suggestions\" with tiered review requirements", "correct": false, "explanation": "Splitting 15 findings into blocking issues and suggestions does not shorten investigation time, because developers still must click into each finding to read the reasoning before deciding. Tiered review requirements also amount to skipping scrutiny on one tier, which conflicts with the no-filtering constraint."}], "overall": "", "domain": "Claude Code for Continuous Integration \u2014 Prompt & Structured Output"}, {"prompt": "You've asked Claude Code to implement a function that transforms API responses into a normalized internal format. After two iterations, the output structure still doesn't match expectations\u2014some fields are nested differently and timestamps aren't formatted correctly. You've been describing the requirements in prose, but Claude seems to interpret them differently each time. What's the most effective approach for the next iteration?", "options": [{"letter": "A", "text": "Rewrite your requirements with greater technical precision, specifying exact field mappings, nesting rules, and timestamp format strings.", "correct": false, "explanation": "Two prose iterations have already been reinterpreted differently each time, so a third prose attempt keeps the same ambiguous medium. A described nesting rule or timestamp format string still has to be interpreted before it is applied, whereas the transformation itself can simply be shown."}, {"letter": "B", "text": "Ask Claude to explain its current interpretation of the requirements so you can identify where understanding diverges.", "correct": false, "explanation": "Eliciting the current interpretation is a diagnostic round trip that ends where it started, with prose requirements to patch. It may reveal where understanding diverged on field nesting or timestamp formatting, but it supplies no unambiguous target for the next iteration, so the divergence can recur."}, {"letter": "C", "text": "Write a JSON schema defining the expected output structure and validate Claude's output against it after each iteration.", "correct": false, "explanation": "A JSON schema can validate the output structure but doesn't help Claude understand the actual transformation logic needed to produce correct results. This approach addresses verification rather than comprehension, meaning Claude would still need to understand the mapping requirements to generate correct output in the first place."}, {"letter": "D", "text": "Provide 2-3 concrete input-output examples showing the expected transformation for representative API responses.", "correct": true, "explanation": "Providing concrete input-output examples is the most effective approach because it eliminates the ambiguity inherent in prose descriptions by showing Claude exactly what the expected transformation looks like. This directly addresses the root cause\u2014misinterpretation of prose requirements\u2014by giving unambiguous, concrete targets for field nesting and timestamp formatting."}], "overall": "", "domain": "Code Generation with Claude Code \u2014 Prompt & Structured Output"}, {"prompt": "Your support agent uses progressive summarization\u2014when context reaches 70% capacity, older turns are summarized while recent ones remain verbatim. Production logs reveal a pattern: customers reference specific amounts (\"the 15% discount I mentioned\"), but the agent responds with incorrect values. Investigation shows these details were stated 20+ turns ago and got condensed into vague summaries like \"discussed promotional pricing.\" What's the most effective fix?", "options": [{"letter": "A", "text": "Store full conversation history externally and implement retrieval to search it when the agent detects reference phrases like \"as I mentioned.\"", "correct": false, "explanation": "External retrieval gated on detected reference phrases like \"as I mentioned\" is a soft trigger: a customer who says \"apply my discount\" without a cue phrase still gets the vague \"discussed promotional pricing\" summary. It also adds a retrieval hop and search latency while still not guaranteeing the 15% figure is in the prompt."}, {"letter": "B", "text": "Revise the summarization prompt to explicitly preserve all numerical values, percentages, dates, and customer-stated expectations verbatim.", "correct": false, "explanation": "Instructing the summarizer to keep numbers verbatim is soft prompt guidance against an inherently lossy compression step, and adherence decays as summaries are themselves re-summarized across 20+ turns. The root cause the stem identifies is that precise transactional details sit inside the compressible region at all."}, {"letter": "C", "text": "Extract transactional facts (amounts, dates, order numbers) into a persistent \"case facts\" block included in each prompt, outside the summarized history.", "correct": true, "explanation": "Extracting transactional facts (amounts, dates, order numbers) into a persistent \"case facts\" block addresses the root cause: summarization is inherently lossy for precise details. By preserving critical information in a structured block outside the summarized history, these facts remain reliably available in every prompt regardless of how many turns are summarized."}, {"letter": "D", "text": "Increase the summarization threshold from 70% to 85% capacity so conversations have more room before summarization triggers.", "correct": false, "explanation": "Moving the trigger from 70% to 85% only delays the first summarization pass. Conversations that already run 20+ turns past the stated \"15% discount\" will still condense it into \"discussed promotional pricing,\" and the change leaves less headroom before the window fills, so it treats a symptom rather than the lossiness."}], "overall": "", "domain": "Customer Support Resolution Agent \u2014 Context & Reliability"}, {"prompt": "Your automated review generates test case suggestions for each PR. When reviewing a PR that adds course completion tracking, Claude suggests 10 test cases but developer feedback indicates 6 duplicate scenarios already covered in the existing test suite. What change would most effectively reduce duplicate suggestions?", "options": [{"letter": "A", "text": "Implement post-processing that filters suggestions whose descriptions match keywords from existing test names", "correct": false, "explanation": "Keyword matching against existing test names is post-hoc cleanup that cannot recognize a duplicate scenario worded differently, and it will drop genuinely new cases that happen to share vocabulary with existing tests. Claude still generates the 6 duplicates because it never learns what the suite covers."}, {"letter": "B", "text": "Add instructions directing Claude to focus exclusively on edge cases and error conditions rather than successful paths", "correct": false, "explanation": "Restricting suggestions to edge cases and error conditions narrows output by category rather than by what is already tested, so duplicate edge cases still slip through while legitimate uncovered happy-path coverage for course completion tracking is suppressed. The knowledge gap about the existing suite is untouched."}, {"letter": "C", "text": "Reduce requested suggestions from 10 to 5, assuming Claude will prioritize the most valuable cases first", "correct": false, "explanation": "Cutting the request from 10 to 5 shrinks the list without telling Claude what already exists, so roughly the same 60% duplication rate applies to a smaller set. The net effect is fewer novel suggestions, not fewer duplicates."}, {"letter": "D", "text": "Include the existing test file in the context so Claude can identify what scenarios are already covered", "correct": true, "explanation": "Including the existing test file in the context directly addresses the root cause of duplication: Claude can only avoid suggesting already-covered scenarios if it knows what tests already exist. This gives Claude the information needed to reason about which suggestions would be genuinely new and valuable."}], "overall": "", "domain": "Claude Code for Continuous Integration \u2014 Context & Reliability"}, {"prompt": "Analysis of your automated code review shows significant variation in false positive rates across finding categories. Security and correctness findings have an 8% false positive rate, performance findings have 18%, style and naming findings have 52%, and documentation findings have 48%. Developer surveys indicate growing distrust\u2014many have started dismissing findings without review because \"half are wrong.\" The high false positive categories are undermining confidence in the accurate categories. What approach best restores developer trust while improving the system?", "options": [{"letter": "A", "text": "Apply a uniform strictness reduction across all categories to bring the overall false positive rate to an acceptable level.", "correct": false, "explanation": "A uniform strictness reduction lowers the average by suppressing findings in the 8% categories too, so real security and correctness issues get dropped to compensate for style and naming noise. The false positive rates differ by category, so a single global dial cannot fix the 52% categories without damaging the accurate ones."}, {"letter": "B", "text": "Temporarily disable high false positive categories (style, naming, documentation) and run only high-precision categories while improving prompts.", "correct": true, "explanation": "Temporarily disabling the high false positive categories (style, naming, documentation) immediately stops trust erosion by removing the noise that causes developers to dismiss all findings, while preserving the value of high-precision categories like security and correctness. This approach allows time to improve prompts for the problematic categories before re-enabling them, rebuilding trust through demonstrated accuracy."}, {"letter": "C", "text": "Keep all categories enabled while adding few-shot examples to improve each category's accuracy over the coming weeks.", "correct": false, "explanation": "Leaving style, naming and documentation enabled means developers keep seeing roughly half-wrong findings for the weeks it takes few-shot tuning to land, so the dismissal habit and trust erosion continue. Improving accuracy is the right long-term work but it does nothing to stop the ongoing damage now."}, {"letter": "D", "text": "Keep all categories but display a confidence score with each finding, letting developers decide which to investigate.", "correct": false, "explanation": "Confidence scores shift triage onto developers who have already stopped reviewing findings because \"half are wrong,\" adding a judgment step rather than removing noise. The 52% style and 48% documentation findings still occupy the review surface, so the volume that trains developers to dismiss everything is unchanged."}], "overall": "", "domain": "Claude Code for Continuous Integration \u2014 Context & Reliability"}, {"prompt": "After an initial automated review generates 12 findings, a developer pushes new commits to address the issues. When the review runs again, it produces 8 findings\u2014but developers report that 5 duplicate earlier comments on code that was already fixed in the new commits. What's the most effective way to eliminate this redundant feedback while maintaining thorough analysis?", "options": [{"letter": "A", "text": "Restrict the review scope to only files modified in the most recent push, excluding files from earlier commits.", "correct": false, "explanation": "Narrowing scope to files touched in the most recent push sacrifices the thorough analysis the question requires: real defects in files committed earlier and never revisited stop being reported at all. It suppresses duplicates by shrinking coverage rather than by determining which of the 8 findings were already fixed."}, {"letter": "B", "text": "Include prior review findings in context, instructing Claude to only report new or still-unaddressed issues.", "correct": true, "explanation": "Including prior review findings in context allows Claude to intelligently distinguish between new issues and those already addressed by recent commits. This approach maintains thorough analysis while leveraging Claude's reasoning ability to avoid redundant feedback on fixed code."}, {"letter": "C", "text": "Run reviews only on initial PR creation and final pre-merge state, skipping intermediate commits.", "correct": false, "explanation": "Skipping intermediate commits reduces how often duplicates appear but does not prevent them, since the pre-merge run still has no record of the original 12 findings and can restate issues the developer already fixed. It also removes the incremental feedback developers rely on while iterating."}, {"letter": "D", "text": "Add a post-processing filter that removes findings matching previous file paths and issue descriptions before posting comments.", "correct": false, "explanation": "Matching on file paths and issue descriptions is string similarity, not evidence that the code changed, so it cannot distinguish a fixed issue from one that is genuinely still unaddressed at the same location and will silently drop real findings. Reworded duplicates slip through, while the reasoning about whether the new commits resolved the issue never happens."}], "overall": "", "domain": "Claude Code for Continuous Integration \u2014 Context & Reliability"}, {"prompt": "Production monitoring reveals inconsistent synthesis quality. When aggregated results total ~75K tokens, the synthesis agent reliably cites information from the first 15K tokens (web search headlines and snippets) and the final 10K tokens (document analysis conclusions), but frequently omits critical findings that appear in the middle 50K tokens\u2014even when those findings directly address the research question. How should you restructure the aggregated input?", "options": [{"letter": "A", "text": "Place a key findings summary at the beginning of the aggregated input and organize detailed results with explicit section headers for easier navigation.", "correct": true, "explanation": "Placing a key findings summary at the beginning leverages the primacy effect, ensuring critical information occupies the most reliably attended position. Adding explicit section headers throughout the aggregated input helps the model navigate and attend to middle-section content, directly mitigating the 'lost in the middle' phenomenon."}, {"letter": "B", "text": "Implement rotation that alternates which subagent's results appear first across different research tasks, ensuring both sources receive primacy positioning equally over time.", "correct": false, "explanation": "Rotating which subagent leads only moves the primacy slot between sources; on any single research task roughly 50K tokens still land in the neglected middle. Balancing neglect across tasks does not improve the synthesis for the task at hand."}, {"letter": "C", "text": "Stream subagent results to the synthesis agent incrementally, processing web search results first to completion before introducing document analysis findings.", "correct": false, "explanation": "Incremental streaming still accumulates the same ~75K in the synthesis agent's context, so the positional attention problem is unchanged. Processing web search to completion first also forces conclusions before document analysis findings arrive, losing the cross-source integration synthesis exists to perform."}, {"letter": "D", "text": "Summarize all subagent outputs to under 20K tokens total before aggregation, ensuring content stays within the model's reliable processing range.", "correct": false, "explanation": "Compressing 75K to under 20K sacrifices exactly the granularity at risk: the stem states the neglected middle contains critical findings that directly address the research question, and a summarizer with no view of that question can drop them. The failure is positional attention, not total volume."}], "overall": "", "domain": "Multi-Agent Research System \u2014 Context & Reliability"}, {"prompt": "The web search subagent returns results for only 3 of 5 requested source categories (competitor websites and industry reports succeeded, but news archives and social media feeds timed out). The document analysis subagent successfully processed all provided documents. The synthesis subagent must now produce a findings summary from this mixed-quality input. What's the most effective error propagation strategy?", "options": [{"letter": "A", "text": "Proceed with synthesis using only the successful sources, generating output without indicating which data was unavailable.", "correct": false, "explanation": "Synthesising the three successful categories without flagging that news archives and social media feeds timed out lets readers mistake a coverage gap for an absence of evidence, for example concluding there is no adverse social sentiment. It discards exactly the uncertainty information that makes a partial result safe to act on."}, {"letter": "B", "text": "Structure the synthesis output with coverage annotations indicating which findings are well-supported versus which topic areas have gaps due to unavailable sources.", "correct": true, "explanation": "Structuring the synthesis output with coverage annotations embodies graceful degradation with transparency, allowing downstream consumers and end users to understand which findings are well-supported and which topic areas have gaps. This approach preserves the value of completed work while propagating uncertainty information so informed decisions can be made about confidence levels."}, {"letter": "C", "text": "Have the synthesis subagent request the coordinator retry the timed-out sources with extended timeouts before proceeding, ensuring complete data coverage before synthesis begins.", "correct": false, "explanation": "This inverts control flow, with a downstream synthesis subagent driving the coordinator's retry policy, and it blocks all output on sources that have already timed out and may time out again on the extended budget. Insisting on complete coverage before synthesis begins forfeits the graceful degradation that ships usable findings now."}, {"letter": "D", "text": "Have the synthesis subagent return an error to the coordinator indicating incomplete upstream data, triggering a full retry or task failure.", "correct": false, "explanation": "Failing the task converts a degraded but valuable result into no result: competitor websites, industry reports and the fully processed documents are all usable input. A full retry re-runs work that already succeeded, and treating partial coverage as a hard error removes the option of an annotated, lower-confidence summary."}], "overall": "", "domain": "Multi-Agent Research System \u2014 Context & Reliability"}, {"prompt": "The document analysis subagent encounters a corrupted PDF file it cannot parse. When designing the system's error handling, what is the most effective way to handle this failure?", "options": [{"letter": "A", "text": "Automatically retry parsing the document three times with exponential backoff before reporting failure.", "correct": false, "explanation": "Exponential backoff addresses transient faults such as timeouts or rate limits. File corruption is deterministic, so all three parse attempts fail identically, adding delay for no chance of success, and the coordinator still ends up with a bare failure and no context about which document was lost or why."}, {"letter": "B", "text": "Return the error with context to the coordinator agent, letting it decide how to proceed.", "correct": true, "explanation": "Returning the error with context to the coordinator agent is the most effective approach because it enables the coordinator to make an informed decision\u2014such as skipping the file, trying an alternative parsing method, or notifying the user\u2014while maintaining visibility into the failure."}, {"letter": "C", "text": "Throw an exception that terminates the entire research workflow.", "correct": false, "explanation": "A fatal exception discards completed work from the web search and other subagents over a single unreadable file. It also removes the coordinator's real options, such as trying an alternative parsing method or continuing with the remaining documents, which are decisions the coordinator is positioned to make."}, {"letter": "D", "text": "Silently skip the corrupted document and continue processing other files to avoid interrupting the workflow.", "correct": false, "explanation": "Skipping silently keeps the workflow running but leaves the synthesis stage and the user believing coverage was complete. The coordinator loses the visibility it needs to try another parser or flag the gap, so the final report is quietly built on a smaller evidence base than reported."}], "overall": "", "domain": "Multi-Agent Research System \u2014 Context & Reliability"}, {"prompt": "The document analysis subagent frequently encounters failures when processing PDF files\u2014some have corrupted sections causing parsing exceptions, others are password-protected, and occasionally the parsing library times out on large files. Currently, any exception immediately terminates the subagent and returns an error to the coordinator, which must decide whether to retry, skip the document, or fail the entire research task. This is causing excessive coordinator involvement in routine error handling. What's the most effective architectural improvement?", "options": [{"letter": "A", "text": "Have the coordinator validate all documents before dispatching to the subagent, rejecting documents likely to cause failures to ensure the subagent only receives processable files.", "correct": false, "explanation": "Corrupted internal sections and parsing-library timeouts on large files are only detectable by attempting the parse, so pre-validation either duplicates that work or rejects processable documents. It also puts the coordinator back in the middle of routine error handling, the opposite of the stated goal."}, {"letter": "B", "text": "Configure the subagent to always return partial results with success status, embedding error details in metadata. The coordinator treats all responses as successful and filters problematic items during synthesis.", "correct": false, "explanation": "Reporting every response as successful erases the distinction between a fully parsed document and a password-protected one the coordinator may need to act on. No recovery is attempted, so transient timeouts are never retried, and the failures resurface as silent gaps during synthesis."}, {"letter": "C", "text": "Create a dedicated error-handling agent that monitors all subagent failures via a shared queue and makes recovery decisions independently, dispatching retry commands directly to subagents.", "correct": false, "explanation": "A separate error-handling agent reading a shared failure queue lacks the local state that made the failure recoverable, such as the partial parse already completed. It adds a coordination hop and a new component while the subagent, which is already at the point of failure, is the cheapest place to retry a timeout."}, {"letter": "D", "text": "Have the subagent implement local recovery for transient failures and only propagate errors it cannot resolve to the coordinator, including what was attempted and any partial results obtained.", "correct": true, "explanation": "Implementing local recovery for transient failures within the subagent follows the principle of handling errors at the lowest level capable of resolving them. This reduces excessive coordinator involvement while still escalating truly unresolvable issues with full context, including what recovery was attempted and any partial results obtained."}], "overall": "", "domain": "Multi-Agent Research System \u2014 Context & Reliability"}, {"prompt": "During testing, combined outputs from the web search agent (85K tokens including page content) and the document analysis agent (70K tokens including reasoning chains) total 155K tokens, but the synthesis agent performs optimally with inputs under 50K tokens. What's the most effective solution?", "options": [{"letter": "A", "text": "Add an intermediate summarization agent that condenses findings before passing to synthesis", "correct": false, "explanation": "An intermediate summarization agent pays for the verbose page content and reasoning chains twice \u2014 once generated upstream, once read by the summarizer \u2014 and adds a lossy model hop plus latency where citations and specifics can be lost. It compresses the symptom instead of stopping verbose returns at the source."}, {"letter": "B", "text": "Modify upstream agents to return structured data (key facts, citations, relevance scores) instead of verbose content and reasoning", "correct": true, "explanation": "Modifying upstream agents to return structured data (key facts, citations, relevance scores) addresses the root cause by reducing token volume at the source while preserving essential information. This eliminates verbose page content and reasoning chains that inflate token counts without adding value for the synthesis step."}, {"letter": "C", "text": "Have the synthesis agent process findings in sequential batches, maintaining running state between calls", "correct": false, "explanation": "Sequential batching keeps each call under 50K but the 155K is still generated and consumed, and running state carried between calls degrades, so early findings are represented by progressively lossier notes. It also prevents holistic comparison across web search and document analysis results in a single pass."}, {"letter": "D", "text": "Store findings in a vector database and give the synthesis agent retrieval tools to query during its work", "correct": false, "explanation": "A vector database is retrieval infrastructure for corpora too large to inspect; here the synthesis agent must guess queries and may never surface relevant findings it does not know to ask for. The 155K of verbose content is still produced upstream, so the token inflation at the source is unaddressed."}], "overall": "", "domain": "Multi-Agent Research System \u2014 Context & Reliability"}, {"prompt": "During a materials research task, the web search subagent queries three source categories with different outcomes: academic databases returned 15 relevant papers, industry reports returned \"0 results found,\" and patent databases returned \"Connection timeout.\" When designing error propagation to the coordinator, what approach enables the best recovery decisions?", "options": [{"letter": "A", "text": "Distinguish access failures (timeout) needing retry decisions from valid empty results (\"0 results\") representing successful queries.", "correct": true, "explanation": "This is correct because a timeout (access failure) and '0 results' (valid empty result) are semantically distinct outcomes requiring different responses. Distinguishing them enables the coordinator to retry the timed-out patent database while accepting the empty industry report results as a valid and informative finding."}, {"letter": "B", "text": "Have the subagent retry transient failures internally and only report persistent errors.", "correct": false, "explanation": "Internal retries strip the coordinator of the information it needs: whether the patent database was reachable at all. Retry versus source substitution is a coordinator-level decision about research coverage, and \"0 results\" from industry reports is not a transient failure that retrying could fix."}, {"letter": "C", "text": "Aggregate outcomes into a single success rate metric (e.g., \"67% source coverage\") with detailed logs available on request.", "correct": false, "explanation": "A single \"67% source coverage\" figure collapses the timeout and the \"0 results\" into one undifferentiated number, destroying exactly the distinction recovery depends on. The coordinator cannot tell that the patent database merits a retry while the empty industry report result should be accepted."}, {"letter": "D", "text": "Report both the timeout and \"0 results\" as failures requiring coordinator intervention.", "correct": false, "explanation": "The industry reports' \"0 results\" is a successful query and an informative finding about coverage, not a failure. Labeling it alongside the patent database timeout triggers pointless retries of a query that will keep returning nothing and misrepresents the evidence base."}], "overall": "", "domain": "Multi-Agent Research System \u2014 Context & Reliability"}, {"prompt": "The web search subagent times out while researching a complex topic. You need to design how this failure information flows back to the coordinator agent. Which error propagation approach best enables intelligent recovery?", "options": [{"letter": "A", "text": "Propagate the timeout exception directly to a top-level handler that terminates the entire research workflow.", "correct": false, "explanation": "Terminating the entire research workflow on one subagent timeout discards any partial search results already gathered and removes every recovery option, including retrying with a narrower query. The coordinator never learns a recoverable timeout occurred, so no intelligent decision is possible at the level that could make one."}, {"letter": "B", "text": "Implement automatic retry logic with exponential backoff within the subagent, returning a generic \"search unavailable\" status only after all retries are exhausted.", "correct": false, "explanation": "Exponential backoff inside the subagent adds delay to a call that already timed out, and collapsing the outcome to a generic \"search unavailable\" status discards exactly the information the coordinator needs: the failure type, the attempted query, and any partial results. The coordinator cannot reformulate the query or proceed on partial data it never receives."}, {"letter": "C", "text": "Return structured error context to the coordinator including the failure type, the attempted query, any partial results, and potential alternative approaches.", "correct": true, "explanation": "Returning structured error context\u2014including the failure type, attempted query, partial results, and alternative approaches\u2014gives the coordinator all the information it needs to make intelligent recovery decisions, such as retrying with a modified query or proceeding with partial results. This is the best approach because it preserves maximum context for informed decision-making at the coordination level."}, {"letter": "D", "text": "Catch the timeout within the subagent and return an empty result set marked as successful.", "correct": false, "explanation": "Marking a timeout as a successful empty result set misreports the failure, so the coordinator reads \"nothing found\" instead of \"search did not complete\" and may draw research conclusions from a gap it does not know exists. It destroys the failure type and partial results entirely, making recovery impossible."}], "overall": "", "domain": "Multi-Agent Research System \u2014 Context & Reliability"}, {"prompt": "The document analysis agent discovers that two credible sources contain directly conflicting statistics on a key metric: one government report states 40% growth while an industry analysis states 12% growth. Both sources appear legitimate and the discrepancy could significantly affect the research conclusions. What's the most effective way for the document analysis agent to handle this?", "options": [{"letter": "A", "text": "Complete the document analysis with both figures included, explicitly annotate the conflict with source attribution, and let the coordinator decide how to reconcile before passing to synthesis.", "correct": true, "explanation": "This is the most effective approach because it respects separation of concerns: the document analysis agent completes its primary task without blocking, preserves both conflicting data points with explicit source attribution, and appropriately defers the reconciliation decision to the coordinator, which has the broader context needed to resolve the conflict."}, {"letter": "B", "text": "Apply source credibility heuristics to select the most likely accurate figure, complete the analysis using that value, and include a footnote mentioning the discrepancy.", "correct": false, "explanation": "Credibility heuristics push a reconciliation decision onto the document analysis agent, which lacks the cross-source view the coordinator has. Silently adopting 40% or 12% and demoting the other to a footnote bakes an unverified choice into conclusions the stem says the discrepancy could significantly affect."}, {"letter": "C", "text": "Include both figures in the analysis output without flagging them as conflicting, allowing the synthesis agent to determine which to use based on the broader research context.", "correct": false, "explanation": "Passing both figures through unflagged strips the signal that they are in direct conflict, so the synthesis agent may average them, pick arbitrarily, or cite both as if compatible. Without source attribution tying 40% to the government report and 12% to the industry analysis, the conflict becomes invisible downstream."}, {"letter": "D", "text": "Halt analysis and escalate to the coordinator immediately, asking it to determine which source is authoritative before the agent continues processing remaining documents.", "correct": false, "explanation": "Halting blocks the agent on a question it does not need answered to finish its own job, leaving the remaining documents unprocessed while it waits on the coordinator. The conflict can be recorded and carried forward, so the stall buys nothing that annotation would not."}], "overall": "", "domain": "Multi-Agent Research System \u2014 Context & Reliability"}];

let current = 0;
const userAnswers = new Array(QUESTIONS.length).fill(null); // stores selected letter or null

const qNav = document.getElementById('qNav');
const quizCard = document.getElementById('quizCard');
const scoreBadge = document.getElementById('scoreBadge');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const answeredLabel = document.getElementById('answeredLabel');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const restartBtn = document.getElementById('restartBtn');

function buildNav() {
  qNav.innerHTML = '';
  QUESTIONS.forEach((_, i) => {
    const b = document.createElement('button');
    b.textContent = i + 1;
    b.addEventListener('click', () => { current = i; render(); });
    qNav.appendChild(b);
  });
}

function score() {
  let correct = 0, answered = 0;
  userAnswers.forEach((letter, i) => {
    if (letter !== null) {
      answered++;
      const opt = QUESTIONS[i].options.find(o => o.letter === letter);
      if (opt && opt.correct) correct++;
    }
  });
  return { correct, answered };
}

function updateHeader() {
  const { correct, answered } = score();
  scoreBadge.textContent = `Score: ${correct} / ${QUESTIONS.length}`;
  progressLabel.textContent = `Question ${current + 1} of ${QUESTIONS.length}`;
  answeredLabel.textContent = `${answered} answered`;
  progressFill.style.width = `${(answered / QUESTIONS.length) * 100}%`;

  Array.from(qNav.children).forEach((btn, i) => {
    btn.classList.toggle('current', i === current);
    btn.classList.remove('answered-correct', 'answered-wrong');
    if (userAnswers[i] !== null) {
      const opt = QUESTIONS[i].options.find(o => o.letter === userAnswers[i]);
      btn.classList.add(opt && opt.correct ? 'answered-correct' : 'answered-wrong');
    }
  });

  prevBtn.disabled = current === 0;
  nextBtn.textContent = current === QUESTIONS.length - 1 ? 'Finish' : 'Next';
}

function selectAnswer(qIndex, letter) {
  if (userAnswers[qIndex] !== null) return;
  userAnswers[qIndex] = letter;
  render();
}

function renderQuestion(q, qIndex) {
  const selected = userAnswers[qIndex];
  const locked = selected !== null;

  const optionsHtml = q.options.map(opt => {
    let cls = 'option';
    if (locked) {
      cls += ' locked';
      if (opt.letter === selected && opt.correct) cls += ' selected-correct';
      else if (opt.letter === selected && !opt.correct) cls += ' selected-wrong';
      if (opt.correct) cls += ' reveal-correct';
    }
    return `
      <div>
        <button class="${cls}" data-letter="${opt.letter}" ${locked ? 'disabled' : ''}>
          <span class="letter">${opt.letter}</span>
          <span>${escapeHtml(opt.text)}</span>
        </button>
        <div class="option-explanation ${locked ? 'show' : ''}">${escapeHtml(opt.explanation)}</div>
      </div>`;
  }).join('');

  let bannerHtml = '';
  if (locked) {
    const opt = q.options.find(o => o.letter === selected);
    const isCorrect = opt && opt.correct;
    bannerHtml = `<div class="feedback-banner show ${isCorrect ? 'correct' : 'wrong'}">
      ${isCorrect ? '✓ Correct!' : '✗ Not quite — check the highlighted answer.'}
    </div>`;
  }

  const overallHtml = locked && q.overall
    ? `<div class="overall-explanation show"><h4>Description</h4>${escapeHtml(q.overall).replace(/\n/g, '<br>')}</div>`
    : '';

  quizCard.innerHTML = `
    ${q.domain ? `<div class="domain-tag">${escapeHtml(q.domain)}</div>` : ''}
    <div class="q-title">Question ${qIndex + 1} of ${QUESTIONS.length}</div>
    <div class="prompt">${escapeHtml(q.prompt)}</div>
    <div class="options">${optionsHtml}</div>
    ${bannerHtml}
    ${overallHtml}
  `;

  quizCard.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(qIndex, btn.dataset.letter));
  });
}

function renderSummary() {
  const { correct } = score();
  const pct = Math.round((correct / QUESTIONS.length) * 100);
  quizCard.innerHTML = `
    <div class="summary-card">
      <div class="q-title">Quiz complete</div>
      <div class="big-score">${correct} / ${QUESTIONS.length}</div>
      <div>${pct}% correct</div>
    </div>`;
}

function render() {
  if (current >= QUESTIONS.length) {
    current = QUESTIONS.length - 1;
  }
  renderQuestion(QUESTIONS[current], current);
  updateHeader();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

prevBtn.addEventListener('click', () => {
  if (current > 0) { current--; render(); }
});

nextBtn.addEventListener('click', () => {
  if (current < QUESTIONS.length - 1) {
    current++;
    render();
  } else {
    renderSummary();
  }
});

restartBtn.addEventListener('click', () => {
  userAnswers.fill(null);
  current = 0;
  render();
});

buildNav();
render();
</script>
</body>
</html>
